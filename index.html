 {id:'ev_bully',min:7,max:13,w:4,run:()=>{const b=pick(MALE);ask('The kid by the fence',`There is a boy named ${b} who has decided, for reasons you will never learn, that you are the one. He takes your lunch money twice a week and has started telling people things about you that are not true. Today he shoved you into the fence hard enough to draw blood, and nobody stopped him.`,[
  {label:'Fight back',sub:'He is bigger than you.',fn:()=>{ if(chance(0.4+K.combat/200)){log(`You swung first and connected. ${b} went down harder than either of you expected, and when he got up he was crying, and the yard was silent. He never touched you again. Something in you learned that the world respects the person who hits back.`,'good');K.combat+=4;S.happiness+=4;thread('beatbully',{name:b});} else {log(`You swung and missed, and what he did next put you in the nurse's office for the afternoon. You learned that losing in front of people is a specific kind of pain.`,'bad');S.health-=6;S.happiness-=5;K.combat+=2;}}},
  {label:'Tell a teacher',fn:()=>{log(`You told Mrs. Adler. ${b} got two days of suspension and came back meaner but more careful. The other kids called you a snitch for a while, and then forgot, the way kids do. You did not forget.`);S.happiness-=2;S.stress+=4;thread('bullied',{name:b});}},
  {label:'Take it',sub:'Keep your head down.',fn:()=>{log(`You took it. You got very good at being invisible, at knowing which hallway ${b} used and being in the other one. You learned to read a room before you entered it, and that skill would pay off in ways you couldn't imagine yet. But you carried him with you.`);K.stealth+=5;S.happiness-=6;S.stress+=6;thread('bullied',{name:b});}},
 ]);}},
 {id:'ev_kindkid',min:6,max:12,w:3,run:()=>{const n=pick(FEMALE.concat(MALE));ask('The new kid',`A kid named ${n} moved here mid-year and sits alone at lunch, picking at a sandwich, not looking at anyone. You have noticed. So has everyone else, which is the problem.`,[
  {label:'Sit with them',fn:()=>{log(`You sat down across from ${n}, said something dumb about the sandwich, and they laughed like they'd been holding their breath for a month. You were friends by the end of the week.`,'good');addNPC('friend',n,G.age);S.happiness+=4;thread('kindness',{name:n});}},
  {label:'Leave it',fn:()=>{log(`You didn't. It wasn't cruelty, exactly. You just didn't want to be the kid who sat with the kid nobody sat with. ${n} moved away the next summer and you never thought about it again, until years later, when you did.`);}},
 ]);}},
 {id:'ev_grades',min:8,max:17,w:3,run:()=>{ if(S.smarts>60){log(`Your report card came home with a teacher's note on it: "a pleasure to teach." Your mother put it on the fridge with the magnet from the pizza place, where it stayed for years.`,'good');S.happiness+=3;} else {log(`Your grades slipped this year. Your father asked what was going on and you said nothing, which was true, in the sense that nothing was going on and that was the problem.`);S.stress+=3;}}},
 {id:'ev_petdies',min:6,max:16,w:2,run:()=>log(`The dog died. It happened slowly and then all at once, the way it does, and you were the one who found him in the morning. You didn't cry until later, alone, and then you couldn't stop.`,'bad',()=>{S.happiness-=8;})},
 {id:'ev_teenparty',min:14,max:17,w:4,run:()=>ask('The party',`There's a party at a house whose parents are out of town. Everyone is going. There will be beer and probably worse, and if your parents knew where you were they would end you.`,[
  {label:'Go',fn:()=>{if(chance(0.25)){log(`The cops came at eleven. You ran out the back and cut your hand on a fence and lay in someone's flowerbed for forty minutes listening to a radio crackle. It is, honestly, one of the best nights of your life.`,'good');S.happiness+=6;K.stealth+=3;} else {log(`You went. You drank something orange from a cooler, kissed someone in a hallway, and threw up in a bush. You felt, briefly, like a person in a movie.`,'good');S.happiness+=5;K.charisma+=2;G.addiction.alcohol+=4;}}},
  {label:'Stay home',fn:()=>{log(`You stayed home. On Monday everyone had a story and you had the plot of a book you'd read. You told yourself it didn't matter. It sort of did.`);S.happiness-=2;S.smarts+=1;}},
 ])},
 {id:'ev_firstlove',min:15,max:19,w:3,cond:()=>!partner(),run:()=>{const n=G.sex==='Male'?pick(FEMALE):pick(MALE);log(`You fell in love with ${n} in a way that made everything before it look like practice. You spent a whole summer in their passenger seat. It ended in October, badly, over something neither of you could later remember. You have never quite gotten over the way it felt at the start.`);S.happiness+=3;K.charisma+=3;const p=addNPC('ex',n,G.age+rnd(-1,2));p.loyalty=35;p.memory.push(`Dated ${G.name} at ${G.age}. Ended badly.`);}},
 {id:'ev_layoff',min:22,max:62,w:3,cond:()=>G.job&&JOB[G.job.id].kind==='full',run:()=>{const j=JOB[G.job.id];if(chance(0.5)){log(`The company "restructured." Your whole department got a meeting invite with no agenda, which is how you knew. You cleaned out your desk into a box that used to hold printer paper. ${j.title}, gone in a morning.`,'bad');quitJob(true);S.stress+=15;S.happiness-=10;} else {log(`Rumors of layoffs went around the office for months. You lived on coffee and dread. In the end your team was spared, and you went back to pretending it had never worried you.`);S.stress+=6;}}},
 {id:'ev_raise',min:20,max:65,w:3,cond:()=>G.job&&G.job.perf>60,run:()=>{const r=Math.round(JOB[G.job.id].pay*rnd(4,12)/100);G.job.bonus=(G.job.bonus||0)+r;log(`Your manager pulled you aside, closed the door, and told you the company wanted to keep you. Your salary went up by ${money(r)}. You called someone from the parking garage to tell them.`,'money');S.happiness+=4;}},
 {id:'ev_mentor',min:19,max:40,w:2,cond:()=>G.job,run:()=>{const n=pick(MALE.concat(FEMALE));log(`An older colleague named ${n} took an interest in you for no reason you could see. They gave you the advice nobody else would, corrected you in private and praised you in public, and told you once, drunk at a work party, that you reminded them of themselves. You took it for granted.`,'good');thread('mentor',{name:n});K.business+=4;}},
 {id:'ev_carwreck',min:16,max:80,w:2,cond:()=>hasTag('car')||hasTag('moto'),run:()=>{const drunk=G.addiction.alcohol>30&&chance(0.5);if(chance(0.6)){log(`Someone ran a red light and folded the front of your car like a paper cup. You walked away shaking. The insurance fight took eight months.`,'bad');S.health-=8;S.stress+=8;damageVehicle(40);} else {log(`You wrecked the car. ${drunk?'You had been drinking, and you know exactly how much, and so does the officer who found you.':'It was raining and you were going too fast and there was a deer.'} `,'bad');S.health-=15;damageVehicle(70);if(drunk){thread('dui',{});G.record.push({crime:'DUI',age:G.age});S.stress+=15;}}}},
 {id:'ev_parentsick',min:25,max:60,w:2,cond:()=>livingParents().length>0,run:()=>{const p=pick(livingParents());ask('The call',`Your ${p.role} is sick. The kind of sick with a schedule of appointments and a word nobody says out loud. They need someone to drive them, sit with them, deal with the paperwork. It will eat your year.`,[
  {label:'Be there',sub:'Whatever it costs you.',fn:()=>{log(`You were there for every appointment. You learned the nurses' names and the good vending machine and what your ${p.role} looked like when they were scared and trying not to be. It cost you at work and it cost you at home and you would do it again.`,'good');p.loyalty=clamp(p.loyalty+25);p.memory.push(`${G.name} was there when I was sick.`);S.stress+=15;S.happiness-=3;if(G.job)G.job.perf-=10;family().forEach(f=>{if(f!==p)f.loyalty=clamp(f.loyalty+8);});}},
  {label:'Send money, stay away',fn:()=>{const c=Math.min(G.cash,8000);pay(c);log(`You sent money and called on Sundays. It was easier, and you told yourself it was practical. Your ${p.role} never said a word about it. Your siblings did.`);p.loyalty=clamp(p.loyalty-15);p.memory.push(`${G.name} sent money instead of coming.`);family().forEach(f=>{if(f!==p)f.loyalty=clamp(f.loyalty-12);});thread('absent',{npc:p.id});}},
 ]);}},
 {id:'ev_friendneed',min:18,max:70,w:3,cond:()=>friends().length>0&&G.cash>2000,run:()=>{const f=pick(friends());const amt=Math.min(Math.round(G.cash*0.3),rnd(1500,15000));ask(`${f.name} needs help`,`${f.name} calls late, voice wrong. They're in trouble with money — the specifics are messy and involve a car and a cousin and a deadline. They need ${money(amt)} and they need it this week. They have never asked you for anything.`,[
  {label:`Lend the ${money(amt)}`,fn:()=>{pay(amt);log(`You sent it. ${f.name} cried on the phone and promised to pay it back, and you both knew the promise was the point, not the money.`,'good');f.loyalty=clamp(f.loyalty+20);f.memory.push(`${G.name} lent me ${money(amt)} when I was drowning.`);thread('lent',{npc:f.id,amt});}},
  {label:'Say no',fn:()=>{log(`You said no, gently, with reasons. ${f.name} said they understood. The calls got shorter after that, and then stopped.`);f.loyalty=clamp(f.loyalty-30);f.memory.push(`I asked ${G.name} for help once. They said no.`);}},
 ]);}},
 {id:'ev_windfall',min:18,max:90,w:1,run:()=>{const a=rnd(2000,40000);G.cash+=a;log(`A relative you barely remember died and left you ${money(a)}, along with a box of photographs of people you can't identify. You kept the box.`,'money');}},
 {id:'ev_medical',min:30,max:90,w:3,cond:()=>S.health<55,run:()=>{const bill=rnd(4000,60000);ask('The diagnosis',`The doctor used a lot of words and one of them was "serious." Treatment will cost around ${money(bill)} and take a year of your attention. Without it, you are gambling.`,[
  {label:'Get treated',fn:()=>{pay(bill,true);log(`You did the treatment. It was tedious and humiliating and it worked, mostly. You have a scar and a new relationship with your own mortality.`,'good');S.health+=18;S.stress+=8;}},
  {label:'Refuse',sub:'It might be fine.',fn:()=>{if(chance(0.4)){log(`You refused, and it turned out to be fine, and you have told the story at parties ever since as if it proves something. It doesn't.`);}else{log(`You refused. It got worse. By the time you went back it was harder and more expensive, and the doctor didn't say "I told you so," which was somehow worse.`,'bad');S.health-=20;pay(bill*1.6,true);}}},
 ]);}},
 {id:'ev_affairoffer',min:24,max:60,w:2,cond:()=>partner()&&!!G.job,run:()=>{const n=G.sex==='Male'?pick(FEMALE):pick(MALE);ask('After the conference',`A coworker named ${n} has been finding reasons to talk to you for months. Tonight, in a hotel bar three cities from home, they stop pretending. Nobody would know.`,[
  {label:'Go upstairs',fn:()=>{const p=partner();log(`You went upstairs. It was exactly as good and as terrible as you knew it would be. In the morning you flew home and kissed ${p.name} at the door and felt, for the first time, like a stranger in your own house.`);S.happiness+=3;S.stress+=10;thread('cheated',{npc:p.id,name:n});}},
  {label:'Say goodnight',fn:()=>{log(`You said goodnight and went up alone and lay awake feeling virtuous and robbed in equal measure. ${n} was cool to you at work after that. You never told anyone, and there was nothing to tell, which is the point.`,'good');S.happiness+=1;S.stress-=2;}},
 ]);}},
 {id:'ev_lotteryfriend',min:18,max:80,w:1,run:()=>log(`A guy you went to high school with won the lottery. Not a lot — six figures — but enough that he quit the plant and bought a boat and posted about it constantly. You felt something ugly and small and were not proud of it.`,()=>{S.happiness-=2;})},
 {id:'ev_burglary',min:20,max:90,w:2,cond:()=>G.home&&G.home!=='parents',run:()=>{const loss=Math.min(G.cash,rnd(500,6000));pay(loss);log(`Someone broke into your place while you were out. They took ${money(loss)} in cash and electronics and, worse, went through your drawers. You changed the locks and didn't sleep right for a month.`,'bad');S.stress+=10;S.happiness-=5;}},
 {id:'ev_kidtrouble',min:30,max:70,w:3,cond:()=>kids().some(k=>k.age>=13&&k.age<=18),run:()=>{const k=pick(kids().filter(k=>k.age>=13&&k.age<=18));ask(`${k.name}, ${k.age}`,`The school calls. ${k.name} was caught with something they shouldn't have had, and there's a meeting, and a tone in the principal's voice that suggests this isn't the first thing.`,[
  {label:'Come down hard',fn:()=>{log(`You came down hard: phone gone, door off the hinges, the works. ${k.name} stopped talking to you for months. Whether it worked is a question you'll be asking for years.`);k.loyalty=clamp(k.loyalty-15);k.memory.push(`Got caught at school. Parent lost it.`);S.stress+=8;}},
  {label:'Sit and listen',fn:()=>{log(`You sat on the edge of the bed and didn't say anything for a long time, and eventually ${k.name} talked. It wasn't about the thing at school. It never is. You didn't fix it, but you were in the room.`,'good');k.loyalty=clamp(k.loyalty+15);k.memory.push(`Got caught at school. Parent actually listened.`);}},
  {label:'Let the other parent handle it',cond:()=>!!partner(),fn:()=>{log(`You let ${partner()?partner().name:'your spouse'} handle it. You were busy. ${k.name} noticed which parent showed up.`);k.loyalty=clamp(k.loyalty-10);k.memory.push(`Only one parent came to the meeting. Not this one.`);thread('neglected',{npc:k.id});}},
 ]);}},
 {id:'ev_reunion',min:28,max:60,w:2,run:()=>log(`Your class reunion happened in a hotel ballroom with a cash bar. Everyone was fatter and kinder than you remembered. Someone said you looked exactly the same, which was a lie, and you loved them for it.`,()=>{S.happiness+=3;})},
 {id:'ev_tax',min:22,max:80,w:2,cond:()=>G.cash>20000,run:()=>{const a=Math.round(G.cash*rnd(4,12)/100);pay(a,true);log(`The tax people found a mistake from three years ago. It was your mistake. They wanted ${money(a)} and they were not interested in your feelings about it.`,'bad');S.stress+=6;}},
 {id:'ev_fanmail',min:18,max:80,w:3,cond:()=>S.fame>30,run:()=>{if(chance(0.5)){log(`A stranger recognized you at a gas station and asked for a picture. Their hands were shaking. You were kind about it, and drove away feeling like a fraud and a king at once.`,'good');S.happiness+=3;}else{log(`Someone posted a photo of you looking terrible outside a pharmacy and it got two million views. The comments were a lesson in what people think they're owed by a face they know.`,'bad');S.happiness-=5;S.stress+=6;}}},
 {id:'ev_scandal',min:20,max:80,w:2,cond:()=>S.fame>40&&(G.addiction.drugs>30||G.record.length>0),run:()=>log(`A tabloid ran a story about you. The details were mostly right, which was the problem. Your publicist used the word "narrative" a lot. Your mother called and asked if it was true and you said it was complicated.`,'bad',()=>{S.fame-=6;S.happiness-=8;S.stress+=12;})},
 {id:'ev_stalker',min:22,max:60,w:1,cond:()=>S.fame>60,run:()=>log(`Someone has been sending letters. Then they were outside the gate. Then they were inside it. You have security now, and a restraining order, and a new understanding of what a locked door is for.`,'bad',()=>{S.stress+=15;pay(30000,true);})},
 {id:'ev_midlife',min:40,max:52,w:2,run:()=>ask('The thing at 3 a.m.',`You woke at 3 a.m. with the clear, cold knowledge that more of your life is behind you than ahead. It isn't a thought so much as a temperature. It stays with you all week.`,[
  {label:'Buy something loud',sub:'The cliché exists for a reason.',fn:()=>{const c=Math.min(G.cash,60000);pay(c);log(`You bought something loud and red and impractical. It did not fix anything, and it was also completely worth it, and both of those things are true.`);S.happiness+=6;}},
  {label:'Sit with it',fn:()=>{log(`You sat with it. You called someone you'd been meaning to call. You went for a walk without your phone. It didn't go away, but it got quieter, and you got better at hearing what it was actually saying.`,'good');S.stress-=8;K.discipline+=3;}},
 ])},
 {id:'ev_grandkid',min:45,max:85,w:2,cond:()=>kids().some(k=>k.age>=24),run:()=>log(`A grandchild. You held a person who will remember you as old and think of you as having always been old, and you decided you didn't mind.`,'good',()=>{S.happiness+=10;})},
 {id:'ev_oldfriend',min:35,max:90,w:2,cond:()=>friends().length>0,run:()=>{const f=pick(friends());log(`${f.name} came through town and you got dinner. Three hours vanished. Walking to the car you realized how few people are left who knew you before you were finished being made.`,'good');S.happiness+=5;f.loyalty=clamp(f.loyalty+6);}},
 {id:'ev_spousedistance',min:28,max:70,w:3,cond:()=>partner()&&partner().loyalty<45,run:()=>{const p=partner();ask('The quiet',`Something has gone quiet between you and ${p.name}. Not a fight. Worse than a fight: the absence of one. You pass in the kitchen like coworkers. You know exactly when it started and you have been not saying so for a year.`,[
  {label:'Say it out loud',fn:()=>{if(chance(0.5+K.charisma/250)){log(`You said it out loud. It was a terrible conversation and then a long one and then, near midnight, an honest one. Nothing was fixed. But you were in the same room again, actually in it.`,'good');p.loyalty=clamp(p.loyalty+18);p.memory.push(`${G.name} finally talked to me about the distance.`);}else{log(`You said it out loud. ${p.name} said "I know," and that was somehow the end of the conversation. Some things, once named, stop pretending.`,'bad');p.loyalty=clamp(p.loyalty-10);}}},
  {label:'Let it ride',fn:()=>{log(`You let it ride. There's a comfort in not knowing what the other person would say. You told yourself all marriages have seasons. This one had a winter.`);p.loyalty=clamp(p.loyalty-12);p.memory.push(`${G.name} let the silence sit.`);}},
 ]);}},
 {id:'ev_promo_offer',min:22,max:60,w:2,cond:()=>G.job&&JOB[G.job.id].next.length>0&&G.job.perf>70,run:()=>{const nx=JOB[G.job.id].next[0];const nj=JOB[nx];ask('The offer',`Your boss offers you the ${nj.title} job. More money — ${money(nj.pay)} — and more hours, more travel, more of the part of the job you like least. They need an answer by Friday.`,[
  {label:'Take it',fn:()=>{setJob(nx);log(`You took it. Congratulations came from people who had never spoken to you. The first month you worked every weekend and told everyone you loved it.`,'money');S.stress+=8;}},
  {label:'Turn it down',fn:()=>{log(`You turned it down. Your boss looked at you like you'd spoken another language. You went home at five for the rest of the year and it was the best year you'd had in a while. Nobody offered again for a long time.`);S.stress-=8;S.happiness+=4;G.job.perf-=15;}},
 ]);}},
 {id:'ev_addictbottom',min:16,max:90,w:5,cond:()=>G.addiction.alcohol>60||G.addiction.drugs>60,run:()=>{const which=G.addiction.drugs>G.addiction.alcohol?'drugs':'alcohol';const loss=Math.min(G.cash,rnd(1000,20000));pay(loss);log(`This was a lost year. ${which==='drugs'?'The drugs':'The drinking'} took ${money(loss)} and most of your mornings and at least one relationship you didn't notice ending. You look older than you are. People have stopped saying anything, which is how you know it's bad.`,'bad');S.health-=10;S.looks-=4;S.happiness-=6;if(G.job&&chance(0.4)){log(`You lost the job. There was an incident. Nobody uses the word "fired" to your face.`,'bad');quitJob(true);}allNPCs().forEach(n=>n.loyalty=clamp(n.loyalty-8));}},
 {id:'ev_famous_chance',min:16,max:45,w:2,cond:()=>!G.special&&(K.acting>40||K.music>40||K.athletics>50),run:()=>{const c=K.acting>=K.music&&K.acting>=K.athletics?'actor':K.music>=K.athletics?'musician':'athlete';log(`Someone who matters saw you ${c==='actor'?'in a small show':c==='musician'?'play a set':'play'} and left a card. "Call me," they said. You could hear the shape of a different life in it.`,'good');G.flags.scout=c;}},
 {id:'ev_prop_break',min:18,max:90,w:3,cond:()=>G.props.some(p=>p.cond<50),run:()=>{const p=pick(G.props.filter(p=>p.cond<50));const c=Math.round(PROP[p.id].price*0.02+rnd(1000,8000));pay(c,true);log(`Something failed at the ${PROP[p.id].name.toLowerCase()} — a pipe, a roof, the furnace at 2 a.m. in January. You had been putting off the maintenance. It cost ${money(c)}, which is what putting it off costs.`,'bad');p.cond=clamp(p.cond-10);S.stress+=6;}},
 {id:'ev_nothing',min:0,max:120,w:4,run:()=>log(pick([`Nothing much happened this year. You were grateful for that in the way you only learn to be later.`,`A quiet year. You watched a lot of television and meant to do more and mostly didn't, and it was fine.`,`The year went by like weather. You remember one good dinner and a song that was everywhere and not much else.`,`This year was a hallway between two rooms. You walked it.`]))},

 /* ===================== EXPANDED EVENT LIBRARY (SMIS voice) ===================== */
 // ---- school & childhood (while in school) ----
 {id:'ev_casting',min:6,max:12,w:3,cond:()=>G.inSchool,run:()=>ask('The school play',`Your school is putting on a production, and there is an open casting call. The gym smells like floor polish and nerves, and a teacher with a clipboard is waving kids up onto the little stage under the lights.`,[
  {label:'Audition for the lead',fn:()=>{ if(chance(0.4+(K.acting||0)/120+S.looks/300)){K.acting=clamp((K.acting||0)+6);S.happiness+=5;if(G.school)G.school.popularity=clamp(G.school.popularity+6);log(`You got the lead. Opening night your hands shook until the lights hit, and then something in you went very still and very sure. Your parents filmed the whole thing badly and cried anyway.`,'good');} else {K.acting=clamp((K.acting||0)+2);log(`You did not get the lead. You got Tree Number Two, which you played with more commitment than the part strictly required. Someone laughed at exactly the right moment and you decided that counted.`);} }},
  {label:'Try out for stage crew',fn:()=>{K.tech=clamp((K.tech||0)+4);K.discipline=clamp((K.discipline||0)+2);log(`You worked the ropes and the lights from the dark of the wings, and learned that the people who make the thing happen are almost never the ones the audience claps for. You did not mind. You liked the dark, and the walkie-talkie.`);}},
  {label:'Not for me',fn:()=>{log(`You sat it out. Drama was for the drama kids, you told yourself, in the exact voice you used for the things you secretly wanted.`);}},
 ])},
 {id:'ev_classclown',min:8,max:16,w:4,cond:()=>G.inSchool,run:()=>{const t=pick(LAST);ask('The perfect line',`Mr. ${t} asks the class a question, and in the half-second of silence the perfect joke arrives in your head, fully formed and devastating. Then he calls on you by name.`,[
  {label:'Rip the joke',fn:()=>{ if(chance(0.65)){if(G.school)G.school.popularity=clamp(G.school.popularity+8);S.happiness+=3;K.charisma=clamp((K.charisma||0)+3);G.gpaSeed=clamp(G.gpaSeed-2);log(`The room detonated. Even Mr. ${t} fought a smile before sending you to the hall. It was worth it. For one afternoon you were the funniest person alive, and for once everyone agreed.`,'good');} else {if(G.school)G.school.popularity=clamp(G.school.popularity-4);S.happiness-=3;log(`Dead silence. One cough. Mr. ${t} let it hang there until you wished the floor would open. Comedy is timing, and yours, today, was a small crime against the room.`,'bad');}}},
  {label:'Answer it straight',fn:()=>{G.gpaSeed=clamp(G.gpaSeed+3);S.smarts=clamp(S.smarts+1);log(`You swallowed the joke and gave the real answer, which happened to be correct. Mr. ${t} nodded. Two kids mouthed the joke you did not make. You will never know if it would have landed.`);}},
 ]);}},
 {id:'ev_answerkey',min:13,max:17,w:3,cond:()=>G.inSchool,run:()=>{const n=pick(MALE.concat(FEMALE));ask('The answer key',`A big test is coming, the kind that decides things. Your classmate ${n} leans across the aisle, grinning, and says they lifted the answer key off the teacher's desk. They will share it, for a laugh or a favor.`,[
  {label:'Take the answers',fn:()=>{ if(chance(0.75)){G.gpaSeed=clamp(G.gpaSeed+6);S.stress+=6;log(`You aced it. So did ${n}, and three others, and the pattern was loud enough that you spent a month waiting for a hand on your shoulder that never came. You got away with it, which taught you the wrong lesson beautifully.`);} else {G.gpaSeed=clamp(G.gpaSeed-8);S.happiness-=6;if(G.school)G.school.popularity=clamp(G.school.popularity-8);log(`The teacher knew. Of course the teacher knew. A zero, a phone call home, and a reputation that outran you down every hallway for the rest of the year.`,'bad');thread('cheated_school',{name:n});}}},
  {label:'Report it',fn:()=>{if(G.school)G.school.popularity=clamp(G.school.popularity-6);K.discipline=clamp((K.discipline||0)+3);log(`You told the teacher. ${n} was suspended, and somehow everyone knew it was you, and the word snitch followed you like a smell. You did the right thing. It cost you, the way it usually does.`);}},
  {label:'Just study',fn:()=>{G.gpaSeed=clamp(G.gpaSeed+3);S.smarts=clamp(S.smarts+1);S.stress+=3;log(`You put your head down and earned your grade the slow way. It came back lower than theirs. You slept fine, which you told yourself was worth the difference, and mostly believed it.`,'good');}},
 ]);}},
 {id:'ev_vape',min:12,max:17,w:3,cond:()=>G.inSchool,run:()=>ask('The bathroom',`A knot of kids by the sinks waves you over. One of them holds out a vape that smells like fake fruit and raises an eyebrow. The bell is about to ring.`,[
  {label:'Try it',fn:()=>{G.gpaSeed=clamp(G.gpaSeed-2);if(G.school)G.school.popularity=clamp(G.school.popularity+4);S.health=clamp(S.health-2);log(`You took a pull and coughed like you were dying, and everyone laughed, but the good kind. You spent the rest of the day feeling like you had joined something and lost something at the same time.`);}},
  {label:'Pass',fn:()=>{S.health=clamp(S.health+1);log(`You passed. It was less dramatic than you feared, a shrug and a moment that moved on without you. You went to class with your lungs still your own.`,'good');}},
  {label:'Tell a teacher',fn:()=>{if(G.school)G.school.popularity=clamp(G.school.popularity-6);log(`You told. The kids got caught, and you got a quiet, careful loneliness that lasted weeks. You were right. Being right at that age is often a solitary business.`);}},
 ])},
 {id:'ev_peprally',min:14,max:17,w:2,cond:()=>G.inSchool,run:()=>{if(chance(0.6)){if(G.school)G.school.popularity=clamp(G.school.popularity+4);S.happiness+=3;log(`The whole school crammed into the gym for a pep rally, and despite yourself you screamed until your voice cracked alongside a thousand kids who would all pretend to be too cool for it by Monday. For one hour you belonged to something loud.`,'good');}else{S.smarts=clamp(S.smarts+1);log(`You spent the pep rally reading in the corner of the bleachers while the gym roared below you. You told yourself you were above it. You were, a little, and lonelier for it.`);}}},
 // ---- work (has a job) ----
 {id:'ev_overtime',min:18,max:65,w:4,cond:()=>G.job,run:()=>{const boss=pick(LAST);ask('The ask',`Your manager, ${boss}, stops by your desk at 4:55 and asks, in the voice that is not really asking, whether you can start putting in some extra hours. Unpaid, of course. For the team.`,[
  {label:'Put in the hours',fn:()=>{G.job.perf=clamp(G.job.perf+12);S.stress+=10;S.happiness-=3;log(`You said yes and meant it and stayed late for a season, and ${boss} started saying your name in meetings. You told yourself it was an investment. Your dinners went cold on the counter, one after another.`,'good');}},
  {label:'Draw the line',fn:()=>{G.job.perf=clamp(G.job.perf-8);S.stress=clamp(S.stress-4);log(`You explained, politely, that you had a life outside the building. ${boss} said "of course" with their mouth and something else with their eyes. Your name stopped coming up. You went home at five and were, on balance, happier for it.`);}},
  {label:'Refuse, and let them have it',fn:()=>{G.job.perf=clamp(G.job.perf-20);S.stress=clamp(S.stress-8);S.happiness+=3;log(`You told ${boss} exactly where to file their unpaid overtime. It felt incredible for eleven seconds. Then you remembered you needed this job, and watched the temperature in the room drop about ten degrees.`,'bad');}},
 ]);}},
 {id:'ev_teambuilding',min:18,max:65,w:2,cond:()=>G.job,run:()=>ask('Team building',`The company is sponsoring a team-building outing, an afternoon of forced fun involving, apparently, a ropes course and trust falls. Attendance is "optional."`,[
  {label:'Go along',fn:()=>{G.job.perf=clamp(G.job.perf+6);S.happiness+=2;log(`You went. You fell backward into the arms of people you email but never speak to, and one of them turned out to be genuinely funny, and the whole thing was less terrible than advertised. Your standing quietly rose.`,'good');}},
  {label:'Skip it',fn:()=>{G.job.perf=clamp(G.job.perf-6);log(`You skipped it and earned a pointed, all-caps mention in a follow-up email about "the whole team." You had a lovely afternoon. It cost you a little.`);}},
 ])},
 {id:'ev_officerumor',min:19,max:63,w:3,cond:()=>G.job,run:()=>{const n=pick(MALE.concat(FEMALE));ask('The rumor',`Word gets back to you that ${n}, a coworker, has been spreading something about you around the office. It is half true, which is the worst amount for a rumor to be.`,[
  {label:'Confront them',fn:()=>{if(chance(0.5+(K.charisma||0)/250)){log(`You pulled ${n} aside and said the quiet part out loud, calmly, in a way that left no room to wriggle. They folded. The rumor died, and your reputation as someone not to trifle with quietly grew.`,'good');K.charisma=clamp((K.charisma||0)+3);}else{log(`You confronted ${n} and it became a scene, and now there were two rumors, one of them being that you could not handle yourself. HR sent a calendar invite with a vague subject line.`,'bad');S.stress+=8;G.job.perf=clamp(G.job.perf-6);}}},
  {label:'Rise above it',fn:()=>{S.stress+=4;log(`You said nothing and let your work do the talking. It mostly worked, over months, the slow way. Some people still believe the rumor. Some people always will. You made a rough peace with that.`);}},
  {label:'Start one back',fn:()=>{G.notoriety=(G.notoriety||0)+2;log(`You started a better rumor about ${n}. It traveled faster than theirs, because yours had a villain and a punchline. You won. You also became, in a small way, the kind of person who does that.`);thread('office_war',{name:n});}},
 ]);}},
 {id:'ev_shadyask',min:22,max:63,w:2,cond:()=>G.job,run:()=>ask('Off the books',`A senior person asks you, casually, to make a number say something it does not. Round the wrong way, lose an email, look at the wall for a minute. It would help everyone. It would especially help them.`,[
  {label:'Do it',fn:()=>{G.job.perf=clamp(G.job.perf+10);const bonus=rnd(2000,12000);G.cash+=bonus;S.stress+=8;log(`You did it, and the number behaved. A bonus of ${money(bonus)} appeared with no note attached, which was the whole point. You are useful now, in the specific way that is very hard to stop being.`,'money');thread('complicit',{});}},
  {label:'Refuse',fn:()=>{G.job.perf=clamp(G.job.perf-10);K.discipline=clamp((K.discipline||0)+3);log(`You said you were not comfortable with that. The temperature changed. You were not asked again, and also not promoted again, and you learned which of those the company actually rewarded.`,'good');}},
 ])},
 // ---- friends & family ----
 {id:'ev_friendmove',min:16,max:70,w:2,cond:()=>friends().length>0,run:()=>{const fr=pick(friends());ask('The favor',`${fr.name} is moving apartments this weekend and asks, with the specific hope of someone who has run out of other people to ask, whether you will help. There will be stairs. There is always a couch, and the couch is always cursed.`,[
  {label:'Show up',fn:()=>{fr.loyalty=clamp(fr.loyalty+12);S.stress+=3;S.fitness=clamp(S.fitness+1);log(`You showed up with coffee and a bad back waiting to happen, and got the couch around the impossible corner through pure spite and geometry. ${fr.name} bought the pizza and meant the thank-you. That is most of what friendship is: showing up for the couch.`,'good');}},
  {label:'Make an excuse',fn:()=>{fr.loyalty=clamp(fr.loyalty-8);log(`You texted a plausible excuse and felt the small, specific guilt of the free Saturday you had bought with it. ${fr.name} said no worries. People always say no worries. It is rarely no worries.`);}},
 ]);}},
 {id:'ev_friendfraud',min:18,max:60,w:1,cond:()=>friends().length>0,run:()=>{const fr=pick(friends());ask('A bad idea',`${fr.name} has a plan. It involves their car, a quiet field, a can of gas, and an insurance company, and they are describing it like it is clever instead of arson.`,[
  {label:'Help them',fn:()=>{ if(chance(0.55)){const cut=rnd(2000,9000);G.cash+=cut;log(`You helped. The car went up beautifully, the story held, and ${fr.name} slipped you ${money(cut)} for your trouble. You are bound to them now by a secret, which is a heavier thing than either of you understood at the time.`,'money');thread('accomplice',{name:fr.name});}else{log(`It went wrong. An investigator with patient eyes asked the same question four ways. You were charged, and so was ${fr.name}, and the friendship did not survive the depositions.`,'bad');G.record.push({crime:'insurance fraud',age:G.age});S.stress+=15;}}},
  {label:'Talk them out of it',fn:()=>{fr.loyalty=clamp(fr.loyalty+6);K.discipline=clamp((K.discipline||0)+2);log(`You talked them down over two beers and one long silence. ${fr.name} did not do it, and never thanked you, and probably never will, and that is what talking someone out of the worst version of themselves usually earns you.`,'good');}},
  {label:'Refuse and walk',fn:()=>{fr.loyalty=clamp(fr.loyalty-10);log(`You said no and left. ${fr.name} did it anyway, alone, and it went how those things go. They blamed you a little, for not being there. You slept fine.`);}},
 ]);}},
 {id:'ev_siblingfeud',min:10,max:75,w:2,cond:()=>G.npcs.some(n=>n.alive&&n.role==='sibling'),run:()=>{const sib=pick(G.npcs.filter(n=>n.alive&&n.role==='sibling'));ask(`${sib.name}`,`You and your ${sib.label}, ${sib.name}, are at war again over something ancient and stupid that is really about something old and real. The family is picking sides, and a holiday is coming.`,[
  {label:'Make the first move',fn:()=>{sib.loyalty=clamp(sib.loyalty+15);S.happiness+=3;log(`You called first, which felt like losing and was not. ${sib.name} cried, or you did, or the line just went quiet in the way that means the same thing. You are the one who reaches out now. Someone has to be.`,'good');family().forEach(fm=>{if(fm!==sib)fm.loyalty=clamp(fm.loyalty+4);});}},
  {label:'Dig in',fn:()=>{sib.loyalty=clamp(sib.loyalty-12);S.stress+=5;log(`You dug in. You were right, which is the most expensive thing a person can be. The holiday was a demilitarized zone, everyone left early, and the thing between you calcified into something you would both carry for years.`);thread('estranged',{npc:sib.id});}},
  {label:'Stay out of it',fn:()=>{log(`You refused to play. You loved them both and told them both so and would not take a side, and both of them, briefly, were furious with you instead of each other. Which was, you suspected, a small kind of win.`);}},
 ]);}},
 // ---- health (general, adult) ----
 {id:'ev_healthscare',min:30,max:85,w:3,cond:()=>!G.special,run:()=>ask('The results',`A routine check turned up something the doctors want to look at more closely. Probably nothing, they say, in the tone doctors use that makes probably nothing sound like a coin toss. There are more appointments, a bill, and a week of waiting.`,[
  {label:'See the specialist',fn:()=>{const c=Math.min(G.cash,rnd(2000,9000));pay(c,true);if(chance(0.8)){S.health=clamp(S.health+6);S.stress=clamp(S.stress-4);log(`You went, you paid the ${money(c)}, you sat in the paper gown feeling like a child. In the end it was, in fact, probably nothing, caught early and handled. Relief has a physical weight, and you felt it lift off your chest in the parking lot.`,'good');}else{S.health=clamp(S.health-10);S.stress+=10;log(`It was something after all. They caught it because you came in, which the doctor said mattered, and you believed her because you had to. A hard road, at least started on time.`,'bad');}}},
  {label:'Tough it out',fn:()=>{if(chance(0.55)){S.health=clamp(S.health-4);log(`You skipped the follow-ups. You felt fine, mostly, and the bill you did not pay felt better than the one you would have. You will never know what it was. Probably nothing.`);}else{S.health=clamp(S.health-18);S.stress+=12;log(`You let it go, and it did not return the favor. By the time you could not ignore it anymore, the word the doctors used was advanced, and you spent a long while doing math about the appointment you skipped.`,'bad');}}},
 ])},
 // ---- world / flavor (grounded, in voice) ----
 {id:'ev_world',min:5,max:95,w:5,run:()=>{const co=Object.keys(COUNTRIES);const c1=pick(co);const line=pick([
   `A factory two towns over closed for good. The evening news showed men your father's age standing in a parking lot holding boxes, not talking. Nobody you knew worked there. It stayed with you anyway.`,
   `There was a flood somewhere far away, ${c1} this time, and for a week the whole world watched water take the places people had meant to grow old in. Then it stopped being on the news, though not, presumably, for them.`,
   `A local kid you had never met made it big, and for a season the whole town claimed her. The diner put up a framed photo. It was nice, briefly, to be from the same place as something good.`,
   `The corner store that had been there your entire life became something else, a phone-repair place, then empty. You kept almost walking in out of habit for a year.`,
   `A comet, or a satellite, or something, was visible for three nights if you drove out past the lights. You went one of the three nights. It was smaller than the pictures and better than them.`,
   `Prices went up again, quietly, everywhere at once. The same cart cost more and held less, and everyone discussed it in the checkout line like weather, which is what it had become.`,
 ]);log(line, chance(0.5)?null:'sys');S.happiness=clamp(S.happiness+(chance(0.5)?1:-1));}},
 // ---- fame (has fame) ----
 {id:'ev_oldclip',min:18,max:80,w:2,cond:()=>S.fame>20,run:()=>ask('The resurfaced clip',`An old clip of you, years old, a worse haircut and a worse opinion, claws its way back to the top of everyone's feed. It is not flattering, and your phone will not stop buzzing.`,[
  {label:'Own it and laugh',fn:()=>{if(chance(0.6)){S.fame=clamp(S.fame+4);S.happiness+=2;log(`You posted the clip yourself with a caption at your own expense, and the internet, which loves nothing more than a good sport, forgave you by lunch and liked you more than before. Pure judo.`,'good');}else{S.fame=clamp(S.fame-3);log(`You tried to laugh it off and misjudged the room, which had wanted, this time, an apology. The self-deprecation read as smug. You learned that the crowd sets the tone, not you.`,'bad');}}},
  {label:'Issue a careful apology',fn:()=>{S.fame=clamp(S.fame-1);S.happiness-=2;log(`Your team drafted three hundred words with no contractions and exactly one instance of the phrase I have learned. It worked, in the sense that it ended. It also made you feel like a press release wearing your face.`);}},
  {label:'Say nothing',fn:()=>{if(chance(0.5)){log(`You went silent and let it burn itself out, which it did, in the eleven days these things now last. Silence, it turns out, is a strategy, and often the best one.`,'good');S.stress+=4;}else{S.fame=clamp(S.fame-5);S.happiness-=5;S.stress+=8;log(`Your silence became the story. Why will they not address it, everyone asked. You had nothing to address and no way to say so, and the vacuum filled itself with worse things than the truth.`,'bad');}}},
 ])},
 // ---- prison (incarcerated) ----
 {id:'ev_prison_gang',min:16,max:80,w:6,cond:()=>G.jailUntil>G.age,run:()=>{const g=pick([`the yard`,`the block`,`the north wing`]);ask('The offer inside',`In ${g}, the choice everyone eventually faces finds you. A crew runs this place, and their man sits down across from you at chow and explains, not unkindly, that protection has a price, and so does the lack of it.`,[
  {label:'Join them',fn:()=>{G.notoriety=(G.notoriety||0)+4;K.combat=clamp((K.combat||0)+5);K.stealth=clamp((K.stealth||0)+3);S.happiness-=2;log(`You took the ink and the rules and the safety that came with them. Nobody touched you after that. You did things, in exchange, that you do not tell people about, that visit you on the quiet nights even now.`,'bad');thread('gang',{});}},
  {label:'Stand alone',fn:()=>{if(chance(0.5+((K.combat||0)/200))){K.combat=clamp((K.combat||0)+4);S.happiness+=1;log(`You said no and made it stick, which took one very bad afternoon and a reputation earned the hard way. After that they left you alone, wary, the way you leave alone a dog that does not bark.`,'good');}else{S.health=clamp(S.health-15);S.stress+=12;log(`You said no. They explained, at length and with their fists, what no costs in here. You healed slow and slept lighter than that for the rest of your sentence, one eye always on the door.`,'bad');}}},
 ]);}},
 {id:'ev_parole',min:16,max:90,w:5,cond:()=>G.jailUntil>G.age+1,run:()=>ask('The parole board',`You are walked into a room with a long table and a shorter future than you would like. Three people who have read your file and not your heart ask why they should let you out early. Everything rides on the next two minutes.`,[
  {label:'Show remorse',fn:()=>{if(chance(0.45+S.smarts/300+(K.charisma||0)/300)){const cut=rnd(1,2);G.jailUntil-=cut;log(`You told the truth, or a version of it shaped like the truth, and something in it reached them. ${cut} year${cut>1?'s came':' came'} off your sentence. You walked back to your cell lighter than you had been in a long time.`,'good');}else{S.happiness-=4;log(`You said the right words in the wrong order, or the right order with the wrong eyes, and the head of the board wrote something brief and closed the folder. Denied. You would try again next year, and the year after.`,'bad');}}},
  {label:'Stand on principle',fn:()=>{S.stress+=4;log(`You told them what you actually thought of their system, which was a great deal and mostly correct and exactly the wrong thing to do. They admired your honesty on the way to denying you. Principle is expensive in a room like that.`);}},
 ])},
 // ---- pets ----
 {id:'ev_petescape',min:5,max:95,w:3,cond:()=>G.pets&&G.pets.length>0,run:()=>{const pet=pick(G.pets);const them=(pet.sp==='dog'||pet.sp==='cat')?'them':'it';ask(`Where is ${pet.name}?`,`You come home and the gate is open and your ${pet.sp}, ${pet.name}, is gone. The street is very wide suddenly, and full of cars, and getting dark.`,[
  {label:'Search all night',fn:()=>{if(chance(0.75)){S.happiness+=4;S.stress=clamp(S.stress-2);log(`You walked the neighborhood until 2 a.m. calling ${pet.name}'s name like an idiot and a prayer, and found ${them} three streets over, unbothered, faintly annoyed at the fuss. You carried ${them} home against your chest and did not sleep and did not care.`,'good');}else{G.pets=G.pets.filter(p=>p!==pet);S.happiness-=10;log(`You searched for a week. You made the flyers. You checked the shelters and the worst ditch on the county road. ${pet.name} never came home, and the not-knowing was its own long ache, worse in some ways than knowing would have been.`,'bad');}}},
  {label:'Wait and hope',fn:()=>{if(chance(0.5)){S.happiness+=2;log(`You left the porch light on and a bowl by the door, and on the third morning there ${pet.name} was, thin and filthy and home. Some things come back on their own, if you leave the door open for them.`,'good');}else{G.pets=G.pets.filter(p=>p!==pet);S.happiness-=8;log(`You told yourself ${pet.name} would find the way back. Some of them do. ${pet.name} did not, and the bowl by the door sat full for longer than you would later admit.`,'bad');}}},
 ]);}},
];

// ---------- DATA: thread rules (the world keeping receipts) ----------
// Each rule: tag, wait (min years before it can fire), p (chance per year after wait), fire(thread) → prose + effects.
const THREADS={
 lent:{wait:3,p:0.25,fire:t=>{const f=npc(t.npc);if(!f||!f.alive)return;if(f.loyalty>50&&chance(0.7)){G.cash+=t.amt*1.1;log(`An envelope came with ${money(t.amt*1.1)} and a note from ${f.name}: "With interest. Never forgot." You sat down on the stairs and read it twice.`,'money');f.loyalty=clamp(f.loyalty+10);}else{log(`You realized, doing your taxes, that ${f.name} never paid back the ${money(t.amt)}. They know it too. It sits between you at every dinner like a third chair.`);f.loyalty=clamp(f.loyalty-10);}}},
 cheated:{wait:1,p:0.3,fire:t=>{const p=npc(t.npc);if(!p||!p.alive||p.role==='ex')return;if(chance(0.6)){log(`${p.name} found out about ${t.name}. Not from you — from a text, a receipt, a mutual friend with a conscience. The conversation that followed is one you will replay for the rest of your life. What they said was: "I would have forgiven the night. I can't forgive the year you let me not know."`,'bad');p.loyalty=clamp(p.loyalty-45);p.memory.push(`${G.name} cheated on me with ${t.name} and hid it.`);S.happiness-=12;S.stress+=15;if(p.loyalty<25)breakup(p,true);}else{log(`${p.name} never found out about ${t.name}. You have decided that this makes it not matter. You are wrong, and you know you are wrong, and you carry it in your shoulders.`);S.stress+=5;}}},
 bullied:{wait:12,p:0.15,fire:t=>{if(chance(0.5)){log(`You ran into ${t.name} — the kid from the fence, grown now, softer. They didn't recognize you at first. Then they did, and they said, "I was awful to you," and meant it. You said it was a long time ago. It was, and it wasn't.`);S.happiness+=4;S.stress-=4;}else{log(`${t.name}, the kid who made your childhood a hallway to hide in, is now the person interviewing you. Neither of you mentioned it. You did not get the job. You will never know if that's why.`,'bad');S.stress+=6;if(G.job)G.job.perf-=5;}}},
 beatbully:{wait:15,p:0.15,fire:t=>{log(`${t.name} — the kid you knocked down in the yard — found you online and sent a long message. He said that day was the first time anyone had told him no, and it changed him, and he became a teacher. You're not sure you believe it. You're not sure it matters.`,'good');S.happiness+=3;}},
 kindness:{wait:10,p:0.2,fire:t=>{const a=rnd(2000,25000);if(chance(0.5)){log(`${t.name} — the new kid from the lunch table, a lifetime ago — reached out. They're doing well, and they remembered, and they had a job to offer. "You sat with me," they said, as if that explained everything. It did.`,'good');G.cash+=a;K.business+=3;if(G.job){G.job.perf=clamp(G.job.perf+15);}}else{log(`${t.name} sent a card out of nowhere: "You probably don't remember. I do." You remembered.`,'good');S.happiness+=5;}}},
 mentor:{wait:8,p:0.2,fire:t=>{if(chance(0.5)){log(`${t.name} died. You found out from a group email. At the service someone asked how you knew them and you said "they taught me everything" and realized you had never once told them that.`,'bad');S.happiness-=6;}else{log(`${t.name} called out of the blue and asked you to speak at a thing. You did. Someone young came up to you afterward with the look you used to give ${t.name}. You understood, then, what you'd been given.`,'good');S.fame+=3;K.charisma+=3;}}},
 coldcase:{wait:4,p:0.08,fire:t=>{const c=CRIME[t.crime];if(chance(0.55)){log(`A detective came to the door about the ${c.name.toLowerCase()} from years ago. New evidence, they said. A cold case unit with nothing better to do. You were arrested in front of the neighbors.`,'bad');jail(c.jail,c);}else{log(`A detective came to the door about the ${c.name.toLowerCase()} from years ago. They asked polite questions. You gave polite answers. They left. You did not sleep for a month, and you never do the thing again.`);S.stress+=15;}}},
 dui:{wait:1,p:0.35,fire:t=>{log(`The DUI came back to bite: a job application, a background check, a form with a box you had to tick. You watched the interviewer's face change.`,'bad');if(G.job)G.job.perf-=10;}},
 absent:{wait:2,p:0.3,fire:t=>{const p=npc(t.npc);if(!p)return;if(!p.alive){log(`At the reading of your ${p.role}'s will, there was a line about you. It was kind. It was also shorter than the others. Your siblings did not look at you.`,'bad');S.happiness-=6;family().forEach(f=>f.loyalty=clamp(f.loyalty-6));}}},
 neglected:{wait:6,p:0.3,fire:t=>{const k=npc(t.npc);if(!k||!k.alive)return;log(`${k.name} moved across the country without telling you until after. You found out from a photo. When you called, they said, "You weren't really around, so." You wanted to argue. You couldn't.`,'bad');k.loyalty=clamp(k.loyalty-20);S.happiness-=8;}},
 ghosted:{wait:3,p:0.2,fire:t=>{log(`You ran into ${t.name} — the one you just stopped answering, years ago. They were with someone. They were happy. They looked right through you, on purpose, and it landed exactly where they meant it to.`);S.happiness-=3;}},
 stiffed:{wait:1,p:0.4,fire:t=>{const loss=Math.min(G.cash,rnd(2000,20000));if(chance(0.5)){pay(loss);log(`The people you shorted found you. They didn't hurt you. They took ${money(loss)} and something out of your car and made it clear that next time would be different.`,'bad');S.stress+=15;}else{log(`The people you shorted found you. It was as bad as you'd feared.`,'bad');S.health-=25;S.stress+=20;}}},
 onenight:{wait:1,p:0.2,fire:t=>{if(chance(0.5)){const kid=addNPC('child',G.sex==='Male'?pick(FEMALE.concat(MALE)):pick(MALE.concat(FEMALE)),0);log(`${t.name} — from one night a year ago that you'd mostly filed away — called. There's a baby. ${kid.name}. There's a court date about support, and a face you'll be seeing at holidays for the rest of your life.`,'bad');kid.loyalty=40;S.stress+=15;if(partner()){partner().loyalty=clamp(partner().loyalty-40);partner().memory.push(`${G.name} had a child with someone else.`);}}else{log(`A text from ${t.name}, from that one night. Just checking in. You didn't answer. Then you did. Then you stopped.`);}}},
};

/* =====================================================================
   ENGINE
   ===================================================================== */
let G=null;         // the whole game state
let S=null, K=null; // shortcuts into G.stats / G.skills
const SAVEKEY='smis_save_v1';

// ---- state constructors ----
function newSkills(){const o={};for(const k in SKILLS)o[k]=0;return o;}
function blankLife(cfg){
 const sex=cfg.sex, first=cfg.name||pick(sex==='Male'?MALE:FEMALE), last=cfg.last||pick(LAST);
 const place=cfg.place||pick(PLACES);
 const dadL=last, momFirst=pick(FEMALE), dadFirst=pick(MALE);
 const g={
  name:first+' '+last, first, last, sex, place, country:cfg.country||countryOf(place), talent:cfg.talent||null,
  age:0, born:2026, alive:true, cause:null,
  stats:{health:cfg.health??rnd(70,100),happiness:cfg.happiness??rnd(70,100),smarts:cfg.smarts??rnd(20,80),looks:cfg.looks??rnd(20,90),fitness:cfg.fitness??20,fame:0,stress:cfg.stress??10},
  skills:newSkills(),
  edu:0, eduProgram:null, inSchool:true, schoolStage:'elementary', major:null, gpaSeed:rnd(50,95), school:{popularity:rnd(25,55),clique:null,team:null}, invest:{}, market:{}, marketChg:{}, acts:0,
  cash:0, debt:0, creditScore:600,
  job:null, special:null, military:null,
  addiction:{alcohol:0,drugs:0},
  notoriety:0, record:[], jailUntil:0,
  items:[], props:[], home:'parents',
  npcs:[], threads:[], flags:{}, social:{}, pets:[], godless:!!cfg.godless,
  year:2026, history:[]
 };
 // parents
 const dad=mkNPC('parent','father',dadFirst+' '+dadL, rnd(24,40));
 const mom=mkNPC('parent','mother',momFirst+' '+pick(LAST), rnd(24,40));
 g.npcs.push(dad,mom);
 // maybe a sibling
 if(chance(0.6)){const ss=chance(0.5)?'Male':'Female';g.npcs.push(mkNPC('sibling',ss==='Male'?'brother':'sister',(ss==='Male'?pick(MALE):pick(FEMALE))+' '+last, rnd(-2,6)+0));}
 // born-with talent: a head start in the matching skill
 if(g.talent && TALENTS[g.talent]){ const T=TALENTS[g.talent];
   if(T.skill && g.skills[T.skill]!==undefined) g.skills[T.skill]=Math.max(g.skills[T.skill], T.start||25);
   if(T.aux){ if(g.stats[T.aux]!==undefined) g.stats[T.aux]=Math.max(g.stats[T.aux], T.start||25);
              else if(g.skills[T.aux]!==undefined) g.skills[T.aux]=Math.max(g.skills[T.aux], Math.round((T.start||25)*0.6)); } }
 return g;
}
let NPCID=1;
function mkNPC(role,label,name,ageOffset){return {id:'n'+(NPCID++),role,label,name,alive:true,loyalty:role==='parent'?70:role==='sibling'?60:50,age:Math.max(0,(ageOffset||0)),memory:[],met:0,married:false};}
function addNPC(role,name,age){const labels={friend:'friend',ex:'ex',partner:'partner',spouse:'spouse',child:'child',coworker:'coworker',fling:'fling'};const n=mkNPC(role,labels[role]||role,name,age);n.met=G.age;G.npcs.push(n);return n;}

// ---- npc queries ----
const allNPCs=()=>G.npcs.filter(n=>n.alive);
const npc=id=>G.npcs.find(n=>n.id===id);
const family=()=>G.npcs.filter(n=>n.alive&&['parent','sibling','child','spouse'].includes(n.role));
const livingParents=()=>G.npcs.filter(n=>n.alive&&n.role==='parent');
const friends=()=>G.npcs.filter(n=>n.alive&&n.role==='friend');
const kids=()=>G.npcs.filter(n=>n.alive&&n.role==='child');
const partner=()=>G.npcs.find(n=>n.alive&&(n.role==='partner'||n.role==='spouse'));

// ---- item/property helpers ----
const hasTag=t=>G.items.some(it=>ITEM[it.id]&&ITEM[it.id].tags.includes(t))||(t==='gym'&&G.items.some(it=>it.id==='gear'));
const hasYard=()=>G.props.some(p=>PROP[p.id].yard&&p.owned);
function damageVehicle(amt){const cars=G.items.filter(it=>ITEM[it.id].tags.includes('car')||ITEM[it.id].tags.includes('moto'));if(cars.length){const c=pick(cars);c.cond=clamp((c.cond??100)-amt);}}

// ---- money ----
function pay(amt,allowDebt){amt=Math.round(amt);if(amt<=0)return true;if(G.cash>=amt){G.cash-=amt;return true;}if(allowDebt&&G.age>=18){const short=amt-G.cash;G.cash=0;G.debt+=short;G.creditScore=clamp(G.creditScore-8,300,850);return true;}return false;}
function afford(amt){return G.cash>=amt;}

// ---- threads ----
function thread(tag,data){G.threads.push(Object.assign({tag,born:G.age,fired:false},data));}
function tickThreads(){for(const t of G.threads){if(t.fired)continue;const rule=THREADS[t.tag];if(!rule)continue;if(G.age-t.born<rule.wait)continue;if(chance(rule.p)){t.fired=true;rule.fire(t);}}}

/* =====================================================================
   THE YEAR — advancing age is the heartbeat of the game
   ===================================================================== */
let pendingChoice=null; // when an event needs a decision we pause here
function ageUp(){
 if(!G.alive)return;
 if(pendingChoice){toast('Resolve the choice first.');return;}
 G.age++; G.year++;
 startYearLog();
 G.acts={};
 // jail
 if(G.jailUntil>G.age){log(`You spent the year in prison. The days are identical and the nights are worse. You are ${G.jailUntil-G.age} year(s) from release.`,'bad');K.combat+=2;K.stealth+=2;S.happiness-=6;finishYear();return;}
 // schooling
 handleSchool();
 handleEducation();
 // job income + growth
 handleJobYear();
 // special career progression
 if(G.special)handleSpecialYear();
 if(G.military)handleMilitaryYear();
 // upkeep on items and properties
 handleUpkeep();
 // investments drift with the market
 handleInvestments();
 // passive drift
 driftStats();
 // addiction pressure
 handleAddiction();
 // threads (the receipts)
 tickThreads();
 // one random event, weighted
 rollEvent();
 // aging health
 handleAgingAndDeath();
 finishYear();
}

function handleSchool(){
 if(!G.inSchool)return;
 if(G.age===5){log(`You started school. A backpack too big for you, a lunchbox, and a teacher who smelled like coffee and chalk.`);G.schoolStage='elementary';}
 if(G.age===11){G.schoolStage='middle';log(`Middle school began, which is to say the friendly years ended and the awkward ones started.`);}
 if(G.age===14){G.schoolStage='high';log(`High school. Everything felt enormous and permanent and would, in ten years, feel small and brief.`);}
 if(G.age===18){
  const gpa=(G.gpaSeed+S.smarts)/2;
  if(gpa>50){G.edu=Math.max(G.edu,1);log(`You graduated high school${gpa>85?' near the top of your class':''}. Someone's parent cried. There was cake in a gym.`,'good');S.happiness+=4;}
  else{log(`You didn't graduate high school. You got a certificate that said you attended, which is a different thing, and everyone in the room knew it.`,'bad');}
  G.inSchool=false;G.schoolStage=null;
 }
}

function handleJobYear(){
 if(!G.job)return;const j=JOB[G.job.id];
 let pay=j.pay+(G.job.bonus||0);
 // special careers pay through their own system; regular jobs here
 G.cash+=Math.round(pay*(cfg_tax()));
 // build skills
 for(const s in j.gain)K[s]=clamp(K[s]+j.gain[s]);
 // performance drift toward mid unless acted on
 G.job.perf=clamp((G.job.perf??60)+(chance(0.5)?rnd(-4,6):rnd(-6,4)));
 G.job.years=(G.job.years||0)+1;
 S.stress=clamp(S.stress+Math.round((j.stress-8)/2));
 if(G.age===0){}
 // auto note pay once
}
function cfg_tax(){const gross=annualIncome();let eff=0.85;if(gross>60000)eff=0.78;if(gross>150000)eff=0.68;if(gross>400000)eff=0.6;return eff*COST_OF_LIVING_factor();}
function COST_OF_LIVING_factor(){return 1;} // income already net-ish; COL applied to expenses
function annualIncome(){let t=0;if(G.job){t+=JOB[G.job.id].pay+(G.job.bonus||0);}if(G.special){t+=SPECIAL[G.special.type].pay[G.special.tier];}if(G.military){t+=(G.military.officer?OFFPAY:MILPAY)[G.military.rank];}return t;}

function handleUpkeep(){
 const col=COST_OF_LIVING[G.place]||1;
 // rent if no home owned
 if(G.home==='rent'){const rent=Math.round(1100*12*col);pay(rent,true);}
 // property upkeep + condition
 for(const p of G.props){const def=PROP[p.id];if(!def)continue;const up=Math.round(def.price*def.upkeep*col);if(p.maintain&&afford(up)){pay(up);p.cond=clamp((p.cond??100)+6,0,100);}else{p.cond=clamp((p.cond??100)-8);}}
 // mortgages
 for(const p of G.props.slice()){ if(!p.mortgage||p.mortgage.balance<=0)continue; const def=PROP[p.id]; const m=p.mortgage; const interest=Math.round(m.balance*m.rate); const due=Math.min(m.payment,m.balance+interest); if(afford(due)){ pay(due); m.balance=Math.max(0,m.balance+interest-due); m.missed=0; if(m.balance<=0){ delete p.mortgage; log(`You made the last payment on the ${def.name.toLowerCase()}. The bank's letter used the word satisfied. So were you.`,'good'); } } else { m.missed=(m.missed||0)+1; G.creditScore=clamp(G.creditScore-25,300,850); m.balance=Math.round((m.balance+interest)*1.02); if(m.missed>=3){ const i=G.props.indexOf(p); if(i>=0)G.props.splice(i,1); if(!G.props.length&&G.home==='own')G.home='rent'; S.happiness=clamp(S.happiness-15); S.stress=clamp(S.stress+15); G.creditScore=clamp(G.creditScore-60,300,850); log(`The bank foreclosed on the ${def.name.toLowerCase()}. Strangers carried your life to the curb while a notice fluttered on the door. Your credit will carry this for years.`,'bad'); } else { log(`You missed the mortgage on the ${def.name.toLowerCase()} — ${3-m.missed} more and they take it.`,'bad'); } } }
 // rental income
 for(const p of G.props){ if(!p.rented||!p.tenant)continue; const def=PROP[p.id]; const q=p.tenant; if(chance(q.reliability)){ G.cash+=p.rent; if(chance(0.3))p.cond=clamp((p.cond??100)-rnd(1,5)); } else { p.cond=clamp((p.cond??100)-rnd(4,10)); if(chance(0.5))log(`Your tenant ${q.name} in the ${def.name.toLowerCase()} was late on rent again. ${pick(['You heard three excuses and believed none.','The check is in the mail, they swear.'])}`,'bad'); } }
 // item upkeep + condition
 for(const it of G.items){const def=ITEM[it.id];if(!def)continue;it.cond=it.cond??100;it.value=it.value??def.price;it.value=Math.max(0,Math.round(it.value*(1-def.dep)));if(it.maintain&&afford(def.upkeep)){pay(def.upkeep);it.cond=clamp(it.cond+5,0,100);}else{it.cond=clamp(it.cond-10);if(it.cond<20&&chance(0.3)){}}}
 // debt interest
 if(G.debt>0){G.debt=Math.round(G.debt*1.08);if(afford(G.debt*0.1)){pay(Math.round(G.debt*0.1));G.debt=Math.round(G.debt*0.9);G.creditScore=clamp(G.creditScore+3,300,850);}}
 // happiness from possessions
 let luxHappy=0;G.items.forEach(it=>{if((it.cond??100)>40)luxHappy+=ITEM[it.id].happy*0.4;});G.props.forEach(p=>{if((p.cond??100)>40)luxHappy+=PROP[p.id].happy*0.5;});
 S.happiness=clamp(S.happiness+Math.min(6,luxHappy));
 // fame from possessions/props
 let fameItems=0;G.items.forEach(it=>fameItems+=(ITEM[it.id].fame||0));G.props.forEach(p=>fameItems+=(PROP[p.id].fame||0));
 if(fameItems)S.fame=clamp(S.fame+Math.min(2,fameItems*0.3));
}

function driftStats(){
 // fame decays if not maintained by a special career
 if(!G.special&&S.fame>0)S.fame=clamp(S.fame-2);
 // fitness decays
 if(!hasTag('gym'))S.fitness=clamp(S.fitness-2);
 // stress slowly recovers
 S.stress=clamp(S.stress-3);
 // happiness pulled by stress
 if(S.stress>60)S.happiness=clamp(S.happiness-4);
 // looks age
 if(G.age>30&&chance(0.5))S.looks=clamp(S.looks-1);
 // relationships drift
 allNPCs().forEach(n=>{if(chance(0.3))n.loyalty=clamp(n.loyalty-1);n.age++;});
}

function handleAddiction(){
 for(const v of ['alcohol','drugs']){
  if(G.addiction[v]>0){
   G.addiction[v]=clamp(G.addiction[v]-4); // natural decay
   if(G.addiction[v]>50){S.health=clamp(S.health-3);S.happiness=clamp(S.happiness-2);}
  }
 }
}

function handleAgingAndDeath(){
 if(pendingChoice)return; // don't die with an unanswered question on screen
 // yearly health erosion by age
 let base=0;
 if(G.age>40)base=1; if(G.age>55)base=2; if(G.age>65)base=3; if(G.age>75)base=5; if(G.age>85)base=8;
 base+= (S.stress>70?2:0) + (G.addiction.drugs>50?3:0) + (G.addiction.alcohol>60?2:0);
 base-= (S.fitness>60?2:0);
 S.health=clamp(S.health-base);
 // death checks
 let deathP=0;
 if(G.age>60)deathP=(G.age-60)/600;
 if(S.health<=0)deathP=1;
 else if(S.health<20)deathP+=0.15;
 deathP+= G.addiction.drugs>70?0.05:0;
 if(chance(deathP)){die(S.health<=0?'health failing':pick(['heart gave out','a sudden illness','an accident','old age, simply']));}
}

function die(cause){
 if(G.flags&&G.flags.immortal){S.health=Math.max(S.health,60);return;}
 G.alive=false;G.cause=cause;
 log(`You died at ${G.age}. ${capitalize(cause)}. ${eulogy()}`,'bad');
 // legacy note
 const net=netWorth();
 log(`You leave behind ${money(net)} and ${family().length} family ${family().length===1?'member':'members'}. ${net>1000000?'They will remember the money.':'They will remember you.'}`,'sys');
 renderAll();saveGame();
 setTimeout(()=>openObituary(),400);
}
function eulogy(){
 const bits=[];
 if(S.fame>60)bits.push('You were, for a time, someone people recognized.');
 if(G.record.length>3)bits.push('You left a record in more than one sense.');
 if(kids().length)bits.push(`${kids().length} of your children outlived you.`);
 if(partner())bits.push(`${partner().name} was in the room.`);
 if(!bits.length)bits.push('The room was quiet.');
 return pick(bits);
}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function netWorth(){let w=G.cash-G.debt;G.items.forEach(it=>{const d=ITEM[it.id];if(d)w+=(it.value??d.price)*((it.cond??100)/100);});G.props.forEach(p=>{const d=PROP[p.id];if(d)w+=d.price*((p.cond??100)/100)*0.9;if(p.mortgage)w-=p.mortgage.balance;});if(G.invest&&G.market){for(const id in G.invest){const hd=G.invest[id];if(hd&&hd.shares>0)w+=hd.shares*(G.market[id]||0);}}return Math.round(w);}

/* =====================================================================
   PART 5 — LOG, CHOICES, EVENT ROLL, JOB/CAREER/MILITARY GLUE, SAVE I/O
   ===================================================================== */

// ---- the life log (a journal, oldest at top) ----
function startYearLog(){ G.history.push({year:G.year,age:G.age,entries:[]}); }
function curYear(){ return G.history[G.history.length-1] || (startYearLog(),G.history[G.history.length-1]); }
function log(text,kind,cb){
  if(typeof kind==='function'){cb=kind;kind=null;}
  curYear().entries.push({text,kind:kind||null});
  if(cb)cb();
}
function toast(msg){
  let t=$('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:80vw;text-align:center';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.transition='opacity .5s';t.style.opacity='0';},1600);
}
function finishYear(){
  renderAll();
  // a scout may have appeared this year — offer the leap
  if(G.flags.scout&&!G.special&&!pendingChoice){ offerScout(G.flags.scout); G.flags.scout=null; }
  saveGame(true);
  const yrs=document.querySelectorAll('.yr');
  if(yrs.length)yrs[yrs.length-1].scrollIntoView({behavior:'smooth',block:'start'});
}

// ---- choices (pauses the year until answered) ----
function ask(title,text,choices){
  const opts=choices.filter(c=>!c.cond||c.cond());
  pendingChoice={title,text,opts};
  renderModalChoice();
}
function renderModalChoice(){
  if(!pendingChoice)return;
  const {title,text,opts}=pendingChoice;
  $('modalbox').innerHTML =
    `<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="opts" id="choiceopts"></div>`;
  const box=$('choiceopts');
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.innerHTML = esc(o.label)+(o.sub?`<small>${esc(o.sub)}</small>`:'');
    b.onclick=()=>resolveChoice(i);
    box.appendChild(b);
  });
  openModal();
}
function resolveChoice(i){
  const p=pendingChoice; pendingChoice=null; closeModal();
  try{ p.opts[i].fn(); }catch(e){ console.error(e); }
  renderAll(); saveGame(true);
  const yrs=document.querySelectorAll('.yr'); if(yrs.length)yrs[yrs.length-1].scrollIntoView({block:'end'});
  if(!G.alive){ setTimeout(openObituary,300); }
}
function offerScout(type){
  const sp=SPECIAL[type];
  ask('The card in your pocket',`The person who left that card wasn't lying. There's a door open here — a life as ${sp.name.toLowerCase()}, if you walk through it. It means starting at the bottom, ${sp.tiers[0].toLowerCase()}, and it means giving up the safety of a normal paycheck for a while.`,[
    {label:`Pursue it — become ${sp.name.toLowerCase()}`,sub:'The leap.',fn:()=>{startSpecial(type);}},
    {label:'Keep the card, keep your life',fn:()=>{log(`You kept the card in a drawer. Every so often, for years, you'd find it and feel the same small pull, and then close the drawer.`);}},
  ]);
}

// ---- weighted yearly event ----
function rollEvent(){
  const cands=EVENTS.filter(e=>G.age>=e.min&&G.age<=e.max&&(!e.cond||safeCond(e.cond)));
  if(!cands.length)return;
  let total=0; for(const e of cands)total+=(e.w||1);
  let r=Math.random()*total;
  for(const e of cands){ r-=(e.w||1); if(r<=0){ try{e.run();}catch(err){console.error('event',e.id,err);} return; } }
}
function safeCond(fn){ try{return fn();}catch(e){return false;} }

// ---- jobs ----
function setJob(id){
  const j=JOB[id]; if(!j)return;
  const promo = G.job && JOB[G.job.id] && JOB[G.job.id].next.includes(id);
  G.job={id,perf:promo?70:60,years:0,bonus:0};
  log(promo?`You were promoted to ${j.title}.`:`You started work as a ${j.title}. ${money(j.pay)} a year, before the government and the landlord take their cut.`, promo?'good':'money');
}
function quitJob(fired){ if(!G.job)return; const j=JOB[G.job.id]; G.job=null; if(!fired)log(`You walked away from the ${j.title} job. It felt enormous for about a week.`); }

// ---- special careers ----
function startSpecial(type){
  const sp=SPECIAL[type];
  if(G.job)quitJob();
  G.special={type,tier:0,prog:0,years:0};
  log(`You threw yourself into it. ${sp.tiers[0]}. The pay is ${money(sp.pay[0])} and the dream is free. Everyone told you to have a backup. You didn't listen, which is the only way this ever works.`,'good');
}
function handleSpecialYear(){
  const sp=SPECIAL[G.special.type], t=G.special.tier;
  G.cash+=Math.round(sp.pay[t]*cfg_tax());
  if(sp.pay[t]>0)log(`Being ${sp.tiers[t].toLowerCase()} paid you about ${money(Math.round(sp.pay[t]*cfg_tax()))} this year.`,'money');
  S.fame=clamp(S.fame + sp.fameGain[t]*0.25);
  K[sp.skill]=clamp(K[sp.skill]+1);
  G.special.years++;
  S.stress=clamp(S.stress+3);
}
function specialWork(){ if(!spendAct())return;
  const sp=SPECIAL[G.special.type], t=G.special.tier;
  const skill=K[sp.skill], aux=S[sp.aux]!==undefined?S[sp.aux]:K[sp.aux]||0;
  const talentMatch=(G.talent&&TALENTS[G.talent]&&TALENTS[G.talent].special===G.special.type);
  const power=skill*0.7+aux*0.3+(talentMatch?15:0);
  let odds=(power-sp.entry*(t+1)*0.7)/60 + 0.15;
  odds=Math.max(0.03,Math.min(0.9,odds));
  G.special.prog += chance(odds)?rnd(20,45):rnd(2,12);
  K[sp.skill]=clamp(K[sp.skill]+2);
  if(G.special.prog>=100 && t<sp.tiers.length-1){
    G.special.tier++; G.special.prog=0;
    S.fame=clamp(S.fame+sp.fameGain[G.special.tier]);
    log(`It happened. You went from ${sp.tiers[t].toLowerCase()} to ${sp.tiers[G.special.tier].toLowerCase()}. ${['','A small write-up somewhere.','People you\'d never met knew your name.','The money stopped looking real.','You were, suddenly, famous.'][G.special.tier]||''}`,'good');
  }else if(t>=sp.tiers.length-1){
    log(`You are at the very top as ${sp.tiers[t].toLowerCase()}. There's nowhere higher — only the work of staying there.`);
  }else{
    log(`You did the work — ${sp.work.toLowerCase()} — and moved a little closer. ${G.special.prog}% toward the next rung.`);
  }
  afterAction(2);
}

// ---- military ----
function enlist(branch,officer){
  G.military={branch,officer:!!officer,rank:0,years:0};
  if(G.job)quitJob();
  log(`You ${officer?'commissioned as an officer':'enlisted'} in the ${branch}. They cut your hair and rebuilt you from the boots up. ${officer?'':'You were nobody, briefly, which is its own kind of clarity.'}`,'good');
  afterAction(1);
}
function handleMilitaryYear(){
  const m=G.military; const pay=(m.officer?OFFPAY:MILPAY)[m.rank];
  G.cash+=Math.round(pay*cfg_tax());
  log(`Service paid ${money(Math.round(pay*cfg_tax()))} this year.`,'money');
  K.combat=clamp(K.combat+2);K.discipline=clamp(K.discipline+3);S.fitness=clamp(S.fitness+3);
  m.years++;
  const maxRank=(m.officer?OFFPAY:MILPAY).length-1;
  if(m.years%3===0&&m.rank<maxRank){m.rank++;log(`You were promoted to ${(m.officer?OFFICER:ENLISTED)[m.rank]}.`,'good');}
  if(chance(0.06)){
    log(`You deployed. ${pick(['You came back changed in ways you can\'t name.','You lost someone — the kind of loss that reorders a person.','It was months of boredom and then ninety seconds that you will spend the rest of your life inside of.'])}`,'bad');
    S.stress=clamp(S.stress+12); if(chance(0.3))S.health=clamp(S.health-15);
  }
}
function discharge(){
  const m=G.military; log(`You were discharged from the ${m.branch} after ${m.years} year(s), as ${(m.officer?OFFICER:ENLISTED)[m.rank]}. The world outside felt loud and undisciplined and free.`); G.military=null; afterAction(1);
}

// ---- relationships ----
function breakup(p,bad){
  if(!p)return;
  p.role='ex'; p.married=false; p.engaged=false;
  p.memory.push(`Relationship with ${G.name} ended${bad?' badly':''} at ${G.age}.`);
  log(`It ended with ${p.name}.${bad?' There was no soft way through it, and you both stopped pretending there was.':''}`,'bad');
  S.happiness=clamp(S.happiness-8);
}

// ---- jail ----
function jail(years,crime){
  G.jailUntil=G.age+years;
  if(crime)G.record.push({crime:crime.name,age:G.age});
  if(G.job)quitJob(true);
  G.special=null;
  log(`You were sentenced to ${years} year(s). The gate closed with a sound you'll hear for the rest of your life.`,'bad');
  S.happiness=clamp(S.happiness-10);S.stress=clamp(S.stress+15);
}

// ---- save / load / export / import ----
function saveGame(silent){
  try{
    localStorage.setItem(SAVEKEY,JSON.stringify({G,NPCID}));
    if(!silent)toast('Saved.');
  }catch(e){ if(!silent)toast('Save blocked here — use Export.'); }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVEKEY); if(!raw)return false;
    const data=JSON.parse(raw); G=data.G; NPCID=data.NPCID||1; S=G.stats; K=G.skills; sanitizeSave();
    return true;
  }catch(e){ return false; }
}
function exportSave(){
  if(!G){toast('No life to export yet.');return;}
  const blob=new Blob([JSON.stringify({G,NPCID},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`SMIS-${G.first}-${G.age}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('Exported.');
}
function importSave(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result); G=data.G; NPCID=data.NPCID||1; S=G.stats; K=G.skills; sanitizeSave(); pendingChoice=null; closeModal(); renderAll(); toast('Life loaded.'); }catch(e){ toast('That file did not read as a save.'); } };
  r.readAsText(f); input.value='';
}

// ---- shared post-action helper: small time cost is abstract; just re-render ----
const ACT_CAP=5;
function spendAct(key){ key=key||'generic'; if(!G.acts||typeof G.acts!=='object')G.acts={}; if((G.acts[key]||0)>=ACT_CAP){ toast('You have wrung about all you can out of that this year.'); return false; } G.acts[key]=(G.acts[key]||0)+1; return true; }

/* ---------------- activities (shared) ---------------- */
function applyFx(fx){ if(!fx)return; for(const k in fx){ if(k in S)S[k]=clamp(S[k]+fx[k]); else if(k in K)K[k]=clamp(K[k]+fx[k]); } }
function doActivity(id){ if(!spendAct('act:'+id))return;
  const a=ACT[id]; if(!a)return;
  if(G.age<a.age){toast('Too young for that.');return;}
  if(a.max&&G.age>a.max){toast('You are past the age for that.');return;}
  if(a.needsInstrument&&!hasTag('instrument')){toast('Buy an instrument first (Assets tab).');return;}
  if(a.needsYard&&!hasYard()){toast('You need a home with a yard first.');return;}
  if(a.cost>0&&!pay(a.cost,a.cost<15000)){toast("You can't afford that right now.");return;}
  applyFx(a.fx);
  if(a.vice)G.addiction[a.vice]=clamp(G.addiction[a.vice]+(a.viceAmt||5));
  if(a.rehab){G.addiction.alcohol=clamp(G.addiction.alcohol-45);G.addiction.drugs=clamp(G.addiction.drugs-45);}
  if(a.risk&&chance(a.risk)){ applyFx(a.riskfx); log(a.risktext,'bad'); }
  else { log(`You ${a.name.toLowerCase()}${a.text?', and '+a.text:''}.`, a.vice?null:'good'); }
  afterAction(0);
}

/* ---------------- WORK ---------------- */
function jobEligible(j){
  if(G.age<j.age)return false;
  if(G.edu<(j.edu||0))return false;
  if(j.major&&!(G.major&&j.major.includes(G.major)))return false;
  for(const s in (j.skills||{})){ if((K[s]||0)<j.skills[s])return false; }
  if(j.prev&&j.prev.length){ return !!(G.job&&j.prev.includes(G.job.id)); }
  return true;
}

  const max=Math.round((G.creditScore-300)*45+3000);
  $('modalbox').innerHTML=`<h2>Take a loan</h2><p>With a credit score of ${G.creditScore}, a lender will go up to about ${money(max)}. It grows at 8% a year until you pay it down.</p><div class="row"><label>Amount</label><input type="number" id="loanamt" value="${Math.min(5000,max)}" min="100" max="${max}"></div><div class="opts"><button onclick="confirmLoan(${max})">Borrow it</button></div>`;
  openModal();
}
function confirmLoan(max){ const amt=Math.max(100,Math.min(max,Math.round(+($('loanamt').value||0)))); forceClose(); G.cash+=amt; G.debt+=amt; G.creditScore=clamp(G.creditScore-10,300,850); log(`You took out a loan of ${money(amt)}. The money felt like relief. The debt would feel like weather — always there, worse some months than others.`,'money'); afterAction(0); }
function payDebt(){ if(G.debt<=0){toast('You owe nothing. Rare and good.');return;} const amt=Math.min(G.cash,G.debt); if(amt<=0){toast('No cash to put toward it.');return;} pay(amt); G.debt-=amt; G.creditScore=clamp(G.creditScore+6,300,850); log(`You put ${money(amt)} against your debt. ${G.debt<=0?'And with that, you owed nothing. You had forgotten how light that could feel.':'The balance is lighter. So are you.'}`,'money'); afterAction(0); }

/* ---------------- CRIME ---------------- */
function tabCrime(){
  const list=CRIMES.filter(c=>G.age>=c.age);
  let h=grp('Crimes', list.map(c=>actBtn('crime',c.id,c.name, c.pay[1]>0?'up to '+money(c.pay[1]):'')).join(''), 'Every crime leaves a thread. Cold cases reopen. The world keeps receipts.');
  if(G.record.length)h+=`<div class="grp"><h4>Your record</h4><div class="note">${G.record.map(r=>`${r.crime} (age ${r.age})`).join(' · ')}</div></div>`;
  return h;
}
function doCrime(id){ const c=CRIME[id]; if(!c)return; if(G.age<c.age){toast('Too young for that.');return;} if(c.target)return chooseCrimeTarget(c); resolveCrime(c,null); }
function chooseCrimeTarget(c){
  const targets=allNPCs();
  $('modalbox').innerHTML=`<h2>${esc(c.name)}</h2><p>Who?</p><div class="opts" id="tg"></div>`;
  const box=$('tg');
  const stranger=document.createElement('button'); stranger.innerHTML='A stranger<small>no one you know</small>'; stranger.onclick=()=>{forceClose();resolveCrime(c,null);}; box.appendChild(stranger);
  targets.forEach(n=>{ const b=document.createElement('button'); b.innerHTML=`${esc(n.name)}<small>${capitalize(n.label)}</small>`; b.onclick=()=>{forceClose();resolveCrime(c,n.id);}; box.appendChild(b); });
  openModal();
}
function resolveCrime(c,targetId){
  const odds=Math.max(0.03,Math.min(0.95,c.base+(K[c.use]||0)/250+(G.talent==='crime'?0.1:0)));
  const t=targetId?npc(targetId):null;
  if(chance(odds)){
    const gain=rnd(c.pay[0],c.pay[1]); if(gain>0)G.cash+=gain;
    applyFx(c.gain); G.notoriety+=c.heat;
    if(c.vice)G.addiction[c.vice]=clamp(G.addiction[c.vice]+(c.viceAmt||6));
    if(t){ if(c.id==='murder'){ t.alive=false; t.memory.push('Killed.'); } else if(c.id==='assault'){ t.loyalty=clamp(t.loyalty-40); t.memory.push(`${G.name} attacked me.`);} }
    log(crimeWin(c,gain,t),'bad');
    thread('coldcase',{crime:c.id});
    if(c.pay[1]>0&&gain<=0){} 
  } else {
    if(c.fine)pay(c.fine,true);
    applyFx(c.gain);
    if(c.jail)jail(c.jail,c); else { G.record.push({crime:c.name,age:G.age}); log(crimeCaught(c),'bad'); }
    if(c.jail){} // jail() already logged
  }
  afterAction(3);
}
function crimeWin(c,gain,t){
  if(c.id==='murder')return `You killed ${t?t.name:'a stranger'}. It was quieter than films make it look, and it did not feel like the movies promised. You cleaned up and went home and made toast, and your hands only shook later. No one knows. That is a thing you own now.`;
  if(c.id==='assault')return `You put ${t?t.name:'someone'} on the ground and kept going a beat too long. Bystanders pulled out phones. You walked away fast, heart going, knuckles wrong. Something in you liked it, and that scared you more than the rest.`;
  if(gain>0)return `You pulled off the ${c.name.toLowerCase()} and walked with ${money(gain)}. The money spent like any other money, which is the terrible, seductive lesson of it.`;
  return `You pulled off the ${c.name.toLowerCase()} clean. No one saw. You told yourself it was the last time.`;
}
function crimeCaught(c){ return `The ${c.name.toLowerCase()} went wrong. ${c.fine?`A fine, a court date, a lawyer who smelled of other people's worst days. It cost you ${money(c.fine)} and a piece of your name.`:'You talked your way down to a warning, but your name is in a file now, and files are patient.'}`; }
