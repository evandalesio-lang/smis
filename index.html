// ---- productive-action limiter ----
// An action is always allowed. Its first three uses each year can improve the
// player's numbers; later uses still cost money, carry risk, and create story,
// but positive numeric gains are rolled back at the end of the action.
const ACTION_EFFECT_CAP=3;
let actionEffectFrame=null;
let actionEffectKey=null;
function actionEffectSnapshot(){
  const c=G.special,p=c&&c.currentProject,m=c&&c.type==='musician'?c.activeRecord:null;
  return {
    stats:Object.assign({},G.stats),skills:Object.assign({},G.skills),addiction:Object.assign({},G.addiction),
    creditScore:G.creditScore,gpaSeed:G.gpaSeed,schoolPopularity:G.school&&G.school.popularity,
    eduGpa:G.eduProgram&&G.eduProgram.gpa,campusPopularity:G.eduProgram&&G.eduProgram.campus&&G.eduProgram.campus.popularity,
    job:G.job?{perf:G.job.perf,bonus:G.job.bonus,effort:G.job.effort,recognition:G.job.recognition}:null,
    special:c?{tier:c.tier,prog:c.prog,form:c.form,momentum:c.momentum,catalog:c.catalog,awards:c.awards,fans:c.fans,totalStreams:c.totalStreams,gamePrep:c.gamePrep}:null,specialDraft:G.specialDraft,
    project:p?{quality:p.quality,lines:p.prep&&p.prep.lines,character:p.prep&&p.prep.character,chemistry:p.prep&&p.prep.chemistry,cast:(p.cast||[]).map(x=>({id:x.id,bond:x.bond}))}:null,
    music:c&&c.type==='musician'?{record:m?{id:m.id,quality:m.quality,arrangement:m.prep&&m.prep.arrangement,rehearsal:m.prep&&m.prep.rehearsal,production:m.prep&&m.prep.production}:null,drafts:(c.drafts||[]).map(x=>({id:x.id,quality:x.quality})),band:(c.bandMembers||[]).map(x=>({id:x.id,bond:x.bond})),release:c.lastRelease?{id:c.lastRelease.id,streams:c.lastRelease.streams}:null}:null,
    athlete:c&&c.type==='athlete'?{injuryGames:c.injury&&c.injury.games,teammates:(c.teammates||[]).map(x=>({id:x.id,bond:x.bond}))}:null,
    npcs:(G.npcs||[]).map(n=>({id:n.id,loyalty:n.loyalty})),
    social:Object.fromEntries(Object.entries(G.social||{}).map(([id,a])=>[id,{followers:a.followers||0,fake:a.fake||0}]))
  };
}
function spendAct(key){
  key=key||'generic';if(!G.actionEffects||typeof G.actionEffects!=='object')G.actionEffects={};
  const used=G.actionEffects[key]||0;G.actionEffects[key]=used+1;
  actionEffectKey=key;
  actionEffectFrame=used>=ACTION_EFFECT_CAP?actionEffectSnapshot():null;
  if(used===ACTION_EFFECT_CAP)toast('You can keep doing this, but it will not improve stats again until next year.');
  return true;
}
function cancelSpentAction(){
  if(actionEffectKey&&G.actionEffects&&G.actionEffects[actionEffectKey]){
    G.actionEffects[actionEffectKey]--;
    if(G.actionEffects[actionEffectKey]<=0)delete G.actionEffects[actionEffectKey];
  }
  actionEffectKey=null;actionEffectFrame=null;
}
function blockHigher(obj,key,before){if(obj&&before!=null&&obj[key]>before)obj[key]=before;}
function settleActionEffects(){
  const b=actionEffectFrame;actionEffectFrame=null;actionEffectKey=null;if(!b)return;
  for(const k of ['health','happiness','smarts','looks','fitness','fame'])blockHigher(G.stats,k,b.stats[k]);
  if(G.stats.stress<b.stats.stress)G.stats.stress=b.stats.stress;
  for(const k in b.skills)blockHigher(G.skills,k,b.skills[k]);
  for(const k of ['alcohol','drugs'])if(G.addiction[k]<b.addiction[k])G.addiction[k]=b.addiction[k];
  blockHigher(G,'creditScore',b.creditScore);blockHigher(G,'gpaSeed',b.gpaSeed);
  if(G.school&&b.schoolPopularity!=null)blockHigher(G.school,'popularity',b.schoolPopularity);
  if(G.eduProgram&&b.eduGpa!=null)blockHigher(G.eduProgram,'gpa',b.eduGpa);
  if(G.eduProgram&&G.eduProgram.campus&&b.campusPopularity!=null)blockHigher(G.eduProgram.campus,'popularity',b.campusPopularity);
  if(G.job&&b.job){blockHigher(G.job,'perf',b.job.perf);blockHigher(G.job,'bonus',b.job.bonus);blockHigher(G.job,'effort',b.job.effort);blockHigher(G.job,'recognition',b.job.recognition);}
  if(G.special&&b.special){for(const k of ['tier','prog','form','momentum','catalog','awards','fans','totalStreams','gamePrep'])blockHigher(G.special,k,b.special[k]);}
  blockHigher(G,'specialDraft',b.specialDraft);
  const p=G.special&&G.special.currentProject;
  if(p&&b.project){blockHigher(p,'quality',b.project.quality);if(p.prep){blockHigher(p.prep,'lines',b.project.lines);blockHigher(p.prep,'character',b.project.character);blockHigher(p.prep,'chemistry',b.project.chemistry);}for(const old of b.project.cast){const now=(p.cast||[]).find(x=>x.id===old.id);if(now)blockHigher(now,'bond',old.bond);}}
  const c=G.special;
  if(c&&b.music){const m=c.activeRecord,old=b.music.record;if(m&&old&&m.id===old.id){blockHigher(m,'quality',old.quality);if(m.prep){blockHigher(m.prep,'arrangement',old.arrangement);blockHigher(m.prep,'rehearsal',old.rehearsal);blockHigher(m.prep,'production',old.production);}}for(const d of b.music.drafts){const now=(c.drafts||[]).find(x=>x.id===d.id);if(now)blockHigher(now,'quality',d.quality);}for(const x of b.music.band){const now=(c.bandMembers||[]).find(y=>y.id===x.id);if(now)blockHigher(now,'bond',x.bond);}if(c.lastRelease&&b.music.release&&c.lastRelease.id===b.music.release.id)blockHigher(c.lastRelease,'streams',b.music.release.streams);}
  if(c&&b.athlete){if(c.injury&&b.athlete.injuryGames!=null&&c.injury.games<b.athlete.injuryGames)c.injury.games=b.athlete.injuryGames;for(const x of b.athlete.teammates){const now=(c.teammates||[]).find(y=>y.id===x.id);if(now)blockHigher(now,'bond',x.bond);}}
  for(const old of b.npcs){const now=(G.npcs||[]).find(n=>n.id===old.id);if(now)blockHigher(now,'loyalty',old.loyalty);}
  for(const id in b.social){const a=G.social&&G.social[id];if(a){blockHigher(a,'followers',b.social[id].followers);blockHigher(a,'fake',b.social[id].fake);}}
}
function scrollStoryLatest(instant){
  const go=()=>{const target=document.querySelector('#log .yr:last-child p:last-child')||document.querySelector('#log .yr:last-child');if(target&&target.scrollIntoView)target.scrollIntoView({behavior:instant?'auto':'smooth',block:'center'});};
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(go));else setTimeout(go,0);
}

function applyFx(fx){ if(!fx)return; for(const k in fx){ if(k in S)S[k]=clamp(S[k]+fx[k]); else if(k in K)K[k]=clamp(K[k]+fx[k]); } }
function doActivity(id){
  const a=ACT[id]; if(!a)return;
  if(G.age<a.age){toast('Too young for that.');return;}
  if(a.max&&G.age>a.max){toast('You are past the age for that.');return;}
  if(a.needsInstrument&&!hasTag('instrument')){toast('Buy an instrument first (Assets tab).');return;}
  if(a.needsYard&&!hasYard()){toast('You need a home with a yard first.');return;}
  if(a.cost>0&&G.cash<a.cost&&!(a.cost<15000&&G.age>=18)){toast("You can't afford that right now.");return;}
  if(!spendAct('act:'+id))return;
  if(a.cost>0&&!pay(a.cost,a.cost<15000)){return;}
  applyFx(a.fx);
  if(a.vice)G.addiction[a.vice]=clamp(G.addiction[a.vice]+(a.viceAmt||5));
  if(a.rehab){G.addiction.alcohol=clamp(G.addiction.alcohol-45);G.addiction.drugs=clamp(G.addiction.drugs-45);}
  if(a.risk&&chance(a.risk)){ applyFx(a.riskfx); log(a.risktext,'bad'); }
  else {
    const written=ACTIVITY_LOGS[id];
    log(written?pick(written):`You spent time on ${a.name.toLowerCase()}, and it became part of your routine.`,a.vice?null:'good');
  }
  afterAction(0);
}

function handleEducation(){
  if(!G.eduProgram)return;
  const ep=G.eduProgram, prog=PROGRAMS.find(p=>p.id===ep.id); if(!prog){G.eduProgram=null;return;}
  const campus=campusState();
  const load=COLLEGE_LOADS[campus.courseLoad]||COLLEGE_LOADS.standard;
  const tuition=Math.round((prog.cost/prog.years)*(1-(ep.scholarship||0))*load.cost);
  const housing={dorm:14000,offcampus:10000,commute:3000}[campus.housing]||0;
  const house=greekHouse(campus),dues=house?house.dues:0;
  pay(tuition+housing+dues,true);
  ep.gpa=clamp((ep.gpa??65)+rnd(-5,4)+load.gpa+(campus.studyGroup?1:0));
  S.stress=clamp(S.stress+load.stress+(campus.team?2:0)+(campus.leader?2:0));
  if(campus.campusJob){const jobs={library:4200,cafe:5200,lab:6000,desk:4600};const wage=jobs[campus.campusJob]||4200;G.cash+=wage;S.stress=clamp(S.stress+3);log(`Your campus job brought in ${money(wage)} this year. It did not cover everything, but it made the smaller bills less frightening.`,'money');}
  if(ep.gpa<30){
    ep.probation=true;S.stress=clamp(S.stress+10);S.happiness=clamp(S.happiness-5);
    log(`Academic probation. Your grades were too low to earn credit this year, but the ${money(tuition+housing+dues)} bill arrived on time. An adviser used the phrase "last chance" twice.`,'bad');
    return;
  }
  ep.probation=false;ep.creditsEarned=Math.min(ep.creditsNeeded,(ep.creditsEarned||0)+load.credits);ep.left=Math.max(0,Math.ceil((ep.creditsNeeded-ep.creditsEarned)/load.credits));
  K[prog.skill]=clamp(K[prog.skill]+(campus.courseLoad==='heavy'?4:campus.courseLoad==='light'?2:3));S.smarts=clamp(S.smarts+2);
  if(ep.creditsEarned>=ep.creditsNeeded){
    G.edu=Math.max(G.edu,prog.gives); G.major=ep.major||G.major;
    const honors=ep.gpa>=93?'summa cum laude':ep.gpa>=88?'magna cum laude':ep.gpa>=82?'cum laude':null;
    const achievements=[honors,campus.internships?`${campus.internships} internship${campus.internships===1?'':'s'}`:null,campus.leader?'chapter officer':null,campus.teamRole==='Captain'?'varsity captain':null].filter(Boolean);
    G.flags.collegeNetwork=clamp((G.flags.collegeNetwork||0)+Math.round(campus.popularity/10)+(house?8:0)+(campus.club?4:0)+(campus.leader?8:0),0,100);
    G.flags.lastCollegeRecord={program:prog.name,major:ep.major,gpa:Math.round(ep.gpa),honors,internships:campus.internships||0,greek:house&&house.name,club:collegeClubData(campus)?.name||null,team:campus.team,teamRole:campus.teamRole};
    log(`You graduated from ${prog.name.toLowerCase()}${ep.major?', in '+ep.major:''} with a ${collegeLetter(ep.gpa)} average${honors?` and ${honors} honors`:''}. ${achievements.length?`You left with ${achievements.join(', ')} on your record. `:''}The debt was real, but so were the diploma, the friendships, and the doors they opened.`,'good');
    G.eduProgram=null;
  } else {
    log(`Another year of ${prog.name.toLowerCase()} completed: ${ep.creditsEarned}/${ep.creditsNeeded} credits. Tuition, housing${dues?' and chapter dues':''} ran ${money(tuition+housing+dues)}. Your ${load.name.toLowerCase()} schedule left you with ${ep.left} estimated year${ep.left===1?'':'s'} to go.`,'sys');
  }
}
function collegeLetter(g){return g>=90?'A':g>=80?'B':g>=70?'C':g>=60?'D':'barely passing';}
function campusState(){
  if(!G.eduProgram)return null;
  const prog=PROGRAMS.find(p=>p.id===G.eduProgram.id);
  if(prog){
    if(G.eduProgram.creditsNeeded==null)G.eduProgram.creditsNeeded=prog.years*30;
    if(G.eduProgram.creditsEarned==null)G.eduProgram.creditsEarned=Math.max(0,(prog.years-(G.eduProgram.left??prog.years))*30);
    G.eduProgram.left=Math.max(0,Math.ceil((G.eduProgram.creditsNeeded-G.eduProgram.creditsEarned)/30));
  }
  if(!G.eduProgram.campus)G.eduProgram.campus=defaultCampus(G.eduProgram.id);
  else Object.assign(G.eduProgram.campus,Object.fromEntries(Object.entries(defaultCampus(G.eduProgram.id)).filter(([k])=>G.eduProgram.campus[k]===undefined)));
  const load=COLLEGE_LOADS[G.eduProgram.campus.courseLoad]||COLLEGE_LOADS.standard;
  G.eduProgram.left=Math.max(0,Math.ceil((G.eduProgram.creditsNeeded-G.eduProgram.creditsEarned)/load.credits));
  return G.eduProgram.campus;
}

function playLottery(){
  if(!afford(20)){toast('Not even for a ticket.');return;}
  if(!spendAct('lottery'))return;
  pay(20);
  const r=Math.random(); let win=0;
  if(r<0.000001)win=10000000; else if(r<0.00002)win=100000; else if(r<0.0005)win=5000; else if(r<0.02)win=100;
  if(win)log(`You bought a lottery ticket and — impossibly — won ${money(win)}. ${win>=100000?'You checked the numbers until the paper went soft in your hands.':'A small, stupid, real joy.'}`,'money'),G.cash+=win;
  else log(`You bought a lottery ticket. The numbers were not your numbers. They never are, but the dollar buys a few minutes of a different life.`);
  afterAction(0);
}
function openCasino(){
  $('modalbox').innerHTML=`<h2>The casino</h2><p>The carpet is loud so the room can feel quiet. There are no clocks. Set your bet.</p>
    <div class="row"><label>Bet</label><input type="number" id="bet" value="100" min="1"></div>
    <div class="acts"><button onclick="casinoPlay('slots')">Slots</button><button onclick="casinoPlay('roulette')">Roulette · red</button><button onclick="casinoPlay('blackjack')">Blackjack</button></div>
    <div class="note" id="casino_out">Your cash: ${money(G.cash)}</div>
    <div style="margin-top:12px"><button onclick="leaveCasino()">Cash out & leave</button></div>`;
  openModal();
}
function casinoPlay(game){
  const bet=Math.max(1,Math.round(+($('bet').value||0)));
  if(!afford(bet)){$('casino_out').textContent="You don't have that to lose.";return;}
  if(!spendAct('casino'))return;
  pay(bet); let win=0,msg='';
  if(game==='slots'){ const r=Math.random(); if(r<0.02)win=bet*20; else if(r<0.10)win=bet*3; else if(r<0.26)win=bet; msg=win?`The reels caught. +${money(win)}.`:`Nothing. The reels don't know you're there.`; }
  else if(game==='roulette'){ if(chance(18/38)){win=bet*2;msg=`Red. +${money(win)}.`;} else msg=`Black. It's gone.`; }
  else { if(chance(0.46)){win=bet*2;msg=`You beat the dealer. +${money(win)}.`;} else if(chance(0.09)){win=bet;msg=`Push — you keep your ${money(bet)}.`;} else msg=`Dealer wins. Of course.`; }
  if(win)G.cash+=win;
  if(win>bet)S.happiness=clamp(S.happiness+1); else {S.stress=clamp(S.stress+1);G.flags.gambled=(G.flags.gambled||0)+1;}
  $('casino_out').textContent=msg+`  ·  Cash: ${money(G.cash)}`;
  settleActionEffects();renderSheet();saveGame(true);
}
function leaveCasino(){ forceClose(); if(G.flags.gambled>6){log(`You lost track of time at the casino again this year. There's a version of you that lives in that room and you don't like him.`);G.flags.gambled=0;} afterAction(0); }

function resolveCrime(c,targetId){

  const t=targetId?npc(targetId):null;
  if(chance(odds)){
    const gain=rnd(c.pay[0],c.pay[1]); if(gain>0)G.cash+=gain;
    applyFx(c.gain); G.notoriety+=c.heat;
    if(c.vice)G.addiction[c.vice]=clamp(G.addiction[c.vice]+(c.viceAmt||6));
    if(t){ if(c.id==='murder'){ t.alive=false; t.memory.push('Killed.'); } else if(c.id==='assault'){ t.loyalty=clamp(t.loyalty-40); t.memory.push(`${G.name} attacked me.`);} }
    log(crimeWin(c,gain,t),'bad');
    thread('coldcase',{crime:c.id});
    if(c.pay[1]>0&&gain<=0){} 
  } else {
    if(c.fine)pay(c.fine,true);
    applyFx(c.gain);
    if(c.jail)jail(c.jail,c); else { G.record.push({crime:c.name,age:G.age}); log(crimeCaught(c),'bad'); }
    if(c.jail){} // jail() already logged
  }
  afterAction(3);
}
function crimeWin(c,gain,t){
  if(c.id==='murder')return `You killed ${t?t.name:'a stranger'}. It was quieter than films make it look, and it did not feel like the movies promised. You cleaned up and went home and made toast, and your hands only shook later. No one knows. That is a thing you own now.`;
  if(c.id==='assault')return `You put ${t?t.name:'someone'} on the ground and kept going a beat too long. Bystanders pulled out phones. You walked away fast, heart going, knuckles wrong. Something in you liked it, and that scared you more than the rest.`;
  if(gain>0)return `You pulled off the ${c.name.toLowerCase()} and walked with ${money(gain)}. The money spent like any other money, which is the terrible, seductive lesson of it.`;
  return `You pulled off the ${c.name.toLowerCase()} clean. No one saw. You told yourself it was the last time.`;
}
function crimeCaught(c){ return `The ${c.name.toLowerCase()} went wrong. ${c.fine?`A fine, a court date, a lawyer who smelled of other people's worst days. It cost you ${money(c.fine)} and a piece of your name.`:'You talked your way down to a warning, but your name is in a file now, and files are patient.'}`; }

  else if(kind==='photoshoot'){ if(S.looks<45){toast('The magazine wants a certain look right now.');return;} const earn=Math.round((f+5)*rnd(300,900)); G.cash+=earn; S.fame=clamp(f+rnd(2,5)); log(`You posed for a magazine. Hours under hot lights, a stylist who kept sighing, and one frame out of a thousand that they will actually print. ${money(earn)}.`,'money'); }
  else if(kind==='endorse'){ if(f<30){toast('Big brands want bigger fame.');return;} const earn=Math.round(f*rnd(8000,20000)); G.cash+=earn; S.fame=clamp(f+2); log(`You signed an endorsement deal \u2014 your face on a billboard, your name in a contract with more clauses than sense. ${money(earn)} landed in your account.`,'money'); }

function setSportsTeam(sp){
 if(!spendAct('school-sports'))return;
 if(!G.school)G.school={popularity:40,clique:null,team:null,teamRole:null,seasonYear:null};
 const made=chance(0.55+((K.athletics||0)+S.fitness)/300+(G.talent==='sports'?0.25:0));

function playSchoolSportsSeason(){
 const sc=G.school;if(!G.inSchool||!sc||!sc.team){toast('Join a school team first.');return;}
 if(sc.seasonYear===G.year){toast('You have already played this school season.');return;}
 if(!spendAct('school-season'))return;sc.seasonYear=G.year;
 const performance=(K.athletics||0)*.55+S.fitness*.3+(K.discipline||0)*.15+rnd(-18,18);
 K.athletics=clamp(K.athletics+4);S.fitness=clamp(S.fitness+3);K.discipline=clamp(K.discipline+2);S.stress=clamp(S.stress+3);
 let promoted=null;
 if(sc.teamRole==='Player'&&performance>=48&&chance(.48)){sc.teamRole='Alternate Captain';promoted='alternate captain';}
 else if(sc.teamRole==='Alternate Captain'&&performance>=58&&chance(.42)){sc.teamRole='Captain';promoted='team captain';}
 if(promoted){sc.popularity=clamp(sc.popularity+8);K.charisma=clamp(K.charisma+4);log(`You played your best season yet for the ${sc.team.toLowerCase()} team. After the final practice, the coach called everyone together and named you ${promoted}. Your teammates made enough noise to embarrass you, which was exactly right.`,'good');}
 else if(performance>=62){sc.popularity=clamp(sc.popularity+5);log(`You had a strong ${sc.team.toLowerCase()} season. You were not given a new title, but the coach trusted you in the moments that mattered and your teammates noticed.`,'good');}
 else log(`You played the full ${sc.team.toLowerCase()} season. Some games went well, others did not, and you learned how much of a team is built during ordinary practices.`);
 afterAction(1);
}

function personDetail(n){
  const blood=['parent','sibling','child','grandchild'].includes(n.role);
  const adultBoth=G.age>=18 && n.age>=18;
  const romance=!blood && adultBoth && !n.married && ['friend','coworker','fling'].includes(n.role);
  const life=[capitalize(n.label),n.age,n.career,n.location&&n.location!==G.place?n.location:null,n.partnerName?'with '+n.partnerName:null,(n.children||0)?`${n.children} child${n.children===1?'':'ren'}`:null].filter(Boolean).join(' \u2022 ');
  let h=`<div class="person" style="display:block"><div class="phead"><div><div class="t">${esc(n.name)}</div><div class="s">${esc(life)}</div></div><div class="rel"><span class="relw">${loyaltyWord(n.loyalty)}</span>${relbar(n.loyalty)}<span class="reln">${Math.round(n.loyalty)} / 100</span></div></div></div>`;
  h+=grp('Talk', actBtn('talk',n.id,'Conversation')+actBtn('compliment',n.id,'Compliment')+actBtn('insult',n.id,'Insult'));
  let together=actBtn('spendtime',n.id,'Spend time')+actBtn('concert',n.id,'Concert')+actBtn('prank',n.id,'Prank');
  if(G.age>=18)together+=actBtn('party',n.id,'Party');
  h+=grp('Do something together', together);
  h+=grp('Money', actBtn('gift',n.id,'Give a gift')+(G.age>=13?actBtn('deal',n.id,'Sell them something'):''));
  if(currentWorkContact(n)){const boss=n.id===G.job.workplace.supervisor;let office=actBtn('work-collaborate',n.id,'Collaborate')+actBtn('work-network',n.id,'Network over lunch','$120')+(!n.friendOutsideWork?actBtn('work-befriend',n.id,'Become friends'):'' )+(n.workplaceConflict?actBtn('work-confront',n.id,'Confront them'):'' )+actBtn('work-hr',n.id,'Report to HR',n.workplaceConflict?'documented issue':'no documented issue')+(!boss?actBtn('work-steal',n.id,"Take credit for their work",G.job.lastCreditTheftYear===G.year?'already done this year':'high risk',G.job.lastCreditTheftYear===G.year):'');h+=grp('At work',office,n.workplaceConflict?`Current conflict: ${n.workplaceConflict}.`:`${boss?'Supervisor':'Coworker'} relationships feed your workplace network and promotion support.`);}
  if(romance){ let r=''; if(n.role==='friend'||n.role==='coworker')r+=actBtn('askout',n.id,'Ask out'); r+=actBtn('hookup',n.id,'Hook up'); if(r)h+=grp('Romance', r); }
  let st='';
  if(n.role==='partner'&&n.engaged){ st=actBtn('wedding',n.id,'Plan the wedding')+actBtn('breakup',n.id,'Call it off'); }
  else if(n.role==='partner'){ st=actBtn('marry',n.id,'Propose')+actBtn('breakup',n.id,'Break up'); }
  else if(n.role==='spouse'){ st=actBtn('baby',n.id,'Try for a baby')+actBtn('divorce',n.id,'Divorce'); }
  else if(n.divorced){ st=actBtn('coparent',n.id,'Co-parent calmly')+actBtn('coparent',n.id+'|court','Return to family court'); }
  else if(n.role==='friend'||n.role==='fling'){ st=actBtn('breakup',n.id,'Cut off'); }
  if(st)h+=grp('Status', st);
  return h;
}
function npcTalk(id){ const n=npc(id);if(!n)return;if(!spendAct('talk'))return; n.loyalty=clamp(n.loyalty+rnd(2,5)); S.happiness=clamp(S.happiness+1); log(`You had a real conversation with ${n.name}. ${pick(['Nothing urgent, just the maintenance that keeps people close.','They told you something they had not told anyone.','You disagreed about something small and enjoyed it.'])}`,'good'); afterAction(0); }
function npcInsult(id){ if(!spendAct())return; const n=npc(id); if(!n)return; n.loyalty=clamp(n.loyalty-rnd(5,12)); n.memory.push(`${G.name} insulted me at ${G.age}.`); if(chance(0.4)){ S.happiness=clamp(S.happiness-3); log(`You said something cruel to ${n.name} and they gave it right back, sharper. It stung more than you expected.`,'bad'); } else { S.stress=clamp(S.stress-2); log(`You said something cruel to ${n.name}. It felt good for exactly as long as it took to land, and worse after.`,'bad'); } afterAction(0); }

function npcHookup(id){ const n=npc(id); if(!n)return; if(['parent','sibling','child'].includes(n.role)){toast('No.');return;} if(G.age<18||n.age<18){toast('Not appropriate.');return;}if(!spendAct('hookup'))return; S.happiness=clamp(S.happiness+4); n.loyalty=clamp(n.loyalty+rnd(2,6)); n.memory.push(`${G.name} and I got together at ${G.age}.`); const cheat=partner()&&partner().id!==n.id; log(`You and ${n.name} ${pick(['ended a long night at the same door','stopped pretending it was only friendly','let something that had been building finally happen'])}. ${cheat?'You have a partner. You did it anyway, and the knowing sat in your chest like a stone.':'In the morning it was either the start of something or a thing you would both step around forever.'}`); if(cheat)thread('cheated',{npc:partner().id,name:n.name}); afterAction(2); }

function handleEconomy(){
  if(!G.economy)G.economy={cycle:'Expansion',inflation:2.4,rate:4.5,priceIndex:1};
  const e=G.economy,old=e.cycle;
  if(chance(.18)){const next={Boom:['Expansion','Expansion','Recession'],Expansion:['Boom','Expansion','Flat'],Flat:['Expansion','Flat','Recession'],Recession:['Flat','Expansion','Recession']}[e.cycle]||['Expansion'];e.cycle=pick(next);}
  const target={Boom:4.8,Expansion:2.7,Flat:2.1,Recession:1.1}[e.cycle];e.inflation=clamp(e.inflation+(target-e.inflation)*.45+(Math.random()-.5)*1.2,-1.5,9.5);e.rate=clamp(e.rate+(e.inflation>4?.8:e.inflation<1?-.6:(e.cycle==='Recession'?-.45:.05)),.25,12);e.priceIndex*=1+e.inflation/100;
  if(old!==e.cycle)log(`The economy shifted from ${old.toLowerCase()} to ${e.cycle.toLowerCase()}. Inflation ran ${e.inflation.toFixed(1)}%, and borrowing rates settled near ${e.rate.toFixed(1)}%. Markets and household bills noticed before most people did.`,e.cycle==='Recession'?'bad':'money');
}
function handleInvestments(){

  const propSel=`<select id="god_prop">${PROPERTIES.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
  const evSel=`<select id="god_ev">${EVENTS.map(e=>`<option value="${e.id}">${e.id}</option>`).join('')}</select>`;
  const npcRoleSel=`<select id="god_npcrole"><option value="friend">friend</option><option value="partner">partner</option><option value="spouse">spouse</option><option value="child">child</option><option value="sibling">sibling</option><option value="parent">parent</option><option value="coworker">coworker</option></select>`;
  const npcList=allNPCs().map(n=>`<div class="row"><label>${esc(n.name)} <span class="s">(${n.label})</span></label><input type="range" min="0" max="100" value="${n.loyalty}" oninput="npc('${n.id}').loyalty=+this.value"></div>`).join('')||'<div class="note">No one in your life yet.</div>';
  $('modalbox').innerHTML=`<div class="god"><h2>God mode</h2>
    <div class="note">This is your workshop. Bend anything. Nothing here judges you — it's your story.</div>
    <div class="acts">
      <button onclick="godMoney(10000)">+$10k</button>
      <button onclick="godMoney(1000000)">+$1M</button>
      <button onclick="G.debt=0;renderAll();toast('Debt cleared.')">Clear debt</button>
      <button onclick="godHeal()">Heal fully</button>
      <button onclick="G.record=[];G.notoriety=0;renderAll();toast('Record wiped.')">Wipe record</button>
      <button onclick="godImmortal()">${(G.flags&&G.flags.immortal)?'Mortality on':'Immortality'}</button>
      <button onclick="if(G.jailUntil>G.age){G.jailUntil=0;renderAll();toast('Freed.')}">Release from jail</button>
      <button onclick="godSkip(5)">Skip 5 years</button>
    </div>
    <h4>Money & standing</h4>
    <div class="row"><label>Cash</label>${num('god_cash',G.cash)}<label>Debt</label>${num('god_debt',G.debt)}<label>Credit</label>${num('god_credit',G.creditScore)}</div>
    <div class="row"><label>Age</label>${num('god_age',G.age)}<label>Education</label>${eduSel}</div>
    <h4>Stats</h4>${statInputs}
    <h4>Skills</h4>${skillInputs}
    <h4>Give yourself things</h4>
    <div class="row"><label>Item</label>${itemSel}<button onclick="godAddItem()">Add item</button></div>
    <div class="row"><label>Property</label>${propSel}<button onclick="godAddProp()">Add property</button></div>
    <h4>People</h4>
    <div class="row"><label>Add person</label>${npcRoleSel}<input type="text" id="god_npcname" placeholder="name"><button onclick="godAddNPC()">Add</button></div>
    <div class="list">${npcList}</div>
    <h4>Force an event</h4>
    <div class="row"><label>Event</label>${evSel}<button onclick="godTriggerEvent()">Run it</button></div>
    <div class="opts" style="margin-top:14px"><button class="primary" onclick="godApply()">Apply changes</button><button onclick="forceClose()">Done</button></div>
  </div>`;
  openModal();
}
function gv(id){ const el=$(id); return el?+el.value:null; }
function godApply(){
  ['health','happiness','smarts','looks','fitness','fame','stress'].forEach(k=>{const v=gv('god_'+k);if(v!=null)S[k]=clamp(v);});
  Object.keys(SKILLS).forEach(k=>{const v=gv('god_skill_'+k);if(v!=null)K[k]=clamp(v);});
  const cash=gv('god_cash'); if(cash!=null)G.cash=Math.round(cash);
  const debt=gv('god_debt'); if(debt!=null)G.debt=Math.max(0,Math.round(debt));
  const cr=gv('god_credit'); if(cr!=null)G.creditScore=clamp(cr,300,850);
  const age=gv('god_age'); if(age!=null&&age>=0)G.age=Math.round(age);
  const edu=gv('god_edu'); if(edu!=null)G.edu=edu;
  renderAll(); saveGame(true); toast('Reality updated.');
}
function godMoney(n){ G.cash+=n; renderAll(); saveGame(true); toast(`+${money(n)}`); }
function godHeal(){ S.health=100; S.stress=clamp(S.stress-40); G.addiction.alcohol=0; G.addiction.drugs=0; G.conditions=[]; renderAll(); toast('Healed.'); }
function godImmortal(){ G.flags.immortal=!G.flags.immortal; toast(G.flags.immortal?'You cannot die now.':'Mortality restored.'); openGod(); }
function godAddItem(){ const id=$('god_item').value; if(!ITEM[id])return; G.items.push({id,cond:100,value:ITEM[id].price,maintain:true}); renderAll(); toast(`${ITEM[id].name} added.`); }
function godAddProp(){ const id=$('god_prop').value; if(!PROP[id])return; G.props.push({id,cond:100,maintain:true,owned:true}); G.home='own'; renderAll(); toast(`${PROP[id].name} added.`); }
function godAddNPC(){ const role=$('god_npcrole').value; const name=($('god_npcname').value||pick(MALE.concat(FEMALE)))+(role==='child'||role==='sibling'?' '+G.last:''); const n=mkNPC(role,role,name,rnd(0,40)); n.met=G.age; G.npcs.push(n); openGod(); toast(`${name} added.`); }
function godTriggerEvent(){ const id=$('god_ev').value; const e=EVENTS.find(x=>x.id===id); if(!e)return; if(e.cond&&!safeCond(e.cond)){toast("That event doesn't fit this life right now.");return;} if(!G.history.length)startYearLog(); try{e.run();}catch(err){console.error(err);toast('That event misfired.');} forceClose(); renderAll(); if(!pendingChoice)saveGame(true); }
function godSkip(n){ forceClose(); for(let i=0;i<n;i++){ if(!G.alive||pendingChoice)break; ageUp(); } }

/* ---------------- character creation ---------------- */
let createMode='basic';
function countryOptions(){ return ['(random)'].concat(Object.keys(COUNTRIES)).map(x=>`<option>${x}</option>`).join(''); }
function openCreate(){
  pendingChoice=null;
  $('modalbox').innerHTML=`<div class="create"><h2>A new life</h2>
    <div class="tabs" id="ctabs">
      <button type="button" class="on" onclick="switchCreateTab('basic')">Basics</button>
      <button type="button" onclick="switchCreateTab('god')">God mode</button>
    </div>
    <div id="cbasic" class="cpane">
      <p class="note">Just the essentials. Everything else is left to a fair roll of the dice.</p>
      <div class="row"><label>First name</label><input type="text" id="b_first" placeholder="(random)"></div>
      <div class="row"><label>Last name</label><input type="text" id="b_last" placeholder="(random)"></div>
      <div class="row"><label>Gender</label><select id="b_sex"><option>Male</option><option>Female</option></select></div>
      <div class="row"><label>Country</label><select id="b_country" onchange="fillCities('b')">${countryOptions()}</select></div>
      <div class="row"><label>City</label><select id="b_city"><option>(random)</option></select></div>
    </div>
    <div id="cgod" class="cpane" style="display:none">
      <p class="note">Author the whole beginning. Leave any stat blank to roll it.</p>
      <div class="row"><label>First name</label><input type="text" id="g_first" placeholder="(random)"></div>
      <div class="row"><label>Last name</label><input type="text" id="g_last" placeholder="(random)"></div>
      <div class="row"><label>Gender</label><select id="g_sex"><option>Male</option><option>Female</option></select></div>
      <div class="row"><label>Country</label><select id="g_country" onchange="fillCities('g')">${countryOptions()}</select></div>
      <div class="row"><label>City</label><select id="g_city"><option>(random)</option></select></div>
      <div class="row"><label>Special talent</label><select id="g_talent" onchange="document.getElementById('g_talentblurb').textContent=TALENTS[this.value].blurb">${Object.keys(TALENTS).map(t=>`<option value="${t}">${TALENTS[t].name}</option>`).join('')}</select></div>
      <div class="note" id="g_talentblurb">${TALENTS.none.blurb}</div>
      <h4>Starting stats</h4>
      <div class="row"><label>Health</label><input type="number" id="g_health" placeholder="70–100"><label>Happiness</label><input type="number" id="g_happiness" placeholder="70–100"></div>
      <div class="row"><label>Smarts</label><input type="number" id="g_smarts" placeholder="20–80"><label>Looks</label><input type="number" id="g_looks" placeholder="20–90"></div>
      <div class="row"><label>Fitness</label><input type="number" id="g_fitness" placeholder="20"><label>Stress</label><input type="number" id="g_stress" placeholder="10"></div>
    </div>
    <div class="opts" style="margin-top:14px"><button class="primary" type="button" onclick="beginLife()">Be born ›</button></div>
  </div>`;
  createMode='basic';
  openModal();
}
function switchCreateTab(which){
  createMode=which;
  $('cbasic').style.display=which==='basic'?'':'none';
  $('cgod').style.display=which==='god'?'':'none';
  const btns=$('ctabs').querySelectorAll('button');
  btns[0].classList.toggle('on',which==='basic');
  btns[1].classList.toggle('on',which==='god');
}
function fillCities(prefix){
  const country=$(prefix+'_country').value, sel=$(prefix+'_city');
  if(country==='(random)'||!COUNTRIES[country]){ sel.innerHTML='<option>(random)</option>'; return; }
  sel.innerHTML=['(random)'].concat(Object.keys(COUNTRIES[country])).map(c=>`<option>${c}</option>`).join('');
}
function beginLife(){
  const p=(createMode==='god')?'g':'b';
  const rd=id=>{const el=$(p+'_'+id);return el?el.value:'';};
  let country=rd('country'); if(country==='(random)'||!country)country=null;
  let city=rd('city'); if(city==='(random)'||!city)city=null;
  if(country&&!city){ const cs=Object.keys(COUNTRIES[country]||{}); if(cs.length)city=pick(cs); }
  if(!country&&city){ country=countryOf(city); }
  const cfg={
    name:(rd('first')||'').trim()||null,
    last:(rd('last')||'').trim()||null,
    sex:rd('sex')||'Male',
    place:city, country:country,
  };
  if(createMode==='god'){
    ['health','happiness','smarts','looks','fitness','stress'].forEach(k=>{const v=rd(k);if(v!=='')cfg[k]=clamp(+v);});
    const t=rd('talent'); if(t&&t!=='none')cfg.talent=t;
  }
  forceClose();
  G=blankLife(cfg); S=G.stats; K=G.skills; pendingChoice=null; menuOpen=null;yearUndo=null;
  G.history=[]; startYearLog();
  const mom=livingParents().find(p=>p.label==='mother'), dad=livingParents().find(p=>p.label==='father');
  const where=`${G.place}${(G.country&&G.country!=='United States')?', '+G.country:''}`;
  log(`You were born ${G.sex==='Male'?'a boy':'a girl'} in ${where}, to ${mom?mom.name:'a mother'} and ${dad?dad.name:'a father'}. The room was cold and bright and full of strangers, and you announced yourself the only way you knew how. Somewhere a form was filled out with your name on it: ${G.name}. The first of many.`,'good');
  if(G.talent&&TALENTS[G.talent]){ log(`Even as a baby, something was obvious to everyone who held you: ${TALENTS[G.talent].blurb.toLowerCase()}`); }
  const sib=G.npcs.find(n=>n.role==='sibling');
  if(sib)log(`You had ${sib.age>0?'an older':'a'} ${sib.label}, ${sib.name}, ${sib.age>0?'already waiting':'who would come along soon'} — the first person who would know you your whole life.`);
  finishYear();
  toast('A life begins.');
}
function confirmNewLife(){
  if(!G){ openCreate(); return; }
  $('modalbox').innerHTML=`<h2>End this life?</h2><p>Starting a new life closes the book on ${esc(G.name)}. If you might come back to them, Export first. This can't be undone.</p><div class="opts"><button class="danger" onclick="forceClose();openCreate()">Start a new life</button><button onclick="forceClose()">Keep living this one</button></div>`;
  openModal();
}

/* ---------------- obituary ---------------- */
function openObituary(){
  if(!G)return;
  const net=netWorth();
  const yrs=`${G.born}–${G.year}`;
  const notable=[];
  if(S.fame>50)notable.push('a name people knew');
  if(net>1000000)notable.push(`${money(net)} to your name`);
  if(kids().length)notable.push(`${kids().length} child${kids().length>1?'ren':''}`);
  if(G.record.length)notable.push(`${G.record.length} mark${G.record.length>1?'s':''} on your record`);
  if(G.special)notable.push(`a life as ${SPECIAL[G.special.type].name.toLowerCase()}`);
  $('modalbox').innerHTML=`<h2>${esc(G.name)}</h2>
    <div class="note">${yrs} · died at ${G.age} · ${esc(capitalize(G.cause||'the end'))}</div>
    <p>${eulogyLong()}</p>
    ${notable.length?`<p class="sys">You left behind ${notable.join(', ')}.</p>`:''}
    <div class="opts"><button class="primary" onclick="forceClose();openCreate()">Live again</button><button onclick="forceClose()">Sit with it</button></div>`;
  openModal();
}
function eulogyLong(){
  const bits=[];
  bits.push(`You lived ${G.age} years. That is ${G.age<40?'not many':G.age<70?'a full stretch':'a long time'}, measured in winters.`);
  if(partner())bits.push(`${partner().name} was there at the end.`);
  else if(family().length)bits.push(`Family gathered, in the complicated way families do.`);
  else bits.push(`The room, at the end, was quiet.`);
  if(S.happiness>65)bits.push(`On balance, you were happy, which is rarer than any fortune.`);
  else if(S.happiness<35)bits.push(`It was a harder life than it needed to be. You knew that. It's part of why it's over now the way it is.`);
  return bits.join(' ');
}

function sanitizeSave(){
 if(!G)return;
 G.items=(G.items||[]).filter(it=>ITEM[it.id]);G.props=(G.props||[]).filter(p=>PROP[p.id]);
 if(G.job&&!JOB[G.job.id])G.job=null;if(G.special&&!SPECIAL[G.special.type])G.special=null;
 if(!G.flags)G.flags={};if(!G.addiction)G.addiction={alcohol:0,drugs:0};if(!G.social)G.social={};if(!G.pets)G.pets=[];if(!Array.isArray(G.conditions))G.conditions=[];G.conditions=G.conditions.filter(c=>DISEASE[c.id]);
 if(!Array.isArray(G.pensions))G.pensions=[];if(!G.serviceYears||typeof G.serviceYears!=='object')G.serviceYears={};if(!G.highSalary||typeof G.highSalary!=='object')G.highSalary={};if(!Array.isArray(G.careerHistory))G.careerHistory=[];if(!Array.isArray(G.supportOrders))G.supportOrders=[];if(!Array.isArray(G.divorceHistory))G.divorceHistory=[];
 if(!G.school)G.school={popularity:40,clique:null,team:null,teamRole:null,seasonYear:null};else{if(G.school.teamRole===undefined)G.school.teamRole=G.school.team?'Player':null;if(G.school.seasonYear===undefined)G.school.seasonYear=null;}if(!G.invest)G.invest={};if(!G.market)G.market={};if(!G.marketChg)G.marketChg={};
 if(!G.threads)G.threads=[];if(!G.arcs)G.arcs=[];if(!G.balance)G.balance={livingCost:0};if(!G.economy)G.economy={cycle:'Expansion',inflation:2.4,rate:4.5,priceIndex:1};if(!G.actionEffects||typeof G.actionEffects!=='object')G.actionEffects={};
 if(G.eduProgram){if(G.eduProgram.gpa==null)G.eduProgram.gpa=clamp(Math.round((G.gpaSeed+S.smarts)/2));if(G.eduProgram.scholarship==null)G.eduProgram.scholarship=0;const cc=campusState();if(cc.leader)cc.officeAttempted=true;}
 if(G.special){const c=G.special;if(c.form==null)c.form=50;if(c.momentum==null)c.momentum=10;if(c.projects==null)c.projects=0;if(c.awards==null)c.awards=0;if(c.residuals==null)c.residuals=0;if(c.catalog==null)c.catalog=0;if(c.focus==null)c.focus=c.type==='actor'?'Film & television':c.type==='musician'?'Rock & pop':pick(SPORTS);if(c.type==='actor')ensureActorCareer();if(c.type==='musician')ensureMusicianCareer();if(c.type==='athlete')ensureAthleteCareer();}
 G.npcs=G.npcs||[];G.npcs.forEach(n=>{if(n.career===undefined)n.career=null;if(n.income===undefined)n.income=0;if(n.partnerName===undefined)n.partnerName=null;if(n.children===undefined)n.children=0;if(n.location===undefined)n.location=G.place;if(n.education===undefined)n.education=0;if(n.friendOutsideWork===undefined)n.friendOutsideWork=false;if(n.workplaceConflict===undefined)n.workplaceConflict=null;if(!n.memory)n.memory=[];});
 if(G.job){ensureWorkplace();const j=JOB[G.job.id];G.serviceYears[j.track]=Math.max(G.serviceYears[j.track]||0,G.job.years||0);G.highSalary[j.track]=Math.max(G.highSalary[j.track]||0,jobAnnualPay());}
 if(G.military){const mpay=(G.military.officer?OFFPAY:MILPAY)[G.military.rank]||0;G.serviceYears.Military=Math.max(G.serviceYears.Military||0,G.military.years||0);G.highSalary.Military=Math.max(G.highSalary.Military||0,mpay);}
 const spouse=G.npcs.find(n=>n.alive&&n.role==='spouse');if(spouse){ensureMarriage(spouse);for(const k of kids())if(!k.otherParentId)k.otherParentId=spouse.id;}else if(G.marriage)G.marriage=null;
 G.version=GAME_VERSION;
}
function homeLabel(){ const p=G.props[G.props.length-1]; return (p&&PROP[p.id])?PROP[p.id].name:(G.home==='rent'?'Renting':'With parents'); }

/* ---------------- boot ---------------- */
function boot(){
  if(loadGame()&&G){ menuOpen=null; renderAll(); if(!G.alive){ /* leave the book closed */ } }
  else { openCreate(); }
}
window.addEventListener('load',boot);
</script>
