function doFame(kind){
  const f=S.fame;
  if(kind==='book'){ const earn=Math.round((f+10)*rnd(200,600)); G.cash+=earn; S.fame=clamp(f+rnd(2,6)); K.writing=clamp((K.writing||0)+3); log(`You wrote a book. ${pick(['A memoir no one asked for and plenty bought.','Ghostwritten, mostly, but your name is on the spine.','It got one cruel review and a lot of kind ones.'])} It cleared ${money(earn)}.`,'money'); }
  else if(kind==='commercial'){ if(f<15){toast('Not famous enough for brands to call yet.');return;} const earn=Math.round(f*rnd(1500,4000)); G.cash+=earn; S.fame=clamp(f+2); log(`You shot a TV commercial \u2014 twelve hours for thirty seconds of you smiling at a product you would never buy. ${money(earn)} for the trouble.`,'money'); }
  else if(kind==='talkshow'){ if(f<10){toast('The bookers do not know your name yet.');return;} S.fame=clamp(f+rnd(3,7)); S.happiness=clamp(S.happiness+3); log(`You went on a talk show. You told the anecdote you always tell, laughed on cue, and left the studio a little more famous than you walked in.`,'good'); }
  else if(kind==='photoshoot'){ if(S.looks<45){toast('The magazine wants a certain look right now.');return;} const earn=Math.round((f+5)*rnd(300,900)); G.cash+=earn; S.fame=clamp(f+rnd(2,5)); log(`You posed for a magazine. Hours under hot lights, a stylist who kept sighing, and one frame out of a thousand that they will actually print. ${money(earn)}.`,'money'); }
  else if(kind==='endorse'){ if(f<30){toast('Big brands want bigger fame.');return;} const earn=Math.round(f*rnd(8000,20000)); G.cash+=earn; S.fame=clamp(f+2); log(`You signed an endorsement deal \u2014 your face on a billboard, your name in a contract with more clauses than sense. ${money(earn)} landed in your account.`,'money'); }
  else if(kind==='crashout'){ if(chance(0.5)){ S.fame=clamp(f+rnd(6,14)); G.notoriety+=6; S.happiness=clamp(S.happiness-4); log(`You crashed out in public \u2014 a rant, a scene, a video that traveled faster than your regret. Infamy is still fame, and the algorithm does not care how you got there.`,'bad'); } else { S.fame=clamp(f-rnd(4,10)); S.happiness=clamp(S.happiness-8); log(`You crashed out in public and it just looked sad. No one laughed with you, only at you. The clips got taken down, but the internet keeps its own copies.`,'bad'); } }
  afterAction(2);
}

function joinSocial(id){ const x=SOCIALS.find(y=>y.id===id); if(!x)return; if(!G.social)G.social={}; if(G.social[id]){toast('You already have that account.');return;} G.social[id]={followers:rnd(5,60)}; log(`You made a ${x.name} account. The first followers were, as ever, your mother and three bots.`); afterAction(0); }
function postSocial(id){ if(!spendAct('post:'+id))return; const x=SOCIALS.find(y=>y.id===id); const acct=G.social&&G.social[id]; if(!acct)return; const pull=1+(K.charisma||0)/40+(S.looks||0)/60+(S.fame||0)/25; let gain=Math.round((acct.followers||0)*0.04*pull)+rnd(10,120); let viral=false; if(chance(0.05+Math.min(0.15,(S.fame||0)/300))){ gain*=rnd(8,25); viral=true; S.fame=clamp(S.fame+rnd(2,6)); } acct.followers=(acct.followers||0)+gain; K.charisma=clamp((K.charisma||0)+1); log(viral?`A ${x.name} post of yours went viral \u2014 ${gain.toLocaleString()} new ${x.unit} and a spike of fame you did not plan and cannot repeat on purpose.`:`You posted on ${x.name}. ${gain.toLocaleString()} new ${x.unit}. The number is a slot machine and you know it and you pull it anyway.`, viral?'good':null); afterAction(0); }
function monetizeSocial(id){ const x=SOCIALS.find(y=>y.id===id); const acct=G.social&&G.social[id]; if(!acct||(acct.followers||0)<10000){toast('You need 10,000 followers to monetize.');return;} const earn=Math.round((acct.followers||0)*rnd(3,12)/100); G.cash+=earn; log(`You monetized your ${x.name} \u2014 sponsorships, a link in the bio, the usual quiet compromises. ${money(earn)} this year off ${acct.followers.toLocaleString()} ${x.unit}.`,'money'); afterAction(0); }

function doCharity(){ const max=Math.min(G.cash,5000000); if(max<1000){toast('You need at least $1,000 to give meaningfully.');return;} $('modalbox').innerHTML=`<h2>Charity donation</h2><p>Give what you like. Karma is not guaranteed, but it is rarely wasted.</p><div class="row"><label>Amount</label><input type="number" id="charamt" value="${Math.min(10000,Math.round(max))}" min="1000" max="${Math.round(max)}"></div><div class="opts"><button onclick="confirmCharity()">Give it</button></div>`; openModal(); }
function confirmCharity(){ const amt=Math.max(1000,Math.min(G.cash,Math.round(+($('charamt').value||0)))); forceClose(); if(!pay(amt))return; S.happiness=clamp(S.happiness+Math.min(12,3+amt/20000)); if(S.fame>0)S.fame=clamp(S.fame+Math.min(4,amt/50000)); G.flags.karma=(G.flags.karma||0)+1; log(`You gave ${money(amt)} away. ${pick(['No plaque, no photo \u2014 you just did it.','They put your name on a wall you will never visit.','It felt good, and you distrusted how good it felt.'])}`,'good'); afterAction(0); }
function joinSociety(){ if((S.fame||0)<25&&netWorth()<500000){toast('Secret societies recruit the powerful. Get richer or more famous first.');return;} if(G.flags.society){toast('You are already a member. That is all we will say.');return;} const cost=Math.min(G.cash,250000); pay(cost); G.flags.society=true; S.fame=clamp(S.fame+3); K.charisma=clamp((K.charisma||0)+4); log(`You were let into a society that does not have a name you can repeat. A handshake, a ledger, a promise. Doors open a little easier now, and you try not to think too hard about what closes behind them.`,'good'); afterAction(0); }

const PETSPECIES=['dog','cat','parrot','snake','horse','rabbit'];
function getPet(){ $('modalbox').innerHTML=`<h2>Get a pet</h2><p>Companionship, on four legs or otherwise.</p><div class="opts" id="petbox"></div>`; const box=$('petbox'); PETSPECIES.forEach(sp=>{ const b=document.createElement('button'); b.textContent='A '+sp; b.onclick=()=>{forceClose();adoptPet(sp);}; box.appendChild(b); }); openModal(); }
function adoptPet(sp){ const nm=pick(MALE.concat(FEMALE)); pay(Math.min(G.cash,rnd(50,800))); if(!G.pets)G.pets=[]; G.pets.push({sp,name:nm,age:0}); S.happiness=clamp(S.happiness+6); S.stress=clamp(S.stress-3); log(`You got a ${sp} and named ${(sp==='dog'||sp==='cat')?'them':'it'} ${nm}. ${pick(['The house is louder and better for it.','You are responsible for a small life now, and it changes how the days feel.','It hates you a little at first. That will change.'])}`,'good'); afterAction(0); }
function adoptChild(){ if(G.age<18){toast('You must be an adult to adopt.');return;} if(chance(0.7)){ const sex=chance(0.5)?'Male':'Female'; const k=addNPC('child',(sex==='Male'?pick(MALE):pick(FEMALE))+' '+G.last, rnd(0,8)); k.loyalty=60; pay(Math.min(G.cash,rnd(8000,25000))); S.happiness=clamp(S.happiness+8); log(`After a mountain of paperwork and a home visit that made you clean behind the fridge, you adopted ${k.name}, age ${k.age}. They were wary of you for exactly as long as it took to trust you completely.`,'good'); } else { S.happiness=clamp(S.happiness-4); log(`The adoption fell through this year \u2014 a birth parent who changed their mind, an agency that went quiet. It is a particular kind of grief, mourning someone who was never quite yours.`,'bad'); } afterAction(0); }
function pick_n(arr,n){ const a=arr.slice(),out=[]; while(a.length&&out.length<n){ out.push(a.splice(rnd(0,a.length-1),1)[0]); } return out; }
function emigrate(){ if(G.age<18){toast('You can move abroad on your own at 18.');return;} const opts=Object.keys(COUNTRIES).filter(c=>c!==G.country); $('modalbox').innerHTML=`<h2>Emigrate</h2><p>Pack a life into a few boxes and start again somewhere new. Where to?</p><div class="opts" id="embox"></div>`; const box=$('embox'); pick_n(opts,6).forEach(c=>{ const b=document.createElement('button'); b.textContent=c; b.onclick=()=>{forceClose();doEmigrate(c);}; box.appendChild(b); }); openModal(); }
function doEmigrate(country){ const cities=Object.keys(COUNTRIES[country]||{}); const city=cities.length?pick(cities):G.place; G.country=country; G.place=city; S.stress=clamp(S.stress+8); S.happiness=clamp(S.happiness+3); K.intellect=clamp((K.intellect||0)+2); log(`You emigrated to ${city}, ${country}. New language on the signs, new coins in your pocket, the specific loneliness of being a stranger everywhere for a while. It gets better. It always gets better, and it always takes longer than you think.`,'good'); afterAction(0); }
function fertilityClinic(){ if(!partner()){toast('You need a partner first.');return;} const cost=Math.min(G.cash,rnd(12000,30000)); if(!pay(cost,true)){toast('You cannot afford the clinic right now.');return;} G.flags.fertility=true; log(`You and ${partner().name} started at a fertility clinic \u2014 hormone charts, waiting rooms, hope rationed out carefully. Your odds of conceiving just went up.`,'good'); afterAction(0); }

function horseRaces(){ if(!afford(50)){toast('You need at least $50 to bet.');return;} $('modalbox').innerHTML=`<h2>Horse races</h2><p>Six horses, a lot of confident men, and the smell of the track. Place your bet.</p><div class="row"><label>Bet</label><input type="number" id="hbet" value="100" min="1"></div><div class="acts"><button onclick="runHorses('favorite')">Favorite (2x)</button><button onclick="runHorses('longshot')">Longshot (8x)</button></div><div class="note" id="hout">Cash: ${money(G.cash)}</div><div style="margin-top:10px"><button onclick="forceClose();afterAction(0)">Leave the track</button></div>`; openModal(); }

function fightBet(){ if(!afford(50)){toast('You need at least $50 to bet.');return;} $('modalbox').innerHTML=`<h2>Fight betting</h2><p>Two fighters, one cage, and a crowd that came for blood. Pick a corner.</p><div class="row"><label>Bet</label><input type="number" id="fbet" value="100" min="1"></div><div class="acts"><button onclick="runFight('red')">Red corner</button><button onclick="runFight('blue')">Blue corner</button></div><div class="note" id="fout">Cash: ${money(G.cash)}</div><div style="margin-top:10px"><button onclick="forceClose();afterAction(0)">Leave</button></div>`; openModal(); }
function runFight(corner){ const bet=Math.max(1,Math.round(+($('fbet').value||0))); if(!afford(bet)){$('fout').textContent='You do not have that to lose.';return;} pay(bet); const win=chance(0.5)?bet*2:0; const msg=win?`Your fighter got the finish. +${money(win)}.`:'Your fighter hit the canvas in the second. Gone.'; if(win)G.cash+=win; else G.flags.gambled=(G.flags.gambled||0)+1; $('fout').textContent=msg+`  \u00b7  Cash: ${money(G.cash)}`; renderSheet(); }
function sweepstakes(){ const r=Math.random(); let win=0; if(r<0.0002)win=1000000; else if(r<0.004)win=25000; else if(r<0.03)win=1000; else if(r<0.12)win=50; if(win){G.cash+=win;log(`You entered a sweepstakes and \u2014 this never happens \u2014 actually won ${money(win)}. You reread the email four times looking for the catch.`,'money');} else log(`You entered the sweepstakes. Free to enter, which is the only honest thing about it. You did not win.`); afterAction(0); }

function openLawsuit(){ if(G.age<18){toast('You can bring a suit yourself at 18.');return;} $('modalbox').innerHTML=`<h2>Lawsuit</h2><p>Lawyers cost money and time. Win and you collect; lose and you eat the fees. Who are you suing?</p><div class="opts" id="lsbox"></div>`; const box=$('lsbox'); const co=document.createElement('button'); co.innerHTML='A company<small>deep pockets, better lawyers</small>'; co.onclick=()=>{forceClose();resolveLawsuit(null);}; box.appendChild(co); allNPCs().forEach(n=>{ const b=document.createElement('button'); b.innerHTML=`${esc(n.name)}<small>${capitalize(n.label)}</small>`; b.onclick=()=>{forceClose();resolveLawsuit(n.id);}; box.appendChild(b); }); openModal(); }
function resolveLawsuit(id){ const fee=Math.min(G.cash,rnd(3000,15000)); pay(fee,true); const n=id?npc(id):null; const odds=0.45+(S.smarts/300); if(chance(odds)){ const award=rnd(10000,250000); G.cash+=award; if(n){n.loyalty=clamp(n.loyalty-30);n.memory.push(`${G.name} sued me at ${G.age}.`);} log(`You won the suit. ${money(award)} awarded, ${money(fee)} to the lawyers, and ${n?`${n.name} will not be sending a holiday card this year`:'a company that will never notice the dent'}. Justice, or something wearing its suit.`,'money'); } else { if(n)n.loyalty=clamp(n.loyalty-15); log(`You lost the suit. ${money(fee)} gone to lawyers and nothing to show but a lesson about how the law actually works, which is slowly, and for whoever can afford more of it.`,'bad'); } afterAction(2); }

function celebDate(){ if(partner()){toast('You are already seeing someone.');return;} if(S.fame<40){toast('You need real fame for that app.');return;} const other=G.sex==='Male'?'Female':'Male'; const nm=(other==='Male'?pick(MALE):pick(FEMALE))+' '+pick(LAST); const p=addNPC('partner',nm,G.age+rnd(-6,6)); p.loyalty=rnd(35,60); S.fame=clamp(S.fame+2); log(`You matched with ${p.name} \u2014 another famous name \u2014 and the tabloids had it before your second date. Dating in public is its own strange sport, and the two of you are playing it in front of everyone.`,'good'); afterAction(0); }

/* ---------------- SCHOOL LIFE (elementary -> high school) ---------------- */

function schoolGPA(){ return clamp(Math.round((G.gpaSeed+S.smarts)/2)); }
const CLIQUES=[

 {id:'jocks',name:'The jocks',fx:{fitness:5},pop:8,athletics:5},

function schoolStudy(){ if(!spendAct('study'))return; if(!G.inSchool){toast('You are not in school right now.');return;} G.gpaSeed=clamp(G.gpaSeed+rnd(3,7)); S.smarts=clamp(S.smarts+rnd(1,2)); S.stress=clamp(S.stress+3); K.intellect=clamp((K.intellect||0)+1); log(`You put in real study time this year \u2014 ${pick(['flashcards taped to the bathroom mirror','a library carrel that became yours by habit','late nights and a highlighter graveyard'])}. Your grades climbed.`,'good'); afterAction(0); }
function schoolFriend(){ if(!spendAct('schoolfriend'))return; if(!G.inSchool){toast('You are not in school right now.');return;} if(chance(0.72)){ const nm=pick(MALE.concat(FEMALE))+' '+pick(LAST); const fr=addNPC('friend',nm,G.age+rnd(-1,1)); fr.loyalty=rnd(45,65); fr.classmate=true; if(G.school)G.school.popularity=clamp(G.school.popularity+rnd(2,5)); S.happiness=clamp(S.happiness+3); log(`You made a friend at school \u2014 ${nm.split(' ')[0]}. ${pick(['You got assigned the same project and stayed friends long after it was graded.','It started with a shared eye-roll at something a teacher said.','You sat together at lunch one day, and that was that.'])}`,'good'); } else { log(`You tried to click with someone at school and it just did not take. ${pick(['They already had their people.','The conversation died and you both let it.'])}`); } afterAction(0); }
function joinClique(){ if(!G.inSchool||G.age<11){toast('Cliques form in middle and high school.');return;} $('modalbox').innerHTML=`<h2>Find your people</h2><p>Every school sorts itself. Where do you fit?</p><div class="opts" id="clq"></div>`; const box=$('clq'); CLIQUES.forEach(c=>{ const b=document.createElement('button'); b.innerHTML=`${c.name}<small>${CLIQUE_NOTE[c.id]}</small>`; b.onclick=()=>{forceClose();setClique(c.id);}; box.appendChild(b); }); openModal(); }
function setClique(id){ const c=CLIQUES.find(x=>x.id===id); if(!c)return; if(!G.school)G.school={popularity:40,clique:null,team:null}; G.school.clique=id; applyFx(c.fx); if(c.charisma)K.charisma=clamp((K.charisma||0)+c.charisma); if(c.athletics)K.athletics=clamp((K.athletics||0)+c.athletics); if(c.intellect)K.intellect=clamp((K.intellect||0)+c.intellect); if(c.acting)K.acting=clamp((K.acting||0)+c.acting); G.school.popularity=clamp(G.school.popularity+c.pop); log(`You found your way into ${c.name.toLowerCase()}. ${pick(['For the first time, a lunch table felt like yours.','It gave the week a shape, and you a place to stand.','You changed a little to fit, the way everyone does at that age.'])}`,'good'); afterAction(0); }
function joinSportsTeam(){ if(!G.inSchool||G.age<6){toast('You can try out for a team once you are in school.');return;} $('modalbox').innerHTML=`<h2>Try out for a team</h2><p>Which sport do you want to go out for?</p><div class="opts" id="spt"></div>`; const box=$('spt'); SCHOOLSPORTS.forEach(sp=>{ const b=document.createElement('button'); b.textContent=sp; b.onclick=()=>{forceClose();setSportsTeam(sp);}; box.appendChild(b); }); openModal(); }
function setSportsTeam(sp){ if(!G.school)G.school={popularity:40,clique:null,team:null}; const made=chance(0.55+((K.athletics||0)+S.fitness)/300+(G.talent==='sports'?0.25:0)); if(!made){ S.happiness=clamp(S.happiness-3); log(`You tried out for ${sp.toLowerCase()} and got cut. The list went up on a Friday and your name was not on it. You told everyone you did not care that much.`,'bad'); afterAction(0); return; } G.school.team=sp; K.athletics=clamp((K.athletics||0)+5); S.fitness=clamp(S.fitness+5); G.school.popularity=clamp(G.school.popularity+7); if(chance(0.08)){ S.health=clamp(S.health-8); log(`You made the ${sp.toLowerCase()} team \u2014 and promptly rolled an ankle at the first real practice. Worth it, probably.`,'good'); } else { log(`You made the ${sp.toLowerCase()} team. ${pick(['Two-a-days in August, the good kind of exhausted.','You were not the star, but you belonged, and that was most of it.','Game nights under the lights became the best part of the week.'])}`,'good'); } afterAction(1); }
function schoolDance(){ if(!G.inSchool||G.age<11){toast('School dances start in middle school.');return;} if(!G.school)G.school={popularity:40,clique:null,team:null}; G.school.popularity=clamp(G.school.popularity+rnd(2,6)); S.happiness=clamp(S.happiness+rnd(4,8)); S.stress=clamp(S.stress-3); if(chance(0.4)){ const nm=pick(MALE.concat(FEMALE))+' '+pick(LAST); const fr=addNPC('friend',nm,G.age+rnd(-1,1)); fr.loyalty=rnd(45,60); fr.classmate=true; log(`You went to the school dance. ${pick(['Bad punch, good music, a gym transformed by a few hundred dollars of streamers.','You danced badly and laughed hard and stayed until the lights came up.','You spent half of it against the wall and the other half glad you came.'])} You left with a new friend, ${nm.split(' ')[0]}.`,'good'); } else { log(`You went to the school dance. ${pick(['Bad punch, good music, and a story you would tell for years.','You danced in a circle of friends and felt, briefly, completely fine.','The DJ played the one song everyone knew and the whole floor lost it.'])}`,'good'); } afterAction(0); }

/* ---------------- PER-PERSON INTERACTIONS ---------------- */
function openPerson(id){ if(!npc(id))return; personOpen=id; renderActions(); }
function personDetail(n){
  const blood=['parent','sibling','child'].includes(n.role);
  const adultBoth=G.age>=18 && n.age>=18;
  const romance=!blood && adultBoth && ['friend','coworker','fling'].includes(n.role);
  let h=`<div class="person" style="display:block"><div class="phead"><div><div class="t">${esc(n.name)}</div><div class="s">${capitalize(n.label)} \u2022 ${n.age}${n.married?' \u2022 married':''}</div></div><div class="rel"><span class="relw">${loyaltyWord(n.loyalty)}</span>${relbar(n.loyalty)}<span class="reln">${Math.round(n.loyalty)} / 100</span></div></div></div>`;
  h+=grp('Talk', actBtn('talk',n.id,'Conversation')+actBtn('compliment',n.id,'Compliment')+actBtn('insult',n.id,'Insult'));
  let together=actBtn('spendtime',n.id,'Spend time')+actBtn('concert',n.id,'Concert')+actBtn('prank',n.id,'Prank');
  if(G.age>=18)together+=actBtn('party',n.id,'Party');
  h+=grp('Do something together', together);
  h+=grp('Money', actBtn('gift',n.id,'Give a gift')+(G.age>=13?actBtn('deal',n.id,'Sell them something'):''));
  if(romance){ let r=''; if(n.role==='friend'||n.role==='coworker')r+=actBtn('askout',n.id,'Ask out'); r+=actBtn('hookup',n.id,'Hook up'); if(r)h+=grp('Romance', r); }
  let st='';
  if(n.role==='partner'&&n.engaged){ st=actBtn('wedding',n.id,'Plan the wedding')+actBtn('breakup',n.id,'Call it off'); }
  else if(n.role==='partner'){ st=actBtn('marry',n.id,'Propose')+actBtn('breakup',n.id,'Break up'); }
  else if(n.role==='spouse'){ st=actBtn('baby',n.id,'Try for a baby')+actBtn('breakup',n.id,'Divorce'); }
  else if(n.role==='friend'||n.role==='fling'){ st=actBtn('breakup',n.id,'Cut off'); }
  if(st)h+=grp('Status', st);
  return h;
}
function npcTalk(id){ if(!spendAct('talk'))return; const n=npc(id); if(!n)return; n.loyalty=clamp(n.loyalty+rnd(2,5)); S.happiness=clamp(S.happiness+1); log(`You had a real conversation with ${n.name}. ${pick(['Nothing urgent, just the maintenance that keeps people close.','They told you something they had not told anyone.','You disagreed about something small and enjoyed it.'])}`,'good'); afterAction(0); }
function npcInsult(id){ if(!spendAct())return; const n=npc(id); if(!n)return; n.loyalty=clamp(n.loyalty-rnd(5,12)); n.memory.push(`${G.name} insulted me at ${G.age}.`); if(chance(0.4)){ S.happiness=clamp(S.happiness-3); log(`You said something cruel to ${n.name} and they gave it right back, sharper. It stung more than you expected.`,'bad'); } else { S.stress=clamp(S.stress-2); log(`You said something cruel to ${n.name}. It felt good for exactly as long as it took to land, and worse after.`,'bad'); } afterAction(0); }
function npcPrank(id){ if(!spendAct('prank'))return; const n=npc(id); if(!n)return; if(chance(0.6)){ n.loyalty=clamp(n.loyalty+rnd(2,5)); S.happiness=clamp(S.happiness+2); log(`You pulled a prank on ${n.name} and, mercifully, they laughed. ${pick(['It became a story you both tell.','They swore cheerful revenge.'])}`,'good'); } else { n.loyalty=clamp(n.loyalty-rnd(4,10)); log(`You pulled a prank on ${n.name} and it did not land. ${pick(['They did not think it was funny. At all.','You crossed a line you did not see until you were over it.'])}`,'bad'); } afterAction(0); }
function npcConcert(id){ if(!spendAct())return; const n=npc(id); if(!n)return; if(!pay(200,true)){toast('You cannot cover the tickets.');return;} n.loyalty=clamp(n.loyalty+rnd(4,8)); S.happiness=clamp(S.happiness+5); S.stress=clamp(S.stress-3); log(`You took ${n.name} to a concert. ${pick(['You both lost your voices and did not care.','The opener was better than the headliner and that became the joke of the year.','You stood in a crowd of thousands and felt like it was just the two of you.'])}`,'good'); afterAction(0); }
function npcParty(id){ if(!spendAct())return; const n=npc(id); if(!n)return; if(G.age<18){toast('Not yet.');return;} if(!pay(300,true)){toast('You cannot cover the night.');return;} n.loyalty=clamp(n.loyalty+rnd(4,9)); S.happiness=clamp(S.happiness+6); S.stress=clamp(S.stress-4); G.addiction.alcohol=clamp(G.addiction.alcohol+4); log(`You went out with ${n.name} and made a night of it. ${pick(['The kind of night that costs you the next morning.','You closed the place down and split a cab and a bad idea for breakfast.','Loud, bright, a little reckless, and exactly what you needed.'])}`,'good'); afterAction(1); }
function npcDeal(id){ const n=npc(id); if(!n)return; if(G.items.length){ const i=rnd(0,G.items.length-1); const inst=G.items[i]; const d=ITEM[inst.id]; const val=Math.round((inst.value??d.price)*((inst.cond??100)/100)*0.9); G.cash+=val; G.items.splice(i,1); n.loyalty=clamp(n.loyalty-rnd(1,4)); log(`You sold your ${d.name.toLowerCase()} to ${n.name} for ${money(val)} \u2014 a better price than a stranger would give, though ${n.name.split(' ')[0]} drove a harder bargain than you expected from a friend.`,'money'); } else { const val=rnd(50,400); G.cash+=val; n.loyalty=clamp(n.loyalty-rnd(1,3)); log(`You talked ${n.name} into buying something off you and cleared ${money(val)}. Money is money; they will forgive you, probably.`,'money'); } afterAction(0); }
function giftNPC(id){ const n=npc(id); if(!n)return; $('modalbox').innerHTML=`<h2>A gift for ${esc(n.name)}</h2><p>Generosity is rarely wasted. How much?</p><div class="opts"><button onclick="confirmGift('${id}','small')">Something small<small>$50</small></button><button onclick="confirmGift('${id}','nice')">Something nice<small>$500</small></button><button onclick="confirmGift('${id}','lavish')">Something lavish<small>$5,000</small></button></div>`; openModal(); }
function confirmGift(id,tier){ const n=npc(id); if(!n)return; const T={small:[50,3,7],nice:[500,7,13],lavish:[5000,13,22]}[tier]; if(!T)return; if(!pay(T[0])){toast('You cannot afford that gift.');return;} forceClose(); n.loyalty=clamp(n.loyalty+rnd(T[1],T[2])); S.happiness=clamp(S.happiness+1); log(`You gave ${n.name} ${tier==='lavish'?'an extravagant gift':tier==='nice'?'a thoughtful gift':'a small gift'}. ${pick(['They lit up.','They protested that you should not have, and clearly loved it.','It was the thought that counted, but the thing did not hurt either.'])}`,'good'); afterAction(0); }
function npcAskOut(id){ const n=npc(id); if(!n)return; if(['parent','sibling','child'].includes(n.role)){toast('No.');return;} if(G.age<18||n.age<18){toast('Not appropriate.');return;} if(partner()){toast('You are already with someone.');return;} if(n.loyalty>=50 && chance(0.5+n.loyalty/200)){ n.role='partner'; n.label='partner'; n.loyalty=clamp(n.loyalty+6); S.happiness=clamp(S.happiness+6); log(`You asked ${n.name} out \u2014 actually asked, out loud, heart going. ${pick(['They said yes before you finished the sentence.','There was a pause that aged you a year, and then a yes.','They laughed, said finally, and that was that.'])}`,'good'); } else { n.loyalty=clamp(n.loyalty-4); S.happiness=clamp(S.happiness-4); log(`You asked ${n.name} out and it did not go the way the movies promised. ${pick(['They let you down gently, which somehow made it worse.','They value the friendship, they said, and meant it, which did not help.'])}`,'bad'); } afterAction(0); }
function npcHookup(id){ const n=npc(id); if(!n)return; if(['parent','sibling','child'].includes(n.role)){toast('No.');return;} if(G.age<18||n.age<18){toast('Not appropriate.');return;} S.happiness=clamp(S.happiness+4); n.loyalty=clamp(n.loyalty+rnd(2,6)); n.memory.push(`${G.name} and I got together at ${G.age}.`); const cheat=partner()&&partner().id!==n.id; log(`You and ${n.name} ${pick(['ended a long night at the same door','stopped pretending it was only friendly','let something that had been building finally happen'])}. ${cheat?'You have a partner. You did it anyway, and the knowing sat in your chest like a stone.':'In the morning it was either the start of something or a thing you would both step around forever.'}`); if(cheat)thread('cheated',{npc:partner().id,name:n.name}); afterAction(2); }

const ASSET=Object.fromEntries(ASSETS.map(a=>[a.id,a]));
function ensureMarket(){ if(!G.market)G.market={}; if(!G.invest)G.invest={}; if(!G.marketChg)G.marketChg={}; ASSETS.forEach(a=>{ if(G.market[a.id]==null)G.market[a.id]=a.price; }); }
function money2(v){ return v<100?'$'+(Math.round(v*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):money(Math.round(v)); }
function handleInvestments(){ if(!G.market)return; ensureMarket(); ASSETS.forEach(a=>{ const prev=G.market[a.id]; const shock=(Math.random()*2-1)*a.vol; let np=prev*(1+a.drift+shock); if((a.cls==='Penny'||a.cls==='Crypto')&&chance(0.04)) np*=rnd(20,60)/100; np=Math.max(a.floor||0.01, np); G.marketChg[a.id]=prev>0?((np-prev)/prev):0; G.market[a.id]=Math.round(np*10000)/10000; }); }
function tabInvest(){
  if(G.age<18) return '<div class="note">Brokerages want an adult signature. Come back at 18.</div>';
  ensureMarket();
  let h=''; let pv=0;
  const held=ASSETS.filter(a=>G.invest[a.id]&&G.invest[a.id].shares>0);
  if(held.length){

  }

  h+=`<div class="note">Prices move every year you age up. Bonds barely budge; crypto and penny stocks can moon or crater \u2014 and occasionally collapse to nothing.</div>`;

}
function buyAsset(id){ ensureMarket(); const a=ASSET[id]; if(!a)return; if(G.age<18){toast('You must be 18 to invest.');return;} const price=G.market[id]; $('modalbox').innerHTML=`<h2>Buy ${a.name}</h2><p>Price ${money2(price)} per share. You have ${money(G.cash)} in cash. How much do you want to put in?</p><div class="row"><label>Amount ($)</label><input type="number" id="invamt" value="${Math.min(1000,Math.max(0,Math.floor(G.cash)))}" min="1" max="${Math.max(0,Math.floor(G.cash))}"></div><div class="opts"><button onclick="confirmBuyAsset('${id}')">Buy shares</button></div>`; openModal(); }
function confirmBuyAsset(id){ if(G.age<18){toast("You must be 18 to invest.");return;} ensureMarket(); const a=ASSET[id]; const price=G.market[id]; const amt=Math.max(0,Math.round(+($('invamt').value||0))); const shares=Math.floor(amt/price); if(shares<=0){toast('Not enough for even one share.');return;} const cost=shares*price; if(!afford(cost)){toast('You cannot afford that.');return;} forceClose(); pay(cost); if(!G.invest[id])G.invest[id]={shares:0,basis:0}; G.invest[id].shares+=shares; G.invest[id].basis+=cost; log(`You put ${money(Math.round(cost))} into ${a.name} \u2014 ${shares.toLocaleString()} shares at ${money2(price)}. ${pick(['Now you refresh the number like everyone else.','The market does not know you exist, which is rather the point.','Money asleep, hopefully waking up bigger.'])}`,'money'); afterAction(0); }
function sellAsset(id){ ensureMarket(); const a=ASSET[id]; const hd=G.invest[id]; if(!hd||hd.shares<=0){toast('You do not hold any of that.');return;} const price=G.market[id]; const proceeds=Math.round(hd.shares*price); const gain=proceeds-hd.basis; const sold=hd.shares; G.cash+=proceeds; G.invest[id]={shares:0,basis:0}; log(`You sold ${sold.toLocaleString()} shares of ${a.name} for ${money(proceeds)} \u2014 ${gain>=0?`a gain of ${money(gain)}`:`a loss of ${money(-gain)}`}. ${gain>=0?'You told yourself you always knew.':'You told yourself it was a lesson, which is what losses are for.'}`,'money'); afterAction(0); }

const RINGS=[

];
function ringName(tier){ const r=RINGS.find(x=>x.id===tier); return r?r.name:'a ring'; }
function lastNameOf(n){ const parts=((n&&n.name)||'').trim().split(/\s+/); return parts.length>1?parts[parts.length-1]:((n&&n.name)||''); }
function proposeRingModal(id){
  const n=npc(id); if(!n)return;
  const rings=G.items.map((it,i)=>({i,d:ITEM[it.id]})).filter(x=>x.d&&x.d.tags&&x.d.tags.includes('ring'));
  if(!rings.length){ toast('You need a ring first \u2014 buy one under Assets or Luxury.'); return; }
  const rows=rings.map(x=>`<button onclick="doPropose('${id}',${x.i})">${esc(x.d.name)}<small>propose with this</small></button>`).join('');
  $('modalbox').innerHTML=`<h2>Propose to ${esc(n.name)}</h2><p>Which ring will you offer? A better ring makes a stronger case \u2014 but how they answer still comes down to how they feel about you.</p><div class="opts">${rows}</div>`;

function buyRingAndPropose(id,tier){ const r=RINGS.find(x=>x.id===tier); if(!r)return; if(!pay(r.price)){toast('You cannot afford that ring.');return;} G.flags.ring={tier}; forceClose(); doPropose(id,tier); }
function doPropose(id,idx){
  const n=npc(id); if(!n){forceClose();return;} idx=+idx; const inst=G.items[idx]; const d=inst&&ITEM[inst.id];
  if(!d||!d.tags||!d.tags.includes('ring')){toast('That is not a ring.');return;}
  forceClose();
  const bonus=d.ringBonus||0; const odds=Math.max(0.02,Math.min(0.98,(n.loyalty-35)/55 + bonus));
  if(chance(odds)){
    n.engaged=true; n.loyalty=clamp(n.loyalty+8); S.happiness=clamp(S.happiness+10); G.items.splice(idx,1);
    log(`You got down on one knee and offered ${n.name} the ${d.name.toLowerCase()}. ${pick(['They said yes before you finished the question.','There was a silence that took a year off your life, and then a yes, and then the two of you laughing like fools.','They cried, you cried, and a stranger at the next table applauded.'])} You are engaged.`,'good');
    thread('engaged',{npc:n.id});
  } else {
    n.loyalty=clamp(n.loyalty-6); S.happiness=clamp(S.happiness-8);
    log(`You proposed to ${n.name}, and they said no \u2014 kindly, or not, but no. ${pick(['They were not ready, they said, in the tone that means not with you.','It was too soon, or too late; you would spend a while deciding which.','The ring stayed in your pocket, and so, for now, did the question.'])} You kept the ring.`,'bad');

const VENUES=[

function openWedding(id){ const n=npc(id); if(!n)return; if(n.role!=='partner'||!n.engaged){toast('You need to be engaged first.');return;} weddingDraft={id,venue:null,honeymoon:null}; pickVenue(); }
function pickVenue(){ const rows=VENUES.map(v=>`<button onclick="setVenue('${v.id}')">${esc(v.name)}<small>${money(v.price)}</small></button>`).join(''); $('modalbox').innerHTML=`<h2>The wedding</h2><p>First: where will you hold it? Every guest, every flower, every folding chair is money you will not see again \u2014 and a day you might not forget.</p><div class="opts">${rows}</div>`; openModal(); }
function setVenue(vid){ if(!weddingDraft)return; weddingDraft.venue=vid; pickHoneymoon(); }
function pickHoneymoon(){ const rows=HONEYMOONS.map(h=>`<button onclick="setHoneymoon('${h.id}')">${esc(h.name)}<small>${h.price>0?money(h.price):'free'}</small></button>`).join(''); $('modalbox').innerHTML=`<h2>The honeymoon</h2><p>And afterward? A week or two that belongs only to the two of you, before the ordinary days take back the reins.</p><div class="opts">${rows}</div>`; openModal(); }

function pickName(){ const n=npc(weddingDraft.id); if(!n){weddingDraft=null;forceClose();return;} const theirs=lastNameOf(n); $('modalbox').innerHTML=`<h2>The name</h2><p>One last decision, quieter than the rest and longer-lasting. What will your name be?</p><div class="opts"><button onclick="setWedName('keep')">Keep my name<small>${esc(G.last||'')}</small></button><button onclick="setWedName('take')">Take theirs<small>${esc(theirs)}</small></button><button onclick="setWedName('hyphen')">Hyphenate<small>${esc((G.last||'')+'-'+theirs)}</small></button></div>`; openModal(); }
function setWedName(choice){
  if(!weddingDraft)return; const n=npc(weddingDraft.id); if(!n){weddingDraft=null;forceClose();return;}
  const v=VENUES.find(x=>x.id===weddingDraft.venue)||VENUES[0];

  const theirs=lastNameOf(n); const theirFirst=(n.name||'').trim().split(/\s+/)[0];

  weddingDraft=null; afterAction(0);
}

function postMenu(id){ const x=SOCIALS.find(y=>y.id===id); if(!G.social||!G.social[id]){toast('You need an account first.');return;} $('modalbox').innerHTML=`<h2>Post to ${esc(x.name)}</h2><p>What kind of post?</p><div class="opts"><button onclick="doPost('${id}','everyday')">An everyday post<small>steady, low-risk</small></button><button onclick="doPost('${id}','glam')">A glam shot<small>rides on your looks</small></button><button onclick="doPost('${id}','hottake')">A hot take<small>could go viral \u2014 or blow up</small></button><button onclick="doPost('${id}','sponsored')">A sponsored post<small>earns money, costs a little reach</small></button><button onclick="doPost('${id}','collab')">A collab<small>needs some fame; big upside</small></button></div>`; openModal(); }
function doPost(id,type){ const x=SOCIALS.find(y=>y.id===id); const a=G.social&&G.social[id]; if(!a){forceClose();return;} forceClose(); const base=a.followers||0;
  if(type==='sponsored'&&base<5000){toast('Brands want at least 5,000 '+x.unit+'.');return;}
  if(type==='collab'&&(S.fame||0)<15){toast('You need more fame before anyone will collab.');return;}
  if(!spendAct('post:'+id))return;
  const reach=1+(K.charisma||0)/40+(S.fame||0)/25; let gain=0,msg='',kind=null;
  if(type==='everyday'){ gain=Math.round(base*0.03*reach)+rnd(5,80); msg=`You posted on ${x.name}. ${gain>0?gain.toLocaleString()+' new '+x.unit+'.':'It barely registered.'}`; }
  else if(type==='glam'){ const lf=(S.looks||0)/50; gain=Math.round(base*0.05*reach*lf)+rnd(0,120); if(gain<20&&chance(0.5)){ gain=0; msg=`Your glam shot on ${x.name} flopped \u2014 the lighting, the internet's mood, who knows. Nothing.`; } else { msg=`Your glam shot did numbers on ${x.name} \u2014 ${gain.toLocaleString()} new ${x.unit}.`; kind='good'; } }
  else if(type==='hottake'){ if(chance(0.4)){ gain=Math.round(base*0.4*reach)+rnd(200,2000); S.fame=clamp(S.fame+rnd(2,6)); msg=`Your hot take on ${x.name} went off \u2014 ${gain.toLocaleString()} new ${x.unit} and a real bump in fame. You are, briefly, The Discourse.`; kind='good'; } else { gain=-Math.round(base*0.08); S.fame=clamp(S.fame-2); S.stress=clamp(S.stress+4); msg=`Your hot take on ${x.name} landed wrong. A quote-tweet dogpile, ${Math.abs(gain).toLocaleString()} ${x.unit} gone, and a day you would like back.`; kind='bad'; } }
  else if(type==='sponsored'){ const earn=Math.round(base*rnd(2,6)/100); G.cash+=earn; gain=-Math.round(base*0.01); msg=`You ran a sponsored post on ${x.name}. ${money(earn)} in, a few unfollows out \u2014 the cost of selling to your own audience.`; kind='money'; }
  else if(type==='collab'){ gain=Math.round(base*0.15*reach)+rnd(100,800); S.fame=clamp(S.fame+2); msg=`You collabed with someone bigger than you on ${x.name}. Their audience spilled over \u2014 ${gain.toLocaleString()} new ${x.unit}.`; kind='good'; }
  a.followers=Math.max(0,base+gain); K.charisma=clamp((K.charisma||0)+1); log(msg,kind); afterAction(0);
}
function promoteSocial(id){ const x=SOCIALS.find(y=>y.id===id); const a=G.social&&G.social[id]; if(!a)return; const cost=Math.max(500,Math.round((a.followers||0)*0.5)+500); if(!pay(cost,true)){toast(`A promo push runs about ${money(cost)}.`);return;} const gain=Math.round(((a.followers||0)*0.2)+rnd(200,1500)); a.followers=(a.followers||0)+gain; log(`You paid ${money(cost)} to promote your ${x.name} \u2014 ads, a boosted post, the machinery of attention. ${gain.toLocaleString()} new ${x.unit}, real ones this time.`,'money'); afterAction(0); }
function buySubsMenu(id){ const x=SOCIALS.find(y=>y.id===id); if(!G.social||!G.social[id])return; $('modalbox').innerHTML=`<h2>Buy ${esc(x.unit)}</h2><p>You can buy a following. It looks real from a distance, does nothing for your fame, and the platform purges the fakes now and then.</p><div class="opts"><button onclick="buySubs('${id}',10000,500)">10,000<small>${money(500)}</small></button><button onclick="buySubs('${id}',100000,4000)">100,000<small>${money(4000)}</small></button><button onclick="buySubs('${id}',1000000,30000)">1,000,000<small>${money(30000)}</small></button></div>`; openModal(); }
function buySubs(id,amt,cost){ const x=SOCIALS.find(y=>y.id===id); const a=G.social&&G.social[id]; if(!a){forceClose();return;} amt=+amt; cost=+cost; if(!pay(cost,true)){toast('You cannot afford that package.');return;} forceClose(); a.followers=(a.followers||0)+amt; a.fake=(a.fake||0)+amt; log(`You bought ${amt.toLocaleString()} ${x.unit} for ${money(cost)}. The number jumped; the engagement did not. Everyone can tell, a little.`); afterAction(0); }
function verifySocial(id){ const x=SOCIALS.find(y=>y.id===id); const a=G.social&&G.social[id]; if(!a)return; if(a.verified){toast('Already verified.');return;} if((a.followers||0)<VERIFY_THRESHOLD){toast(`You need ${VERIFY_THRESHOLD.toLocaleString()} ${x.unit} to verify.`);return;} a.verified=true; S.fame=clamp(S.fame+3); log(`Your ${x.name} got the little check. It is a small blue lie that people believe, and it changes how strangers treat you overnight.`,'good'); afterAction(0); }
function deleteSocial(id){ const x=SOCIALS.find(y=>y.id===id); if(!G.social||!G.social[id])return; delete G.social[id]; socialOpen=null; log(`You deleted your ${x.name}. The silence afterward was enormous and, after a while, a relief.`); afterAction(0); }

/* =====================================================================
   PART 6 — GOD MODE, CHARACTER CREATION, OBITUARY, BOOT
   ===================================================================== */
function openGod(){
  if(!G){toast('Start a life first.');return;}
  const num=(id,val)=>`<input type="number" id="${id}" value="${Math.round(val)}">`;
  const statInputs=['health','happiness','smarts','looks','fitness','fame','stress'].map(k=>`<div class="row"><label>${k}</label>${num('god_'+k,S[k])}</div>`).join('');
  const skillInputs=Object.keys(SKILLS).map(k=>`<div class="row"><label>${SKILLS[k]}</label>${num('god_skill_'+k,K[k])}</div>`).join('');
  const eduSel=`<select id="god_edu">${EDU.map((e,i)=>`<option value="${i}" ${i===G.edu?'selected':''}>${e}</option>`).join('')}</select>`;
  const itemSel=`<select id="god_item">${ITEMS.map(i=>`<option value="${i.id}">${i.name}</option>`).join('')}</select>`;
  const propSel=`<select id="god_prop">${PROPERTIES.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
  const evSel=`<select id="god_ev">${EVENTS.map(e=>`<option value="${e.id}">${e.id}</option>`).join('')}</select>`;
  const npcRoleSel=`<select id="god_npcrole"><option value="friend">friend</option><option value="partner">partner</option><option value="spouse">spouse</option><option value="child">child</option><option value="sibling">sibling</option><option value="parent">parent</option><option value="coworker">coworker</option></select>`;
  const npcList=allNPCs().map(n=>`<div class="row"><label>${esc(n.name)} <span class="s">(${n.label})</span></label><input type="range" min="0" max="100" value="${n.loyalty}" oninput="npc('${n.id}').loyalty=+this.value"></div>`).join('')||'<div class="note">No one in your life yet.</div>';
  $('modalbox').innerHTML=`<div class="god"><h2>God mode</h2>
    <div class="note">This is your workshop. Bend anything. Nothing here judges you — it's your story.</div>
    <div class="acts">
      <button onclick="godMoney(10000)">+$10k</button>
      <button onclick="godMoney(1000000)">+$1M</button>
      <button onclick="G.debt=0;renderAll();toast('Debt cleared.')">Clear debt</button>
      <button onclick="godHeal()">Heal fully</button>
      <button onclick="G.record=[];G.notoriety=0;renderAll();toast('Record wiped.')">Wipe record</button>
      <button onclick="godImmortal()">${(G.flags&&G.flags.immortal)?'Mortality on':'Immortality'}</button>
      <button onclick="if(G.jailUntil>G.age){G.jailUntil=0;renderAll();toast('Freed.')}">Release from jail</button>
      <button onclick="godSkip(5)">Skip 5 years</button>
    </div>
    <h4>Money & standing</h4>
    <div class="row"><label>Cash</label>${num('god_cash',G.cash)}<label>Debt</label>${num('god_debt',G.debt)}<label>Credit</label>${num('god_credit',G.creditScore)}</div>
    <div class="row"><label>Age</label>${num('god_age',G.age)}<label>Education</label>${eduSel}</div>
    <h4>Stats</h4>${statInputs}
    <h4>Skills</h4>${skillInputs}
    <h4>Give yourself things</h4>
    <div class="row"><label>Item</label>${itemSel}<button onclick="godAddItem()">Add item</button></div>
    <div class="row"><label>Property</label>${propSel}<button onclick="godAddProp()">Add property</button></div>
    <h4>People</h4>
    <div class="row"><label>Add person</label>${npcRoleSel}<input type="text" id="god_npcname" placeholder="name"><button onclick="godAddNPC()">Add</button></div>
    <div class="list">${npcList}</div>
    <h4>Force an event</h4>
    <div class="row"><label>Event</label>${evSel}<button onclick="godTriggerEvent()">Run it</button></div>
    <div class="opts" style="margin-top:14px"><button class="primary" onclick="godApply()">Apply changes</button><button onclick="forceClose()">Done</button></div>
  </div>`;
  openModal();
}
function gv(id){ const el=$(id); return el?+el.value:null; }
function godApply(){
  ['health','happiness','smarts','looks','fitness','fame','stress'].forEach(k=>{const v=gv('god_'+k);if(v!=null)S[k]=clamp(v);});
  Object.keys(SKILLS).forEach(k=>{const v=gv('god_skill_'+k);if(v!=null)K[k]=clamp(v);});
  const cash=gv('god_cash'); if(cash!=null)G.cash=Math.round(cash);
  const debt=gv('god_debt'); if(debt!=null)G.debt=Math.max(0,Math.round(debt));
  const cr=gv('god_credit'); if(cr!=null)G.creditScore=clamp(cr,300,850);
  const age=gv('god_age'); if(age!=null&&age>=0)G.age=Math.round(age);
  const edu=gv('god_edu'); if(edu!=null)G.edu=edu;
  renderAll(); saveGame(true); toast('Reality updated.');
}
function godMoney(n){ G.cash+=n; renderAll(); saveGame(true); toast(`+${money(n)}`); }
function godHeal(){ S.health=100; S.stress=clamp(S.stress-40); G.addiction.alcohol=0; G.addiction.drugs=0; renderAll(); toast('Healed.'); }
function godImmortal(){ G.flags.immortal=!G.flags.immortal; toast(G.flags.immortal?'You cannot die now.':'Mortality restored.'); openGod(); }
function godAddItem(){ const id=$('god_item').value; if(!ITEM[id])return; G.items.push({id,cond:100,value:ITEM[id].price,maintain:true}); renderAll(); toast(`${ITEM[id].name} added.`); }
function godAddProp(){ const id=$('god_prop').value; if(!PROP[id])return; G.props.push({id,cond:100,maintain:true,owned:true}); G.home='own'; renderAll(); toast(`${PROP[id].name} added.`); }
function godAddNPC(){ const role=$('god_npcrole').value; const name=($('god_npcname').value||pick(MALE.concat(FEMALE)))+(role==='child'||role==='sibling'?' '+G.last:''); const n=mkNPC(role,role,name,rnd(0,40)); n.met=G.age; G.npcs.push(n); openGod(); toast(`${name} added.`); }
function godTriggerEvent(){ const id=$('god_ev').value; const e=EVENTS.find(x=>x.id===id); if(!e)return; if(e.cond&&!safeCond(e.cond)){toast("That event doesn't fit this life right now.");return;} if(!G.history.length)startYearLog(); try{e.run();}catch(err){console.error(err);toast('That event misfired.');} forceClose(); renderAll(); if(!pendingChoice)saveGame(true); }
function godSkip(n){ forceClose(); for(let i=0;i<n;i++){ if(!G.alive||pendingChoice)break; ageUp(); } }

/* ---------------- character creation ---------------- */
let createMode='basic';
function countryOptions(){ return ['(random)'].concat(Object.keys(COUNTRIES)).map(x=>`<option>${x}</option>`).join(''); }
function openCreate(){
  pendingChoice=null;
  $('modalbox').innerHTML=`<div class="create"><h2>A new life</h2>
    <div class="tabs" id="ctabs">
      <button type="button" class="on" onclick="switchCreateTab('basic')">Basics</button>
      <button type="button" onclick="switchCreateTab('god')">God mode</button>
    </div>
    <div id="cbasic" class="cpane">
      <p class="note">Just the essentials. Everything else is left to a fair roll of the dice.</p>
      <div class="row"><label>First name</label><input type="text" id="b_first" placeholder="(random)"></div>
      <div class="row"><label>Last name</label><input type="text" id="b_last" placeholder="(random)"></div>
      <div class="row"><label>Gender</label><select id="b_sex"><option>Male</option><option>Female</option></select></div>
      <div class="row"><label>Country</label><select id="b_country" onchange="fillCities('b')">${countryOptions()}</select></div>
      <div class="row"><label>City</label><select id="b_city"><option>(random)</option></select></div>
    </div>
    <div id="cgod" class="cpane" style="display:none">
      <p class="note">Author the whole beginning. Leave any stat blank to roll it.</p>
      <div class="row"><label>First name</label><input type="text" id="g_first" placeholder="(random)"></div>
      <div class="row"><label>Last name</label><input type="text" id="g_last" placeholder="(random)"></div>
      <div class="row"><label>Gender</label><select id="g_sex"><option>Male</option><option>Female</option></select></div>
      <div class="row"><label>Country</label><select id="g_country" onchange="fillCities('g')">${countryOptions()}</select></div>
      <div class="row"><label>City</label><select id="g_city"><option>(random)</option></select></div>
      <div class="row"><label>Special talent</label><select id="g_talent" onchange="document.getElementById('g_talentblurb').textContent=TALENTS[this.value].blurb">${Object.keys(TALENTS).map(t=>`<option value="${t}">${TALENTS[t].name}</option>`).join('')}</select></div>
      <div class="note" id="g_talentblurb">${TALENTS.none.blurb}</div>
      <h4>Starting stats</h4>
      <div class="row"><label>Health</label><input type="number" id="g_health" placeholder="70–100"><label>Happiness</label><input type="number" id="g_happiness" placeholder="70–100"></div>
      <div class="row"><label>Smarts</label><input type="number" id="g_smarts" placeholder="20–80"><label>Looks</label><input type="number" id="g_looks" placeholder="20–90"></div>
      <div class="row"><label>Fitness</label><input type="number" id="g_fitness" placeholder="20"><label>Stress</label><input type="number" id="g_stress" placeholder="10"></div>
    </div>
    <div class="opts" style="margin-top:14px"><button class="primary" type="button" onclick="beginLife()">Be born ›</button></div>
  </div>`;
  createMode='basic';
  openModal();
}
function switchCreateTab(which){
  createMode=which;
  $('cbasic').style.display=which==='basic'?'':'none';
  $('cgod').style.display=which==='god'?'':'none';
  const btns=$('ctabs').querySelectorAll('button');
  btns[0].classList.toggle('on',which==='basic');
  btns[1].classList.toggle('on',which==='god');
}
function fillCities(prefix){
  const country=$(prefix+'_country').value, sel=$(prefix+'_city');
  if(country==='(random)'||!COUNTRIES[country]){ sel.innerHTML='<option>(random)</option>'; return; }
  sel.innerHTML=['(random)'].concat(Object.keys(COUNTRIES[country])).map(c=>`<option>${c}</option>`).join('');
}
function beginLife(){
  const p=(createMode==='god')?'g':'b';
  const rd=id=>{const el=$(p+'_'+id);return el?el.value:'';};
  let country=rd('country'); if(country==='(random)'||!country)country=null;
  let city=rd('city'); if(city==='(random)'||!city)city=null;
  if(country&&!city){ const cs=Object.keys(COUNTRIES[country]||{}); if(cs.length)city=pick(cs); }
  if(!country&&city){ country=countryOf(city); }
  const cfg={
    name:(rd('first')||'').trim()||null,
    last:(rd('last')||'').trim()||null,
    sex:rd('sex')||'Male',
    place:city, country:country,
  };
  if(createMode==='god'){
    ['health','happiness','smarts','looks','fitness','stress'].forEach(k=>{const v=rd(k);if(v!=='')cfg[k]=clamp(+v);});
    const t=rd('talent'); if(t&&t!=='none')cfg.talent=t;
  }
  forceClose();
  G=blankLife(cfg); S=G.stats; K=G.skills; pendingChoice=null; menuOpen=null;
  G.history=[]; startYearLog();
  const mom=livingParents().find(p=>p.label==='mother'), dad=livingParents().find(p=>p.label==='father');
  const where=`${G.place}${(G.country&&G.country!=='United States')?', '+G.country:''}`;
  log(`You were born ${G.sex==='Male'?'a boy':'a girl'} in ${where}, to ${mom?mom.name:'a mother'} and ${dad?dad.name:'a father'}. The room was cold and bright and full of strangers, and you announced yourself the only way you knew how. Somewhere a form was filled out with your name on it: ${G.name}. The first of many.`,'good');
  if(G.talent&&TALENTS[G.talent]){ log(`Even as a baby, something was obvious to everyone who held you: ${TALENTS[G.talent].blurb.toLowerCase()}`); }
  const sib=G.npcs.find(n=>n.role==='sibling');
  if(sib)log(`You had ${sib.age>0?'an older':'a'} ${sib.label}, ${sib.name}, ${sib.age>0?'already waiting':'who would come along soon'} — the first person who would know you your whole life.`);
  finishYear();
  toast('A life begins.');
}
function confirmNewLife(){
  if(!G){ openCreate(); return; }
  $('modalbox').innerHTML=`<h2>End this life?</h2><p>Starting a new life closes the book on ${esc(G.name)}. If you might come back to them, Export first. This can't be undone.</p><div class="opts"><button class="danger" onclick="forceClose();openCreate()">Start a new life</button><button onclick="forceClose()">Keep living this one</button></div>`;
  openModal();
}

/* ---------------- obituary ---------------- */
function openObituary(){
  if(!G)return;
  const net=netWorth();
  const yrs=`${G.born}–${G.year}`;
  const notable=[];
  if(S.fame>50)notable.push('a name people knew');
  if(net>1000000)notable.push(`${money(net)} to your name`);
  if(kids().length)notable.push(`${kids().length} child${kids().length>1?'ren':''}`);
  if(G.record.length)notable.push(`${G.record.length} mark${G.record.length>1?'s':''} on your record`);
  if(G.special)notable.push(`a life as ${SPECIAL[G.special.type].name.toLowerCase()}`);
  $('modalbox').innerHTML=`<h2>${esc(G.name)}</h2>
    <div class="note">${yrs} · died at ${G.age} · ${esc(capitalize(G.cause||'the end'))}</div>
    <p>${eulogyLong()}</p>
    ${notable.length?`<p class="sys">You left behind ${notable.join(', ')}.</p>`:''}
    <div class="opts"><button class="primary" onclick="forceClose();openCreate()">Live again</button><button onclick="forceClose()">Sit with it</button></div>`;
  openModal();
}
function eulogyLong(){
  const bits=[];
  bits.push(`You lived ${G.age} years. That is ${G.age<40?'not many':G.age<70?'a full stretch':'a long time'}, measured in winters.`);
  if(partner())bits.push(`${partner().name} was there at the end.`);
  else if(family().length)bits.push(`Family gathered, in the complicated way families do.`);
  else bits.push(`The room, at the end, was quiet.`);
  if(S.happiness>65)bits.push(`On balance, you were happy, which is rarer than any fortune.`);
  else if(S.happiness<35)bits.push(`It was a harder life than it needed to be. You knew that. It's part of why it's over now the way it is.`);
  return bits.join(' ');
}

function sanitizeSave(){ if(!G)return; G.items=(G.items||[]).filter(it=>ITEM[it.id]); G.props=(G.props||[]).filter(p=>PROP[p.id]); if(G.job&&!JOB[G.job.id])G.job=null; if(G.special&&!SPECIAL[G.special.type])G.special=null; if(!G.flags)G.flags={}; if(!G.addiction)G.addiction={alcohol:0,drugs:0}; if(!G.social)G.social={}; if(!G.pets)G.pets=[]; if(!G.school)G.school={popularity:40,clique:null,team:null}; if(!G.invest)G.invest={}; if(!G.market)G.market={}; if(!G.marketChg)G.marketChg={}; if(!G.acts||typeof G.acts!=='object')G.acts={}; }
function homeLabel(){ const p=G.props[G.props.length-1]; return (p&&PROP[p.id])?PROP[p.id].name:(G.home==='rent'?'Renting':'With parents'); }

/* ---------------- boot ---------------- */
function boot(){
  if(loadGame()&&G){ menuOpen=null; renderAll(); if(!G.alive){ /* leave the book closed */ } }
  else { openCreate(); }
}
window.addEventListener('load',boot);
</script>
