<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18202B; --panel:#212B38; --panel2:#1B2430; --line:#2E3A49; --ink:#ECE7DB; --muted:#9AA3AE;
  --gold:#D4A64A; --green:#7CB68A; --red:#D66B62; --blue:#6FA8DC; --violet:#A98BD6;
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Karla','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:var(--sans);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 11px;border-radius:6px}
button:hover{border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button.danger{border-color:var(--red);color:var(--red)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input[type=number]{width:110px}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
header h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:.04em}
header h1 small{font-family:var(--sans);font-size:10px;color:var(--muted);letter-spacing:.08em;vertical-align:top;margin-left:5px}
header .who{font-family:var(--serif);font-size:17px;color:var(--muted)}
header .spacer{flex:1}
header .tools{display:flex;gap:6px;flex-wrap:wrap}
main{display:grid;grid-template-columns:290px 1fr 360px;gap:0;min-height:calc(100vh - 56px)}
#sheet{border-right:1px solid var(--line);padding:16px;background:var(--panel);position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
#logwrap{padding:24px 40px;max-width:820px;width:100%;justify-self:center}
#actions{border-left:1px solid var(--line);background:var(--panel);position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;display:flex;flex-direction:column}
.name{font-family:var(--serif);font-size:24px;font-weight:500;margin:0 0 2px}
.occupation{color:var(--blue);font-family:var(--serif);font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.bar{margin:6px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar .trk{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fil{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.bar.health .fil{background:var(--red)} .bar.happy .fil{background:var(--gold)} .bar.looks .fil{background:var(--violet)} .bar.smarts .fil{background:var(--blue)} .bar.stress .fil{background:#c98a4a}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{text-align:right;max-width:60%}
.money{font-family:var(--serif);font-size:22px;color:var(--gold);margin:12px 0 2px}
h3.sec{font-family:var(--serif);font-weight:500;font-size:16px;margin:16px 0 6px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
.skills{columns:2;column-gap:12px;font-size:12.5px}
.skills div{display:flex;justify-content:space-between;color:var(--muted);break-inside:avoid}
.skills b{color:var(--ink);font-weight:500}
#ageup{width:100%;padding:12px;font-size:16px;margin-top:16px;font-family:var(--serif)}
/* log */
.yr{margin:0 0 26px}
.yr h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px;color:var(--gold);display:flex;align-items:baseline;gap:10px}
.yr h2 small{font-size:14px;color:var(--muted);font-family:var(--sans)}
.yr p{font-family:var(--serif);font-size:17.5px;line-height:1.62;margin:0 0 12px;max-width:70ch}
.yr p.good{color:#cfe6d0} .yr p.bad{color:#f0c4bf} .yr p.money{color:#eedcb0} .yr p.sys{color:var(--muted);font-family:var(--sans);font-size:13px}
.yr:first-child p:first-of-type::first-letter{font-size:2.4em;float:left;line-height:.85;margin:4px 8px 0 0;color:var(--gold)}
#empty{color:var(--muted);font-family:var(--serif);font-size:18px}
/* actions */
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{border:0;border-radius:0;background:transparent;padding:9px 11px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
#tabbody{padding:12px;overflow:auto;flex:1}
.grp{margin-bottom:14px}
.grp h4{font-family:var(--serif);font-weight:500;font-size:15px;margin:0 0 6px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{font-size:13px;padding:6px 9px}
.acts button small{color:var(--muted);margin-left:4px}
.note{color:var(--muted);font-size:13px;margin:4px 0 10px}
.tabs .back{border:0;background:transparent;color:var(--gold);font-size:14px;padding:8px 12px;cursor:pointer;font-family:var(--sans)}
.tabs .mtitle{font-family:var(--serif);color:var(--muted);padding:9px 6px;font-size:14px}
.menu{display:flex;flex-direction:column}
.menu .mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 6px;color:var(--ink);cursor:pointer}
.menu .mrow:hover{background:var(--panel2)}
.menu .mi{font-size:22px;width:30px;text-align:center;flex:none}
.menu .mc{display:flex;flex-direction:column;flex:1}
.menu .mt{font-family:var(--serif);font-size:16px;color:var(--blue)}
.menu .ms{color:var(--muted);font-size:12.5px}
.menu .mchev{color:var(--muted);font-size:18px}
.person{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.person .phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.person .rel{text-align:right;min-width:118px}
.person .relw{font-size:12px;color:var(--muted);text-transform:capitalize}
.person .reln{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.relbar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:3px 0}
.relbar>div{height:100%;background:var(--green);transition:width .3s}
.relbar.ok>div{background:var(--gold)}
.relbar.bad>div{background:var(--red)}
.person .acts{margin-top:6px}
button.person{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;box-sizing:border-box}
button.person:hover{background:var(--panel2);cursor:pointer}
button.person .phead{flex:1;margin:0}
.pchev{align-self:center}
.box{position:relative}
.modalx{position:absolute;top:6px;right:8px;background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:6px;z-index:3}
.modalx:hover{color:var(--ink)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,14,20,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.box h2{font-family:var(--serif);font-weight:500;margin:0 0 10px;font-size:22px}
.box p{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;padding:10px 12px}
.opts button small{display:block;color:var(--muted);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{min-width:110px;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.item .t{font-weight:500}.item .s{color:var(--muted);font-size:12.5px}
.item button{white-space:nowrap}
.god .row input,.god .row select{width:auto;min-width:120px}
.god h4{margin:14px 0 4px;font-family:var(--serif);font-weight:500}
.create .tabs{margin:4px 0 12px;border-radius:8px;overflow:hidden}
.create h4{margin:14px 0 4px;font-family:var(--serif);font-weight:500}
.cpane{animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:1000px){
  main{grid-template-columns:1fr}
  #sheet,#actions{position:static;height:auto;border:0;border-bottom:1px solid var(--line)}
  #logwrap{padding:18px}
  .yr p{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){.bar .fil{transition:none}}
</style>
</head>
<body>
<header>
  <h1>SMIS <small>v2.4</small></h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <div class="tools">
    <button onclick="saveGame(true)">Save</button>
    <button onclick="exportSave()">Export</button>
    <button onclick="document.getElementById('imp').click()">Import</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importSave(this)">
    <button id="undoyear" onclick="undoYear()" disabled>Undo year</button>
    <button onclick="openGod()">God mode</button>
    <button class="danger" onclick="confirmNewLife()">New life</button>
  </div>
</header>
<main>
  <aside id="sheet"></aside>
  <section id="logwrap"><div id="log"><div id="empty">No life yet. Start one.</div></div></section>
  <aside id="actions">
    <div class="tabs" id="tabs"></div>
    <div id="tabbody"></div>
  </aside>
</main>
<div id="modal"><div class="box" id="modalbox"></div></div>

// ---------- DATA: random yearly events ----------
// min/max = age range. w = weight. cond = extra condition. run(ctx) writes prose and may call ask() for a choice.
// Helper shortcuts inside run: S = stats, K = skills, log(text,kind), ask(title,text,[{label,sub,fn}]), thread(tag,data)
const EVENTS=[
 {id:'ev_firstword',min:1,max:2,w:3,run:()=>log(`Your first real word came out at the kitchen table, and both your parents pretended it was their name. It was neither. The argument about it lasted, on and off, for a decade.`)},
 {id:'ev_bully',min:7,max:13,w:4,run:()=>{const b=pick(MALE);ask('The kid by the fence',`There is a boy named ${b} who has decided, for reasons you will never learn, that you are the one. He takes your lunch money twice a week and has started telling people things about you that are not true. Today he shoved you into the fence hard enough to draw blood, and nobody stopped him.`,[
  {label:'Fight back',sub:'He is bigger than you.',fn:()=>{ if(chance(0.4+K.combat/200)){log(`You swung first and connected. ${b} went down harder than either of you expected, and when he got up he was crying, and the yard was silent. He never touched you again. Something in you learned that the world respects the person who hits back.`,'good');K.combat+=4;S.happiness+=4;thread('beatbully',{name:b});} else {log(`You swung and missed, and what he did next put you in the nurse's office for the afternoon. You learned that losing in front of people is a specific kind of pain.`,'bad');S.health-=6;S.happiness-=5;K.combat+=2;}}},
  {label:'Tell a teacher',fn:()=>{log(`You told Mrs. Adler. ${b} got two days of suspension and came back meaner but more careful. The other kids called you a snitch for a while, and then forgot, the way kids do. You did not forget.`);S.happiness-=2;S.stress+=4;thread('bullied',{name:b});}},
  {label:'Take it',sub:'Keep your head down.',fn:()=>{log(`You took it. You got very good at being invisible, at knowing which hallway ${b} used and being in the other one. You learned to read a room before you entered it, and that skill would pay off in ways you couldn't imagine yet. But you carried him with you.`);K.stealth+=5;S.happiness-=6;S.stress+=6;thread('bullied',{name:b});}},
 ]);}},
 {id:'ev_kindkid',min:6,max:12,w:3,run:()=>{const n=pick(FEMALE.concat(MALE));ask('The new kid',`A kid named ${n} moved here mid-year and sits alone at lunch, picking at a sandwich, not looking at anyone. You have noticed. So has everyone else, which is the problem.`,[
  {label:'Sit with them',fn:()=>{log(`You sat down across from ${n}, said something dumb about the sandwich, and they laughed like they'd been holding their breath for a month. You were friends by the end of the week.`,'good');addNPC('friend',n,G.age);S.happiness+=4;thread('kindness',{name:n});}},
  {label:'Leave it',fn:()=>{log(`You didn't. It wasn't cruelty, exactly. You just didn't want to be the kid who sat with the kid nobody sat with. ${n} moved away the next summer and you never thought about it again, until years later, when you did.`);}},
 ]);}},
 {id:'ev_grades',min:8,max:17,w:3,run:()=>{ if(S.smarts>60){log(`Your report card came home with a teacher's note on it: "a pleasure to teach." Your mother put it on the fridge with the magnet from the pizza place, where it stayed for years.`,'good');S.happiness+=3;} else {log(`Your grades slipped this year. Your father asked what was going on and you said nothing, which was true, in the sense that nothing was going on and that was the problem.`);S.stress+=3;}}},
 {id:'ev_petdies',min:6,max:16,w:2,run:()=>log(`The dog died. It happened slowly and then all at once, the way it does, and you were the one who found him in the morning. You didn't cry until later, alone, and then you couldn't stop.`,'bad',()=>{S.happiness-=8;})},
 {id:'ev_teenparty',min:14,max:17,w:4,run:()=>ask('The party',`There's a party at a house whose parents are out of town. Everyone is going. There will be beer and probably worse, and if your parents knew where you were they would end you.`,[
  {label:'Go',fn:()=>{if(chance(0.25)){log(`The cops came at eleven. You ran out the back and cut your hand on a fence and lay in someone's flowerbed for forty minutes listening to a radio crackle. It is, honestly, one of the best nights of your life.`,'good');S.happiness+=6;K.stealth+=3;} else {log(`You went. You drank something orange from a cooler, kissed someone in a hallway, and threw up in a bush. You felt, briefly, like a person in a movie.`,'good');S.happiness+=5;K.charisma+=2;G.addiction.alcohol+=4;}}},
  {label:'Stay home',fn:()=>{log(`You stayed home. On Monday everyone had a story and you had the plot of a book you'd read. You told yourself it didn't matter. It sort of did.`);S.happiness-=2;S.smarts+=1;}},
 ])},
 {id:'ev_firstlove',min:15,max:19,w:3,cond:()=>!partner(),run:()=>{const n=G.sex==='Male'?pick(FEMALE):pick(MALE);log(`You fell in love with ${n} in a way that made everything before it look like practice. You spent a whole summer in their passenger seat. It ended in October, badly, over something neither of you could later remember. You have never quite gotten over the way it felt at the start.`);S.happiness+=3;K.charisma+=3;const p=addNPC('ex',n,G.age+rnd(-1,2));p.loyalty=35;p.memory.push(`Dated ${G.name} at ${G.age}. Ended badly.`);}},
 {id:'ev_layoff',min:22,max:62,w:3,cond:()=>G.job&&JOB[G.job.id].kind==='full',run:()=>{const j=JOB[G.job.id];if(chance(0.5)){log(`The company "restructured." Your whole department got a meeting invite with no agenda, which is how you knew. You cleaned out your desk into a box that used to hold printer paper. ${j.title}, gone in a morning.`,'bad');quitJob(true);S.stress+=15;S.happiness-=10;} else {log(`Rumors of layoffs went around the office for months. You lived on coffee and dread. In the end your team was spared, and you went back to pretending it had never worried you.`);S.stress+=6;}}},
 {id:'ev_raise',min:20,max:65,w:3,cond:()=>G.job&&G.job.perf>60,run:()=>{const r=Math.round(JOB[G.job.id].pay*rnd(4,12)/100);G.job.bonus=(G.job.bonus||0)+r;log(`Your manager pulled you aside, closed the door, and told you the company wanted to keep you. Your salary went up by ${money(r)}. You called someone from the parking garage to tell them.`,'money');S.happiness+=4;}},
 {id:'ev_mentor',min:19,max:40,w:2,cond:()=>G.job,run:()=>{const n=pick(MALE.concat(FEMALE));log(`An older colleague named ${n} took an interest in you for no reason you could see. They gave you the advice nobody else would, corrected you in private and praised you in public, and told you once, drunk at a work party, that you reminded them of themselves. You took it for granted.`,'good');thread('mentor',{name:n});K.business+=4;}},
 {id:'ev_carwreck',min:16,max:80,w:2,cond:()=>hasTag('car')||hasTag('moto'),run:()=>{const drunk=G.addiction.alcohol>30&&chance(0.5);if(chance(0.6)){log(`Someone ran a red light and folded the front of your car like a paper cup. You walked away shaking. The insurance fight took eight months.`,'bad');S.health-=8;S.stress+=8;damageVehicle(40);} else {log(`You wrecked the car. ${drunk?'You had been drinking, and you know exactly how much, and so does the officer who found you.':'It was raining and you were going too fast and there was a deer.'} `,'bad');S.health-=15;damageVehicle(70);if(drunk){thread('dui',{});G.record.push({crime:'DUI',age:G.age});S.stress+=15;}}}},
 {id:'ev_parentsick',min:25,max:60,w:2,cond:()=>livingParents().length>0&&!(G.arcs||[]).some(a=>a.id==='caregiver'),run:()=>{const p=pick(livingParents());ask('The call',`Your ${p.role} is sick. The kind of sick with a schedule of appointments and a word nobody says out loud. They need someone to drive them, sit with them, deal with the paperwork. It will eat your year.`,[
  {label:'Be there',sub:'Whatever it costs you.',fn:()=>{log(`You were there for every appointment. You learned the nurses' names and the good vending machine and what your ${p.role} looked like when they were scared and trying not to be. It cost you at work and it cost you at home and you would do it again.`,'good');p.loyalty=clamp(p.loyalty+25);p.memory.push(`${G.name} was there when I was sick.`);S.stress+=15;S.happiness-=3;if(G.job)G.job.perf-=10;family().forEach(f=>{if(f!==p)f.loyalty=clamp(f.loyalty+8);});startArc('caregiver',{npc:p.id,support:2});}},
  {label:'Send money, stay away',fn:()=>{const c=Math.min(G.cash,8000);pay(c);log(`You sent money and called on Sundays. It was easier, and you told yourself it was practical. Your ${p.role} never said a word about it. Your siblings did.`);p.loyalty=clamp(p.loyalty-15);p.memory.push(`${G.name} sent money instead of coming.`);family().forEach(f=>{if(f!==p)f.loyalty=clamp(f.loyalty-12);});thread('absent',{npc:p.id});}},
 ]);}},
 {id:'ev_friendneed',min:18,max:70,w:3,cond:()=>friends().length>0&&G.cash>2000,run:()=>{const f=pick(friends());const amt=Math.min(Math.round(G.cash*0.3),rnd(1500,15000));ask(`${f.name} needs help`,`${f.name} calls late, voice wrong. They're in trouble with money — the specifics are messy and involve a car and a cousin and a deadline. They need ${money(amt)} and they need it this week. They have never asked you for anything.`,[
  {label:`Lend the ${money(amt)}`,fn:()=>{pay(amt);log(`You sent it. ${f.name} cried on the phone and promised to pay it back, and you both knew the promise was the point, not the money.`,'good');f.loyalty=clamp(f.loyalty+20);f.memory.push(`${G.name} lent me ${money(amt)} when I was drowning.`);thread('lent',{npc:f.id,amt});}},
  {label:'Say no',fn:()=>{log(`You said no, gently, with reasons. ${f.name} said they understood. The calls got shorter after that, and then stopped.`);f.loyalty=clamp(f.loyalty-30);f.memory.push(`I asked ${G.name} for help once. They said no.`);}},
 ]);}},
 {id:'ev_windfall',min:18,max:90,w:1,run:()=>{const a=rnd(2000,40000);G.cash+=a;log(`A relative you barely remember died and left you ${money(a)}, along with a box of photographs of people you can't identify. You kept the box.`,'money');}},
 {id:'ev_medical',min:30,max:90,w:3,cond:()=>S.health<55,run:()=>{const bill=rnd(4000,60000);ask('The diagnosis',`The doctor used a lot of words and one of them was "serious." Treatment will cost around ${money(bill)} and take a year of your attention. Without it, you are gambling.`,[
  {label:'Get treated',fn:()=>{pay(bill,true);log(`You did the treatment. It was tedious and humiliating and it worked, mostly. You have a scar and a new relationship with your own mortality.`,'good');S.health+=18;S.stress+=8;}},
  {label:'Refuse',sub:'It might be fine.',fn:()=>{if(chance(0.4)){log(`You refused, and it turned out to be fine, and you have told the story at parties ever since as if it proves something. It doesn't.`);}else{log(`You refused. It got worse. By the time you went back it was harder and more expensive, and the doctor didn't say "I told you so," which was somehow worse.`,'bad');S.health-=20;pay(bill*1.6,true);}}},
 ]);}},
 {id:'ev_affairoffer',min:24,max:60,w:2,cond:()=>partner()&&!!G.job,run:()=>{const n=G.sex==='Male'?pick(FEMALE):pick(MALE);ask('After the conference',`A coworker named ${n} has been finding reasons to talk to you for months. Tonight, in a hotel bar three cities from home, they stop pretending. Nobody would know.`,[
  {label:'Go upstairs',fn:()=>{const p=partner();log(`You went upstairs. It was exactly as good and as terrible as you knew it would be. In the morning you flew home and kissed ${p.name} at the door and felt, for the first time, like a stranger in your own house.`);S.happiness+=3;S.stress+=10;thread('cheated',{npc:p.id,name:n});}},
  {label:'Say goodnight',fn:()=>{log(`You said goodnight and went up alone and lay awake feeling virtuous and robbed in equal measure. ${n} was cool to you at work after that. You never told anyone, and there was nothing to tell, which is the point.`,'good');S.happiness+=1;S.stress-=2;}},
 ]);}},
 {id:'ev_lotteryfriend',min:18,max:80,w:1,run:()=>log(`A guy you went to high school with won the lottery. Not a lot — six figures — but enough that he quit the plant and bought a boat and posted about it constantly. You felt something ugly and small and were not proud of it.`,()=>{S.happiness-=2;})},
 {id:'ev_burglary',min:20,max:90,w:2,cond:()=>G.home&&G.home!=='parents',run:()=>{const loss=Math.min(G.cash,rnd(500,6000));pay(loss);log(`Someone broke into your place while you were out. They took ${money(loss)} in cash and electronics and, worse, went through your drawers. You changed the locks and didn't sleep right for a month.`,'bad');S.stress+=10;S.happiness-=5;}},
 {id:'ev_kidtrouble',min:30,max:70,w:3,cond:()=>kids().some(k=>k.age>=13&&k.age<=18),run:()=>{const k=pick(kids().filter(k=>k.age>=13&&k.age<=18));ask(`${k.name}, ${k.age}`,`The school calls. ${k.name} was caught with something they shouldn't have had, and there's a meeting, and a tone in the principal's voice that suggests this isn't the first thing.`,[
  {label:'Come down hard',fn:()=>{log(`You came down hard: phone gone, door off the hinges, the works. ${k.name} stopped talking to you for months. Whether it worked is a question you'll be asking for years.`);k.loyalty=clamp(k.loyalty-15);k.memory.push(`Got caught at school. Parent lost it.`);S.stress+=8;}},
  {label:'Sit and listen',fn:()=>{log(`You sat on the edge of the bed and didn't say anything for a long time, and eventually ${k.name} talked. It wasn't about the thing at school. It never is. You didn't fix it, but you were in the room.`,'good');k.loyalty=clamp(k.loyalty+15);k.memory.push(`Got caught at school. Parent actually listened.`);}},
  {label:'Let the other parent handle it',cond:()=>!!partner(),fn:()=>{log(`You let ${partner()?partner().name:'your spouse'} handle it. You were busy. ${k.name} noticed which parent showed up.`);k.loyalty=clamp(k.loyalty-10);k.memory.push(`Only one parent came to the meeting. Not this one.`);thread('neglected',{npc:k.id});}},
 ]);}},
 {id:'ev_reunion',min:28,max:60,w:2,run:()=>log(`Your class reunion happened in a hotel ballroom with a cash bar. Everyone was fatter and kinder than you remembered. Someone said you looked exactly the same, which was a lie, and you loved them for it.`,()=>{S.happiness+=3;})},
 {id:'ev_tax',min:22,max:80,w:2,cond:()=>G.cash>20000,run:()=>{const a=Math.round(G.cash*rnd(4,12)/100);pay(a,true);log(`The tax people found a mistake from three years ago. It was your mistake. They wanted ${money(a)} and they were not interested in your feelings about it.`,'bad');S.stress+=6;}},
 {id:'ev_fanmail',min:18,max:80,w:3,cond:()=>S.fame>30,run:()=>{if(chance(0.5)){log(`A stranger recognized you at a gas station and asked for a picture. Their hands were shaking. You were kind about it, and drove away feeling like a fraud and a king at once.`,'good');S.happiness+=3;}else{log(`Someone posted a photo of you looking terrible outside a pharmacy and it got two million views. The comments were a lesson in what people think they're owed by a face they know.`,'bad');S.happiness-=5;S.stress+=6;}}},
 {id:'ev_scandal',min:20,max:80,w:2,cond:()=>S.fame>40&&(G.addiction.drugs>30||G.record.length>0),run:()=>log(`A tabloid ran a story about you. The details were mostly right, which was the problem. Your publicist used the word "narrative" a lot. Your mother called and asked if it was true and you said it was complicated.`,'bad',()=>{S.fame-=6;S.happiness-=8;S.stress+=12;})},
 {id:'ev_stalker',min:22,max:60,w:1,cond:()=>S.fame>60,run:()=>log(`Someone has been sending letters. Then they were outside the gate. Then they were inside it. You have security now, and a restraining order, and a new understanding of what a locked door is for.`,'bad',()=>{S.stress+=15;pay(30000,true);})},
 {id:'ev_midlife',min:40,max:52,w:2,run:()=>ask('The thing at 3 a.m.',`You woke at 3 a.m. with the clear, cold knowledge that more of your life is behind you than ahead. It isn't a thought so much as a temperature. It stays with you all week.`,[
  {label:'Buy something loud',sub:'The cliché exists for a reason.',fn:()=>{const c=Math.min(G.cash,60000);pay(c);log(`You bought something loud and red and impractical. It did not fix anything, and it was also completely worth it, and both of those things are true.`);S.happiness+=6;}},
  {label:'Sit with it',fn:()=>{log(`You sat with it. You called someone you'd been meaning to call. You went for a walk without your phone. It didn't go away, but it got quieter, and you got better at hearing what it was actually saying.`,'good');S.stress-=8;K.discipline+=3;}},
 ])},
 {id:'ev_grandkid',min:45,max:85,w:2,cond:()=>kids().some(k=>k.age>=24),run:()=>log(`A grandchild. You held a person who will remember you as old and think of you as having always been old, and you decided you didn't mind.`,'good',()=>{S.happiness+=10;})},
 {id:'ev_oldfriend',min:35,max:90,w:2,cond:()=>friends().length>0,run:()=>{const f=pick(friends());log(`${f.name} came through town and you got dinner. Three hours vanished. Walking to the car you realized how few people are left who knew you before you were finished being made.`,'good');S.happiness+=5;f.loyalty=clamp(f.loyalty+6);}},
 {id:'ev_spousedistance',min:28,max:70,w:3,cond:()=>partner()&&partner().loyalty<45,run:()=>{const p=partner();ask('The quiet',`Something has gone quiet between you and ${p.name}. Not a fight. Worse than a fight: the absence of one. You pass in the kitchen like coworkers. You know exactly when it started and you have been not saying so for a year.`,[
  {label:'Say it out loud',fn:()=>{if(chance(0.5+K.charisma/250)){log(`You said it out loud. It was a terrible conversation and then a long one and then, near midnight, an honest one. Nothing was fixed. But you were in the same room again, actually in it.`,'good');p.loyalty=clamp(p.loyalty+18);p.memory.push(`${G.name} finally talked to me about the distance.`);}else{log(`You said it out loud. ${p.name} said "I know," and that was somehow the end of the conversation. Some things, once named, stop pretending.`,'bad');p.loyalty=clamp(p.loyalty-10);}}},
  {label:'Let it ride',fn:()=>{log(`You let it ride. There's a comfort in not knowing what the other person would say. You told yourself all marriages have seasons. This one had a winter.`);p.loyalty=clamp(p.loyalty-12);p.memory.push(`${G.name} let the silence sit.`);}},
 ]);}},
 {id:'ev_promo_offer',min:22,max:68,w:2,cond:()=>G.job&&(JOB[G.job.id].next||[]).map(id=>JOB[id]).filter(Boolean).some(n=>promotionReadiness(n).ready),run:()=>{const ready=(JOB[G.job.id].next||[]).map(id=>JOB[id]).filter(n=>n&&promotionReadiness(n).ready),nj=pick(ready),nx=nj.id;ask('The offer',`Your tenure, sustained effort, qualifications, and support inside the office have finally lined up. Your supervisor offers you the ${nj.title} job at ${money(nj.pay)}. More authority, more scrutiny, and a new set of people whose opinions will matter.`,[
  {label:'Take it',fn:()=>{promoteJob(nx);S.stress=clamp(S.stress+8);}},
  {label:'Turn it down',fn:()=>{log(`You turned down the ${nj.title} role. Your boss looked surprised, then almost envious. You went home on time and discovered the evening was still there.`);S.stress=clamp(S.stress-8);S.happiness=clamp(S.happiness+4);G.job.lastPromotionReviewYear=G.year;}},
 ]);}},
 {id:'ev_addictbottom',min:16,max:90,w:5,cond:()=>G.addiction.alcohol>60||G.addiction.drugs>60,run:()=>{const which=G.addiction.drugs>G.addiction.alcohol?'drugs':'alcohol';const loss=Math.min(G.cash,rnd(1000,20000));pay(loss);log(`This was a lost year. ${which==='drugs'?'The drugs':'The drinking'} took ${money(loss)} and most of your mornings and at least one relationship you didn't notice ending. You look older than you are. People have stopped saying anything, which is how you know it's bad.`,'bad');S.health-=10;S.looks-=4;S.happiness-=6;if(G.job&&chance(0.4)){log(`You lost the job. There was an incident. Nobody uses the word "fired" to your face.`,'bad');quitJob(true);}allNPCs().forEach(n=>n.loyalty=clamp(n.loyalty-8));}},
 {id:'ev_famous_chance',min:16,max:45,w:2,cond:()=>!G.special&&(K.acting>40||K.music>40||K.athletics>50),run:()=>{const c=K.acting>=K.music&&K.acting>=K.athletics?'actor':K.music>=K.athletics?'musician':'athlete';log(`Someone who matters saw you ${c==='actor'?'in a small show':c==='musician'?'play a set':'play'} and left a card. "Call me," they said. You could hear the shape of a different life in it.`,'good');G.flags.scout=c;}},
 {id:'ev_prop_break',min:18,max:90,w:3,cond:()=>G.props.some(p=>p.cond<50),run:()=>{const p=pick(G.props.filter(p=>p.cond<50));const c=Math.round(PROP[p.id].price*0.02+rnd(1000,8000));pay(c,true);log(`Something failed at the ${PROP[p.id].name.toLowerCase()} — a pipe, a roof, the furnace at 2 a.m. in January. You had been putting off the maintenance. It cost ${money(c)}, which is what putting it off costs.`,'bad');p.cond=clamp(p.cond-10);S.stress+=6;}},
